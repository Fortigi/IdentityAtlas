<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a140a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo {
      width: 200px;
      object-fit: contain;
      margin-bottom: 32px;
      filter: drop-shadow(0 0 18px rgba(132, 195, 65, 0.35));
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(132, 195, 65, 0.15);
      border-top-color: #84c341;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img class="logo" src="build/icon-dark.png" alt="Identity Atlas">
  <div class="spinner"></div>
</body>
</html>
