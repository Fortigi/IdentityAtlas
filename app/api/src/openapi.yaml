openapi: 3.0.3
info:
  title: Identity Atlas Ingest API
  version: 3.4.0
  description: |
    REST API for ingesting authorization data from any source system into Identity Atlas.
    Crawlers authenticate with API keys (Bearer token) and POST batches of records.
    The API handles validation, bulk merge, scoped delete detection, and temporal versioning.

    **Scope:** this specification covers only the **ingest + crawler-admin** surface —
    the endpoints crawlers and the crawler-management UI call. The authenticated
    **read API** consumed by the web UI (matrix & permissions, identities, resources,
    governance & business roles, risk scores, contexts, entity detail, org-chart, tags,
    account-linking — 100+ routes) is **not** described here; see the API reference under
    `docs/api/` for those.
  contact:
    name: Fortigi
    url: https://github.com/Fortigi/IdentityAtlas

servers:
  - url: /api
    description: Relative to deployment root

security:
  - CrawlerApiKey: []

tags:
  - name: Ingest
    description: Data ingestion endpoints — one per entity type
  - name: Crawlers
    description: Crawler self-service (API key rotation, identity)
  - name: Admin
    description: Crawler management (requires Entra ID auth)
  - name: Effective Access
    description: On-demand effective-access resolution — computed per request, never stored
  - name: Attribute Labels
    description: Display names for extendedAttributes keys — shared by the web UI and the Power Query workbook
  - name: Reports
    description: Pluggable reports — self-describing templates, computed per request
  - name: Custom Reports
    description: >
      Experimental report builder (feature flag `customReports`). Every route answers 404 while
      the feature is off. The caller's permission is checked first, so a caller without it gets
      403 whether or not the feature is on.
  - name: Context Assistant
    description: >
      Experimental context builder (feature flag `contextAssistant`). An analyst describes a
      subject, the local model proposes search terms, and the terms are searched for; the result
      is stored as the parameters of the `context-recipe` context plugin. Every route answers
      404 while the feature is off. The caller's permission is checked first, so a caller without
      it gets 403 whether or not the feature is on.

paths:
  # ─── Ingest Endpoints ──────────────────────────────────────────
  /ingest/systems:
    post:
      tags: [Ingest]
      summary: Ingest systems
      operationId: ingestSystems
      description: Upsert system records. Systems don't require a systemId in the envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          description: Ingest successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ingest/principals:
    post:
      tags: [Ingest]
      summary: Ingest principals
      operationId: ingestPrincipals
      description: Upsert principal records (users, service principals, etc.). Scope by principalType for full sync deletes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'

  /ingest/resources:
    post:
      tags: [Ingest]
      summary: Ingest resources
      operationId: ingestResources
      description: Upsert resource records (groups, roles, apps, business roles). Scope by resourceType.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/resource-assignments:
    post:
      tags: [Ingest]
      summary: Ingest resource assignments
      operationId: ingestResourceAssignments
      description: Upsert assignments (who has access to what). Composite key (resourceId, principalId, assignmentType). Scope by assignmentType.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/resource-relationships:
    post:
      tags: [Ingest]
      summary: Ingest resource relationships
      operationId: ingestResourceRelationships
      description: Upsert resource-to-resource links (Contains, GrantsAccessTo). Scope by relationshipType.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/identities:
    post:
      tags: [Ingest]
      summary: Ingest identities
      operationId: ingestIdentities
      description: Upsert real-person identity records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/identity-members:
    post:
      tags: [Ingest]
      summary: Ingest identity members
      operationId: ingestIdentityMembers
      description: Upsert identity-to-principal links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/contexts:
    post:
      tags: [Ingest]
      summary: Ingest contexts
      operationId: ingestContexts
      description: Upsert organizational contexts (departments, OUs, classifications). Scope by contextType.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/governance/catalogs:
    post:
      tags: [Ingest]
      summary: Ingest governance catalogs
      operationId: ingestGovernanceCatalogs
      description: Upsert governance catalogs (access-package catalogs / IGA sources).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/governance/policies:
    post:
      tags: [Ingest]
      summary: Ingest assignment policies
      operationId: ingestAssignmentPolicies
      description: Upsert assignment policies (approval and settings for business-role assignment).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/governance/requests:
    post:
      tags: [Ingest]
      summary: Ingest assignment requests
      operationId: ingestAssignmentRequests
      description: Upsert assignment requests (access requests and their state).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/governance/certifications:
    post:
      tags: [Ingest]
      summary: Ingest certification decisions
      operationId: ingestCertificationDecisions
      description: Upsert certification decisions (access-review outcomes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/reconcile:
    post:
      tags: [Ingest]
      summary: Reconcile a streamed full sync by timestamp
      operationId: reconcileStale
      description: >-
        The full-sync delete for a crawler that streams its source in independent
        delta chunks instead of one sync session (sources of tens of millions of
        rows). Every row of the given system and scope that no ingest has touched
        since `before` is reconciled away: soft-deleted (deletedAt stamped) on
        Principals, Resources and ResourceAssignments, removed on other tables.
        Entities without a system scope (identities, identity-members, contexts,
        context-members) are refused. Use the `serverTime` from GET /crawlers/whoami,
        read at the start of the run, as `before`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
      responses:
        '200':
          description: Reconcile result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ingest/refresh-views:
    post:
      tags: [Ingest]
      summary: Refresh materialized views
      operationId: refreshMaterializedViews
      description: Triggers a refresh of cached SQL views. Requires refreshViews permission.
      responses:
        '200':
          description: Views refreshed
        '403':
          $ref: '#/components/responses/Forbidden'

  # ─── Crawler Self-Service ───────────────────────────────────────
  /crawlers/whoami:
    get:
      tags: [Crawlers]
      summary: Get own identity
      operationId: getOwnCrawlerIdentity
      description: Returns the authenticated crawler's metadata.
      responses:
        '200':
          description: Crawler metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlerInfo'

  /crawlers/rotate:
    post:
      tags: [Crawlers]
      summary: Rotate own API key
      operationId: rotateOwnApiKey
      description: Generates a new key and immediately invalidates the current one.
      responses:
        '200':
          description: New key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateResult'

  # ─── Admin Crawler Management ───────────────────────────────────
  /admin/crawlers:
    get:
      tags: [Admin]
      summary: List all crawlers
      operationId: listCrawlers
      description: List all registered crawlers (Entra ID auth required).
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: List of crawlers
    post:
      tags: [Admin]
      summary: Register a new crawler
      operationId: registerCrawler
      description: Register a new crawler and return its one-time API key.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCrawler'
      responses:
        '201':
          description: Crawler created with one-time API key
        '400':
          description: Missing displayName or permissions outside the allowed set

  /admin/crawlers/{id}:
    patch:
      tags: [Admin]
      summary: Update crawler
      operationId: updateCrawler
      description: >-
        Update a crawler's metadata, permissions, or system scope. The built-in
        worker crawler only accepts description and rateLimit changes.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated
        '400':
          description: Permissions outside the allowed set
        '403':
          description: The built-in worker crawler cannot be changed this way
        '404':
          description: Crawler not found
    delete:
      tags: [Admin]
      summary: Disable crawler
      operationId: disableCrawler
      description: >-
        Disable a crawler (soft delete; its API key stops working). The built-in
        worker crawler cannot be disabled or deleted.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Disabled
        '403':
          description: The built-in worker crawler cannot be disabled or deleted
        '404':
          description: Crawler not found

  /admin/crawlers/{id}/reset:
    post:
      tags: [Admin]
      summary: Admin-initiated key reset
      operationId: resetCrawlerKey
      description: Admin-initiated API-key reset; returns a new one-time key.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: New key returned

  /admin/crawlers/{id}/audit:
    get:
      tags: [Admin]
      summary: Get crawler audit log
      operationId: getCrawlerAuditLog
      description: Return the crawler's paginated audit log.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated audit log

  /effective-access/resolve:
    get:
      tags: [Effective Access]
      summary: Effective access of one principal on one resource
      operationId: resolveEffectiveAccess
      description: >
        Resolves whether a principal effectively holds a resource — direct grants plus grants
        reached via (transitive) group membership — returning the effect and the reachability
        badge (Direct / Indirect / Eligible).
      security:
        - EntraIdBearer: []
      parameters:
        - name: resourceId
          in: query
          required: true
          schema: { type: string }
        - name: principalId
          in: query
          required: true
          schema: { type: string }
        - name: policy
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Effective-access result (effective, badge, decisiveAce)
        '400':
          description: Missing required parameter, or unknown resolution policy

  /resource/{id}/effective-access:
    get:
      tags: [Effective Access]
      summary: Effective capabilities a principal holds at a resource/node
      operationId: getResourceEffectiveAccess
      description: >
        Down-expansion: includes capabilities inherited from ancestor nodes via the Contains
        hierarchy, computed on demand and never stored. One row per capability.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: principalId
          in: query
          required: true
          schema: { type: string }
        - name: policy
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Per-capability effective access at the node
        '400':
          description: Missing principalId, or unknown resolution policy

  /principal/{id}/effective-access:
    get:
      tags: [Effective Access]
      summary: Effective capabilities a principal holds at a given node
      operationId: getPrincipalEffectiveAccess
      description: >
        Principal-centric form of the node down-expansion; includes inherited capabilities.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: node
          in: query
          required: true
          schema: { type: string }
        - name: policy
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Per-capability effective access at the node
        '400':
          description: Missing node, or unknown resolution policy

  /attribute-labels:
    get:
      tags: [Attribute Labels]
      summary: Display names for extendedAttributes keys
      operationId: getAttributeLabels
      description: >
        Maps each stored `extendedAttributes` key to the name it should be shown under, so
        every reader renders the same string. Entra directory-extension keys
        (`extension_<32-hex appId>_<name>`) resolve to their tail verbatim
        (`sAMAccountName`); a crawler-stamped `attributeDisplayNames` map on the source
        System wins over that rule and is what disambiguates two extension apps defining
        the same attribute name. Storage keys are never changed — filters and sorts keep
        addressing the raw key. Only keys that are actually relabelled are returned, so an
        absent key means "show it the way you always did". Documented because the Power
        Query export workbook calls it directly to title its columns.
      security:
        - EntraIdBearer: []
      parameters:
        - name: target
          in: query
          description: Which table's keys to label. Omit for the union of all four.
          schema:
            type: string
            enum: [principal, resource, identity, system]
      responses:
        '200':
          description: Label map (empty when nothing needs relabelling, or on lookup failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: object
                    additionalProperties:
                      type: string
        '400':
          description: Unknown target

  # ─── Reports ───────────────────────────────────────────────────
  /reports:
    get:
      tags: [Reports]
      summary: List the registered report templates
      operationId: listReports
      description: >
        Metadata for every report a deployment offers. Each entry declares its presentation
        `form` and its `columns`; a client renders a report from that metadata alone and never
        needs to know the report by name.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Registered report templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportMetadata'
                  total:
                    type: integer

  /reports/{name}/rows:
    get:
      tags: [Reports]
      summary: Run a report and return its rows
      operationId: runReport
      description: >
        Runs the named report template against the current data and returns its rows. Content is
        computed per request — there are no stored runs, so a re-fetch always reflects the latest
        data. Any query parameters are passed to the template as its parameters.
      security:
        - EntraIdBearer: []
      parameters:
        - name: name
          in: path
          required: true
          description: Report template name, as returned by `GET /reports`.
          schema: { type: string }
      responses:
        '200':
          description: Report content
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ReportMetadata'
                  - type: object
                    properties:
                      rows:
                        type: array
                        description: >
                          One object per row, keyed by the report's column keys. An optional
                          `_entity` property ({kind, id}) links the row to an entity detail page.
                        items:
                          type: object
                          additionalProperties: true
                      total:
                        type: integer
                      truncated:
                        type: boolean
                        description: >
                          True when the report stopped at its row cap, so `rows` holds only the first
                          `total` rows. Custom reports cap at their definition's limit (1,000 by default).
                      generatedAt:
                        type: string
                        format: date-time
        '404':
          description: No report template with that name is registered
        '500':
          description: The report template failed to run

  /reports/{name}/export:
    get:
      tags: [Reports]
      summary: Download a report as a file
      operationId: exportReport
      description: >
        Runs the named report template and returns the result as a downloadable file, with a
        `Content-Disposition: attachment` filename of `identity-atlas-<report>-<date>.<ext>`.
        The content is computed for this request, exactly as `/reports/{name}/rows` computes it,
        so a download always matches what the page shows. Any query parameter other than
        `format` is passed to the template as its parameters.
      security:
        - EntraIdBearer: []
      parameters:
        - name: name
          in: path
          required: true
          description: Report template name, as returned by `GET /reports`.
          schema: { type: string }
        - name: format
          in: query
          required: false
          description: >
            One of the report's advertised `exportFormats`. `csv` holds the declared columns as
            an RFC-4180 table; `json` holds the whole payload (metadata, rows, `generatedAt`).
          schema:
            type: string
            enum: [csv, json]
            default: csv
      responses:
        '200':
          description: The report as a file
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ReportMetadata'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      total:
                        type: integer
                      truncated:
                        type: boolean
                        description: True when the report stopped at its row cap; the file then holds only the first rows.
                      generatedAt:
                        type: string
                        format: date-time
        '400':
          description: The requested format is not one this deployment serves
        '404':
          description: No report template with that name is registered
        '500':
          description: The report template failed to run

  # ─── Custom Reports (experimental) ─────────────────────────────
  /nl-reports/catalog:
    get:
      tags: [Custom Reports]
      summary: Report builder catalog
      operationId: getCustomReportCatalog
      description: >
        The entities, fields, relations, operators and pickable columns a report definition may
        use, with the known values of enumerated fields. Alongside the fields every deployment has,
        this includes the `extendedAttributes` keys discovered in this deployment's own data, named
        `ext.<rawKey>` and marked `discovered`. Requires `data.write.reports`; answers 404 while the
        `customReports` feature is off.

      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Builder catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: object
                    description: Keyed by entity name.
                    additionalProperties:
                      type: object
                      properties:
                        label: { type: string }
                        table: { type: string }
                        description: { type: string }
                        compareRelations:
                          type: array
                          items: { type: string }
                        defaultColumns:
                          type: array
                          items: { type: string }
                        fields:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              label: { type: string }
                              type: { type: string }
                              values:
                                type: array
                                description: Known values, for enumerated fields only.
                                items: { type: string }
                              discovered:
                                type: boolean
                                description: >
                                  Present on a field read from this deployment's own
                                  `extendedAttributes` rather than from the shared catalog.
                        relations:

                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              label: { type: string }
                              target: { type: string }
                              cardinality: { type: string }
                        columns:
                          type: array
                          items:
                            $ref: '#/components/schemas/ReportColumn'
                        groupableFields:
                          type: array
                          description: The fields this entity can be counted per (no date fields).
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              label: { type: string }
                              discovered: { type: boolean }
                  operators:

                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        label: { type: string }
                        needsValue: { type: boolean }
                  operatorsByType:
                    type: object
                    description: Operator names allowed per field type.
                    additionalProperties:
                      type: array
                      items: { type: string }
                  compareMeasures:
                    type: object
                    description: Compare measure name → label.
                    additionalProperties: { type: string }
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '500':
          $ref: '#/components/responses/CustomReportsFailed'

  /nl-reports/lookup:
    get:
      tags: [Custom Reports]
      summary: Search object names for a compare reference
      operationId: lookupCustomReportNames
      description: >
        Fuzzy name search used by the builder's reference picker. A search text shorter than 2
        or longer than 100 characters returns an empty list. Requires `data.write.reports`;
        answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      parameters:
        - name: entity
          in: query
          required: true
          description: Entity name from the catalog.
          schema: { type: string }
        - name: q
          in: query
          required: true
          description: Search text.
          schema: { type: string }
      responses:
        '200':
          description: Best matches, most similar first (at most 5)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        type:
                          type: string
                          nullable: true
                        score: { type: number }
        '400':
          description: Unknown entity
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '500':
          $ref: '#/components/responses/CustomReportsFailed'

  /nl-reports/status:
    get:
      tags: [Custom Reports]
      summary: Report generator availability
      operationId: getCustomReportGeneratorStatus
      description: >
        Whether the local model server is reachable and serves the configured model. Never fails
        on an unreachable server — it reports `available: false` with a reason instead. Requires
        `data.write.reports`; answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Generator status
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  model:
                    type: string
                    nullable: true
                  loaded: { type: boolean }
                  promptCache:
                    type: string
                    enum: [cold, warming, ready, failed]
                  reason:
                    type: string
                    nullable: true
                    description: "`model-not-installed` or `server-unreachable`; null when available."
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'

  /nl-reports/warm:
    post:
      tags: [Custom Reports]
      summary: Warm up the report generator
      operationId: warmCustomReportGenerator
      description: >
        Loads the configured model and restores its prompt cache. Waits at most a few seconds:
        when the warm-up is still running it answers `state: preparing` and continues in the
        background. Requires `data.write.reports`; answers 404 while the `customReports` feature
        is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Warm-up finished (`ready`) or still running (`preparing`)
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    type: string
                    enum: [ready, preparing]
                  model:
                    type: string
                    description: Present when ready.
                  ms:
                    type: integer
                    description: Warm-up duration, present when ready.
                  restored:
                    type: boolean
                    description: Whether a saved prompt cache was restored (llama.cpp backend only).
                  message:
                    type: string
                    description: Present while preparing.
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '502':
          $ref: '#/components/responses/ModelServerFailed'

  /nl-reports/interpret:
    post:
      tags: [Custom Reports]
      summary: Turn a question into a report definition
      operationId: interpretCustomReportQuestion
      description: >
        Sends a plain-language question (plus earlier conversation turns) to the local model and
        returns a validated report definition (`report`), a definition whose named objects need
        confirming (`confirm`), a clarifying question (`clarify`), or `error` when the model's
        answer could not be used. Requires `data.write.reports`; answers 404 while the
        `customReports` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  maxLength: 2000
                history:
                  type: array
                  maxItems: 12
                  description: Earlier turns, at most 10,000 characters of content in total.
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                        maxLength: 20000
                model:
                  type: string
                  pattern: '^[A-Za-z0-9._:/-]{1,100}$'
                  description: Evaluation override of the configured model; the UI never sends it.
      responses:
        '200':
          description: The model's interpretation
          content:
            application/json:
              schema:
                type: object
                required: [kind]
                properties:
                  kind:
                    type: string
                    enum: [report, confirm, clarify, error]
                  spec:
                    $ref: '#/components/schemas/ReportDefinition'
                  confirm:
                    $ref: '#/components/schemas/ReportConfirmation'
                  explanation:
                    $ref: '#/components/schemas/ReportExplanation'
                  assumptions:
                    type: array
                    items: { type: string }
                  warnings:
                    type: array
                    items: { type: string }
                  sql:
                    type: string
                    description: Compiled SQL (`report` only).
                  question:
                    type: string
                    description: Clarifying question (`clarify` only).
                  options:
                    type: array
                    description: Up to 4 suggested answers (`clarify` only).
                    items: { type: string }
                  message:
                    type: string
                    description: What went wrong (`error` only).
                  errors:
                    type: array
                    items: { type: string }
                  raw:
                    type: string
                    description: The model's raw reply.
                  timing:
                    type: object
                    additionalProperties: true
                  model: { type: string }
                  repaired:
                    type: boolean
                    description: Whether a repair round was needed.
        '400':
          $ref: '#/components/responses/CustomReportsBadRequest'
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '429':
          description: The caller's previous question is still being answered (one at a time per user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '502':
          $ref: '#/components/responses/ModelServerFailed'

  /nl-reports/resolve:
    post:
      tags: [Custom Reports]
      summary: Apply a confirmation answer and look named objects up again
      operationId: resolveCustomReportReferences
      description: >
        Validates a report definition, applies the analyst's answer to a "did you mean"
        confirmation (when `choice` is given), and looks up the objects it names again. No model
        is involved. Requires `data.write.reports`; answers 404 while the `customReports` feature
        is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec:
                  $ref: '#/components/schemas/ReportDefinition'
                choice:
                  type: object
                  required: [path, name]
                  properties:
                    path:
                      type: array
                      description: The `path` of the confirmation being answered.
                      items: { type: integer }
                    name:
                      type: string
                      description: The chosen or typed exact name.
                    id:
                      type: string
                      description: The chosen record, when known.
                    keep:
                      type: boolean
                      description: Use a "name is X" value as written, without checking it again.
      responses:
        '200':
          description: The updated definition and the next confirmation, if any
          content:
            application/json:
              schema:
                type: object
                properties:
                  spec:
                    $ref: '#/components/schemas/ReportDefinition'
                  confirm:
                    allOf:
                      - $ref: '#/components/schemas/ReportConfirmation'
                    nullable: true
                  explanation:
                    $ref: '#/components/schemas/ReportExplanation'
        '400':
          $ref: '#/components/responses/CustomReportsBadRequest'
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '500':
          $ref: '#/components/responses/CustomReportsFailed'

  /nl-reports/run:
    post:
      tags: [Custom Reports]
      summary: Run a report definition
      operationId: runCustomReportDefinition
      description: >
        Validates and runs a report definition in a read-only transaction with a statement
        timeout. A definition that is invalid, or names an object that still needs confirming,
        answers 400 with the errors, the confirmation and the validated definition. Requires
        `data.write.reports`; answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec:
                  $ref: '#/components/schemas/ReportDefinition'
      responses:
        '200':
          description: Report rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  spec:
                    $ref: '#/components/schemas/ReportDefinition'
                  explanation:
                    $ref: '#/components/schemas/ReportExplanation'
                  columns:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportColumn'
                  rows:
                    type: array
                    description: >
                      One object per row, keyed by column key, with an `_entity` property
                      ({kind, id}) linking the row to an entity detail page.
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
                  truncated:
                    type: boolean
                    description: More rows matched than the definition's limit.
                  sql:
                    type: string
                  params:
                    type: array
                    items: {}
                  elapsedMs:
                    type: integer
        '400':
          description: Missing or invalid definition, or a named object needs confirming
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  errors:
                    type: array
                    items: { type: string }
                  confirm:
                    $ref: '#/components/schemas/ReportConfirmation'
                  spec:
                    $ref: '#/components/schemas/ReportDefinition'
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '500':
          $ref: '#/components/responses/CustomReportsFailed'

  /nl-reports/saved:
    post:
      tags: [Custom Reports]
      summary: Save a new custom report
      operationId: createSavedCustomReport
      description: >
        Stores a named report definition. Saved reports are listed, run and downloaded through
        `/reports` as `custom-<id>`. Requires `data.write.reports`; answers 404 while the
        `customReports` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedReportInput'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedReport'
        '400':
          $ref: '#/components/responses/CustomReportsBadRequest'
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '409':
          description: A report with that name already exists
        '500':
          $ref: '#/components/responses/CustomReportsFailed'

  /nl-reports/saved/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Saved report id (UUID), as in `editable.builderId` of the report metadata.
        schema:
          type: string
          format: uuid
    get:
      tags: [Custom Reports]
      summary: Get a saved custom report
      operationId: getSavedCustomReport
      description: >
        One saved report with its definition, for editing in the builder. Requires
        `data.write.reports`; answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Saved report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedReport'
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          description: Report not found, or the feature is off
        '500':
          $ref: '#/components/responses/CustomReportsFailed'
    put:
      tags: [Custom Reports]
      summary: Update a saved custom report
      operationId: updateSavedCustomReport
      description: >
        Replaces a saved report's name, description, question and definition. Requires
        `data.write.reports`; answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedReportInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedReport'
        '400':
          $ref: '#/components/responses/CustomReportsBadRequest'
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          description: Report not found, or the feature is off
        '409':
          description: Another report with that name already exists
        '500':
          $ref: '#/components/responses/CustomReportsFailed'
    delete:
      tags: [Custom Reports]
      summary: Delete a saved custom report
      operationId: deleteSavedCustomReport
      description: >
        Deletes a saved report. Requires `data.write.reports`; answers 404 while the
        `customReports` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          description: Report not found, or the feature is off
        '500':
          $ref: '#/components/responses/CustomReportsFailed'

  /admin/nl-reports/config:
    get:
      tags: [Custom Reports]
      summary: Get the report generator model configuration
      operationId: getCustomReportModelConfig
      description: >
        The configured model and the models installed on the local model server. `fixed` is true
        when the release pins the model, in which case it cannot be changed. Requires
        `admin.llm`; answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Model configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    type: string
                    nullable: true
                  models:
                    type: array
                    description: Empty when the model server is unreachable.
                    items:
                      $ref: '#/components/schemas/ReportGeneratorModel'
                  reachable: { type: boolean }
                  fixed: { type: boolean }
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '500':
          $ref: '#/components/responses/CustomReportsFailed'
    put:
      tags: [Custom Reports]
      summary: Choose the report generator model
      operationId: setCustomReportModelConfig
      description: >
        Selects which installed model generates reports. Requires `admin.llm`; answers 404 while
        the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                  pattern: '^[A-Za-z0-9._:/-]{1,100}$'
      responses:
        '200':
          description: Model saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  model: { type: string }
        '400':
          description: Invalid model name, or the model is not installed on the model server
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '409':
          description: The model is fixed by this release
        '502':
          $ref: '#/components/responses/ModelServerFailed'

  # ─── Context Assistant (experimental) ──────────────────────────
  /context-assistant/options:
    get:
      tags: [Context Assistant]
      summary: What a context recipe may search
      operationId: getContextAssistantOptions
      description: >
        The resource types that exist in this deployment and the text fields a recipe may search.
        Requires `data.write.contexts`; answers 404 while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Scope options
          content:
            application/json:
              schema:
                type: object
                properties:
                  resourceTypes:
                    type: array
                    items: { type: string }
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        label: { type: string }
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'

  /context-assistant/status:
    get:
      tags: [Context Assistant]
      summary: Report generator availability
      operationId: getContextAssistantStatus
      description: >
        Whether the local model server is reachable and serves the configured model. Never fails
        on an unreachable server — it reports `available: false` with a reason instead. The
        builder works without it: the analyst types the search terms themselves. Requires
        `data.write.contexts`; answers 404 while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Generator status
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  model:
                    type: string
                    nullable: true
                  loaded: { type: boolean }
                  promptCache:
                    type: string
                    enum: [cold, warming, ready, failed]
                  reason:
                    type: string
                    nullable: true
                    description: "`model-not-installed` or `server-unreachable`; null when available."
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'

  /context-assistant/warm:
    post:
      tags: [Context Assistant]
      summary: Warm up the context assistant's prompt
      operationId: warmContextAssistant
      description: >
        Loads the model and restores this assistant's prompt cache. The generator has one slot and
        each assistant keeps its own prompt, so custom reports and the context assistant take
        turns; restoring is fast, preparing a prompt for the first time after an update takes
        minutes and continues in the background (`state: preparing`). Requires
        `data.write.contexts`; answers 404 while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Warm-up finished (`ready`), the model is loading (`starting`), or the prompt cache is being prepared (`preparing`)
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    type: string
                    enum: [ready, starting, preparing]
                  model: { type: string }
                  ms: { type: integer }
                  restored: { type: boolean }
                  message: { type: string }
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'
        '502':
          $ref: '#/components/responses/ModelServerFailed'

  /context-assistant/interpret:
    post:
      tags: [Context Assistant]
      summary: Turn a description into search terms
      operationId: interpretContextDescription
      description: >
        Sends a description of the subject (plus earlier conversation turns) to the local model and
        returns proposed search terms (`terms`), one clarifying question (`clarify`), or `error`
        when the model's answer could not be used. Only terms containing the analyst's own words
        arrive with `state: accepted`; everything else the model adds arrives `rejected`, for the
        analyst to tick after seeing what it finds. One question at a time per caller (429).
        Requires `data.write.contexts`; answers 404 while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  maxLength: 2000
                history:
                  type: array
                  maxItems: 12
                  description: Earlier turns, at most 10,000 characters of content in total.
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                        maxLength: 20000
      responses:
        '200':
          description: The model's proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextTermsReply'
        '400':
          $ref: '#/components/responses/ContextAssistantBadRequest'
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'
        '429':
          description: The caller's previous question is still being answered
        '502':
          $ref: '#/components/responses/ModelServerFailed'

  /context-assistant/suggest:
    post:
      tags: [Context Assistant]
      summary: Ask for more search terms
      operationId: suggestContextTerms
      description: >
        Asks the model for terms that are not in the recipe yet, told which terms the analyst kept
        and which they dropped. Requires `data.write.contexts`; answers 404 while the
        `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, recipe]
              properties:
                question:
                  type: string
                  maxLength: 2000
                recipe:
                  $ref: '#/components/schemas/ContextRecipe'
      responses:
        '200':
          description: New terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextTermsReply'
        '400':
          $ref: '#/components/responses/ContextAssistantBadRequest'
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'
        '429':
          description: The caller's previous question is still being answered
        '502':
          $ref: '#/components/responses/ModelServerFailed'

  /context-assistant/evaluate:
    post:
      tags: [Context Assistant]
      summary: What a recipe finds
      operationId: evaluateContextRecipe
      description: >
        Runs the recipe read-only and returns the normalised recipe, per-term numbers (hits, hits
        only that term finds, per field, whether it is too broad) and the matched objects with
        their status. No model involved. Requires `data.write.contexts`; answers 404 while the
        `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipe]
              properties:
                recipe:
                  $ref: '#/components/schemas/ContextRecipe'
      responses:
        '200':
          description: The recipe as it will run, and what it finds
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipe:
                    $ref: '#/components/schemas/ContextRecipe'
                  errors:
                    type: array
                    description: What was dropped or corrected while normalising the recipe.
                    items: { type: string }
                  scopeTotal:
                    type: integer
                    description: Objects in scope, whether they match or not.
                  truncated:
                    type: boolean
                    description: More objects matched than were returned.
                  memberCount:
                    type: integer
                  addedByModel:
                    type: integer
                    description: Members found only by kept terms the model added that carry none of the analyst's own words.
                  terms:
                    type: array
                    items:
                      type: object
                      properties:
                        text: { type: string }
                        key: { type: string }
                        match:
                          type: string
                          enum: [token, wordStart, contains]
                        state:
                          type: string
                          enum: [accepted, rejected]
                        origin:
                          type: string
                          enum: [model, analyst, related]
                        own: { type: boolean }
                        why: { type: string }
                        hits: { type: integer }
                        unique: { type: integer }
                        tooBroad: { type: boolean }
                        byField:
                          type: object
                          additionalProperties: { type: integer }
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        displayName: { type: string }
                        description:
                          type: string
                          nullable: true
                        resourceType: { type: string }
                        systemName:
                          type: string
                          nullable: true
                        status:
                          type: string
                          enum: [member, included, excluded, candidate]
                        hits:
                          type: array
                          items:
                            type: object
                            properties:
                              term: { type: string }
                              accepted: { type: boolean }
                              fields:
                                type: array
                                items: { type: string }
        '400':
          $ref: '#/components/responses/ContextAssistantBadRequest'
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'
        '500':
          $ref: '#/components/responses/ContextAssistantFailed'

  /context-assistant/related:
    post:
      tags: [Context Assistant]
      summary: Words typical of what the recipe finds
      operationId: getContextRelatedWords
      description: >
        Words that occur far more often in the names of the objects the recipe finds than in the
        names of everything in scope, ranked by that ratio. Found in the data, not by the model —
        this is what finds a deployment's own names. Requires `data.write.contexts`; answers 404
        while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipe]
              properties:
                recipe:
                  $ref: '#/components/schemas/ContextRecipe'
      responses:
        '200':
          description: Suggested words
          content:
            application/json:
              schema:
                type: object
                properties:
                  contextSize: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        word: { type: string }
                        inContext: { type: integer }
                        outside: { type: integer }
                        lift: { type: number }
        '400':
          $ref: '#/components/responses/ContextAssistantBadRequest'
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'
        '500':
          $ref: '#/components/responses/ContextAssistantFailed'

  /context-assistant/lookup:
    get:
      tags: [Context Assistant]
      summary: Find an object by name
      operationId: lookupContextObjects
      description: >
        Fuzzy name search, to include an object by hand that no term finds. Requires
        `data.write.contexts`; answers 404 while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Matching objects (empty for a query shorter than 2 characters)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        type: { type: string }
                        score: { type: number }
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'
        '500':
          $ref: '#/components/responses/ContextAssistantFailed'

  /context-assistant/recipe/{id}:
    get:
      tags: [Context Assistant]
      summary: The recipe behind a context tree
      operationId: getContextRecipe
      description: >
        The stored recipe of a context tree built with the assistant, and the description it was
        built from, so it can be edited and re-run. Requires `data.write.contexts`; answers 404
        while the `contextAssistant` feature is off, and for a context built by anything else.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: The root context of the tree.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The stored recipe
          content:
            application/json:
              schema:
                type: object
                properties:
                  contextId: { type: string, format: uuid }
                  question: { type: string }
                  recipe:
                    $ref: '#/components/schemas/ContextRecipe'
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          description: Not a context built with the assistant, or the feature is off
        '500':
          $ref: '#/components/responses/ContextAssistantFailed'

  /context-assistant/save:
    post:
      tags: [Context Assistant]
      summary: Build the context tree, or refresh an existing one
      operationId: saveContextRecipe
      description: >
        Runs the `context-recipe` plugin with this recipe and waits for it. Without `contextId` it
        creates a new tree (201); with one it refreshes that tree in place (200), keeping the
        analyst's renames and re-parenting. The recipe is stored as the run's parameters, so the
        tree is refreshed with it after every crawl. Requires `data.write.contexts`; answers 404
        while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipe]
              properties:
                recipe:
                  $ref: '#/components/schemas/ContextRecipe'
                question:
                  type: string
                  maxLength: 2000
                  description: The description the context was built from, kept for editing later.
                contextId:
                  type: string
                  format: uuid
                  description: The tree to refresh; omit to create a new one.
      responses:
        '200':
          description: The tree was refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSaveResult'
        '201':
          description: The tree was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSaveResult'
        '400':
          $ref: '#/components/responses/ContextAssistantBadRequest'
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          description: The context to refresh was not built with the assistant, or the feature is off
        '500':
          description: The run failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  detail:
                    type: string
                    nullable: true
                  runId: { type: string, format: uuid }

components:
  securitySchemes:
    CrawlerApiKey:
      type: http
      scheme: bearer
      description: "Crawler API key (format: fgc_<random>)"
    EntraIdBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Entra ID JWT token

  schemas:
    ContextRecipe:
      type: object
      description: >
        What a context built with the assistant searches for, and the analyst's corrections to it.
        Stored as the parameters of the `context-recipe` context plugin and re-applied after every
        crawl. Include and exclude live here rather than as member edits, because a plugin run
        replaces every member it added.
      properties:
        version:
          type: integer
          enum: [1]
        name:
          type: string
          maxLength: 200
        target:
          type: string
          enum: [resource]
        resourceTypes:
          type: array
          maxItems: 20
          items: { type: string }
        fields:
          type: array
          description: Text fields to search, by catalog name.
          items:
            type: string
            enum: [displayName, description, mail]
        terms:
          type: array
          maxItems: 40
          items:
            type: object
            required: [text]
            properties:
              text:
                type: string
                maxLength: 60
              key:
                type: string
                description: The term reduced to lowercase letters, digits and single spaces — what is matched.
              match:
                type: string
                enum: [token, wordStart, contains]
              state:
                type: string
                enum: [accepted, rejected]
              origin:
                type: string
                enum: [model, analyst, related]
              own:
                type: boolean
                description: A model term containing one of the analyst's own words; only these arrive ticked.
              why:
                type: string
                maxLength: 40
        include:
          type: array
          maxItems: 2000
          description: Objects kept in whatever the terms find.
          items: { type: string, format: uuid }
        exclude:
          type: array
          maxItems: 2000
          description: Objects kept out; wins over every term.
          items: { type: string, format: uuid }
        structure:
          type: string
          enum: [byTerm, flat]
    ContextTermsReply:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [terms, clarify, error]
        name:
          type: string
          description: A name for the context, proposed by the model.
        terms:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              match:
                type: string
                enum: [token, wordStart, contains]
              state:
                type: string
                enum: [accepted, rejected]
              origin:
                type: string
                enum: [model]
              own: { type: boolean }
              why: { type: string }
        notes:
          type: array
          items: { type: string }
        question:
          type: string
          description: Present when kind is clarify.
        options:
          type: array
          items: { type: string }
        message:
          type: string
          description: Present when kind is error.
        raw:
          type: string
          description: The model's reply as it came back.
        timing:
          type: object
          additionalProperties: { type: integer }
    ContextSaveResult:
      type: object
      properties:
        runId: { type: string, format: uuid }
        contextId:
          type: string
          format: uuid
          nullable: true
        membersAdded: { type: integer }
        membersRemoved: { type: integer }
    ReportMetadata:
      type: object
      description: Everything a client needs to list and render a report — no report-specific knowledge.
      required: [name, displayName, form, columns]
      properties:
        name:
          type: string
          description: Stable template slug, used as the path parameter.
        displayName:
          type: string
        description:
          type: string
        form:
          type: string
          description: "Presentation form the client resolves a renderer for (e.g. list)."
        parametersSchema:
          type: object
          description: JSON-Schema-ish description of the parameters the template accepts.
        columns:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key:
                type: string
              label:
                type: string
        exportFormats:
          type: array
          description: >
            Formats this deployment can serve the report as a download in, for use as the
            `format` parameter of the export endpoint. Advertised rather than assumed, so a
            client only offers downloads the server can actually produce.
          items:
            type: string
          example: [csv, json]
        source:
          type: string
          enum: [builtin, custom]
          description: >
            `builtin` ships with Identity Atlas; `custom` was built by someone in this
            deployment (the experimental custom reports feature). Clients list the two apart.
        author:
          type: object
          nullable: true
          description: Who built a custom report and who last changed it. Null for built-in reports.
          properties:
            createdBy:
              type: string
              nullable: true
            updatedBy:
              type: string
              nullable: true
            updatedAt:
              type: string
              format: date-time
              nullable: true
        editable:
          type: object
          nullable: true
          description: >
            Present on a custom report. `builderId` opens it in the report builder. Editing and
            deleting it also require the `data.write.reports` permission.
          properties:
            builderId:
              type: string

    ErrorMessage:
      type: object
      properties:
        error:
          type: string

    ReportColumn:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string
        discovered:
          type: boolean
          description: >
            Only in the builder catalog: the column reads an `extendedAttributes` key found in this
            deployment's own data rather than a field of the shared catalog.


    ReportDefinition:
      type: object
      description: >
        A custom report definition — `{ entity, match, conditions, columns, groupBy?, sort?, limit? }`.
        Conditions are `field`, `relation`, `group` or `compare` objects; the catalog lists the
        entities, fields, relations and operators they may use. The server validates every
        definition and returns the normalised form.

      required: [entity]
      additionalProperties: true
      properties:
        entity:
          type: string
        match:
          type: string
          enum: [all, any]
        conditions:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: true
        columns:
          type: array
          maxItems: 15
          items:
            type: string
        groupBy:
          type: string
          description: >
            Count records per distinct value of this field instead of listing them. The result then
            has two columns — the value and `count` — and no record to open per row. Not combinable
            with a compare condition, and not allowed on a date field.
        sort:
          type: object
          description: >
            On a grouped definition the field must be the grouped field or `count`; the default is
            the largest count first.
          properties:
            field:
              type: string
            direction:
              type: string
        limit:
          type: integer
          maximum: 5000
          default: 1000


    ReportConfirmation:
      type: object
      description: >
        A named object in the definition that did not match exactly — the analyst picks one of
        `choices` or types the exact name, and sends it to `/nl-reports/resolve`.
      properties:
        kind:
          type: string
          enum: [reference, value]
        path:
          type: array
          description: Index path to the condition in the definition.
          items:
            type: integer
        name:
          type: string
        label:
          type: string
        message:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              type:
                type: string
                nullable: true
              score:
                type: number

    ReportExplanation:
      type: object
      description: The definition in plain language, one line per condition.
      properties:
        title:
          type: string
        lines:
          type: array
          items:
            type: object
            properties:
              depth:
                type: integer
              text:
                type: string

    SavedReportInput:
      type: object
      required: [name, definition]
      properties:
        name:
          type: string
          maxLength: 200
          description: Unique (case-insensitive).
        description:
          type: string
          maxLength: 2000
        question:
          type: string
          maxLength: 2000
          description: The question the report was built from, if any.
        definition:
          $ref: '#/components/schemas/ReportDefinition'

    SavedReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        definition:
          $ref: '#/components/schemas/ReportDefinition'
        question:
          type: string
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time

    ReportGeneratorModel:
      type: object
      description: A model on the local model server. Size details are reported by the Ollama backend only.
      properties:
        name:
          type: string
        loaded:
          type: boolean
        sizeBytes:
          type: integer
        parameterSize:
          type: string
        quantization:
          type: string

    IngestEnvelope:
      type: object
      required: [records]
      properties:
        systemId:
          type: integer
          description: Target system ID (required for all entity types except systems)
        syncMode:
          type: string
          enum: [full, delta]
          default: delta
          description: "full: merge + delete missing records. delta: merge only."
        scope:
          type: object
          description: 'Narrow delete scope (e.g., { resourceType: "Group" })'
          additionalProperties:
            type: string
        idGeneration:
          type: string
          enum: [native, deterministic]
          default: native
        idPrefix:
          type: string
          description: Namespace for deterministic GUID generation
        syncSession:
          type: string
          enum: [start, continue, end]
          description: For chunked uploads across multiple requests
        syncId:
          type: string
          format: uuid
          description: Session ID (required for continue/end)
        records:
          type: array
          maxItems: 50000
          items:
            type: object
            additionalProperties: true

    IngestResult:
      type: object
      properties:
        table:
          type: string
        inserted:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
        records:
          type: integer
        durationMs:
          type: integer

    ReconcileRequest:
      type: object
      required: [entity, systemId, before]
      properties:
        entity:
          type: string
          description: Ingest entity type (e.g. resource-assignments); must carry a system scope
        systemId:
          type: integer
        scope:
          type: object
          description: 'Narrow the reconcile to a scope (e.g. { assignmentType: "Direct", resourceType: "Entitlement" })'
          additionalProperties:
            type: string
        before:
          type: string
          format: date-time
          description: Rows not ingested since this moment are reconciled away

    ReconcileResult:
      type: object
      properties:
        table:
          type: string
        deleted:
          type: integer
        before:
          type: string
          format: date-time

    CrawlerInfo:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        serverTime:
          type: string
          format: date-time
          description: The API container's clock at the time of the call
        systemIds:
          type: array
          items:
            type: integer
          nullable: true
        permissions:
          type: array
          items:
            type: string

    RotateResult:
      type: object
      properties:
        apiKey:
          type: string
          description: New API key (shown once)
        apiKeyPrefix:
          type: string
        rotatedAt:
          type: string
          format: date-time

    CreateCrawler:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          maxLength: 255
        description:
          type: string
        systemIds:
          type: array
          items:
            type: integer
          nullable: true
          description: Allowed system IDs (null = all)
        permissions:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ingest, refreshViews]
          default: [ingest]
          description: >-
            Crawler permissions. Only ingest and refreshViews can be granted
            through the API; the worker-class admin permission belongs to the
            built-in worker alone.
        rateLimit:
          type: integer
          default: 100
        expiresAt:
          type: string
          format: date-time
          nullable: true

  responses:
    ContextAssistantForbidden:
      description: The caller lacks `data.write.contexts` (checked before the feature flag)
    ContextAssistantDisabled:
      description: The `contextAssistant` feature is not enabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ContextAssistantBadRequest:
      description: The request or the recipe is invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              errors:
                type: array
                items:
                  type: string
    ContextAssistantFailed:
      description: The request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    IngestSuccess:
      description: Ingest successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestResult'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              details:
                type: array
                items:
                  type: string
    Unauthorized:
      description: Missing or invalid API key
    Forbidden:
      description: Insufficient permissions or system access
    CustomReportsForbidden:
      description: The caller lacks the required permission (checked before the feature flag)
    CustomReportsDisabled:
      description: The `customReports` feature is not enabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    CustomReportsBadRequest:
      description: The request or report definition is invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              errors:
                type: array
                items:
                  type: string
    CustomReportsFailed:
      description: The request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ModelServerFailed:
      description: The local model server is not reachable or failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
