openapi: 3.0.3
info:
  title: Identity Atlas Ingest API
  version: 3.4.0
  description: |
    REST API for ingesting authorization data from any source system into Identity Atlas.
    Crawlers authenticate with API keys (Bearer token) and POST batches of records.
    The API handles validation, bulk merge, scoped delete detection, and temporal versioning.

    **Scope:** this specification covers only the **ingest + crawler-admin** surface —
    the endpoints crawlers and the crawler-management UI call. The authenticated
    **read API** consumed by the web UI (matrix & permissions, identities, resources,
    governance & business roles, risk scores, contexts, entity detail, org-chart, tags,
    account-linking — 100+ routes) is **not** described here; see the API reference under
    `docs/api/` for those.
  contact:
    name: Fortigi
    url: https://github.com/Fortigi/IdentityAtlas

servers:
  - url: /api
    description: Relative to deployment root

security:
  - CrawlerApiKey: []

tags:
  - name: Ingest
    description: Data ingestion endpoints — one per entity type
  - name: Crawlers
    description: Crawler self-service (API key rotation, identity)
  - name: Admin
    description: Crawler management (requires Entra ID auth)
  - name: Effective Access
    description: On-demand effective-access resolution — computed per request, never stored
  - name: Attribute Labels
    description: Display names for extendedAttributes keys — shared by the web UI and the Power Query workbook
  - name: Reports
    description: Pluggable reports — self-describing templates, computed per request
  - name: Custom Reports
    description: >
      Experimental report builder (feature flag `customReports`). Every route answers 404 while
      the feature is off. The caller's permission is checked first, so a caller without it gets
      403 whether or not the feature is on.
  - name: Contexts
    description: >
      Contexts — the groupings of persons, accounts, resources or systems an organisation
      reasons about: organizational units, logical applications, tags and segments
      (`contextCategory`). A context is synced from a source, generated by a context plugin, or
      made by hand. An organizational unit or a logical application can carry roles (who is
      Accountable, who is Responsible) and a relationship to another context (`SameUnitAs`: the same unit through a different kind of member).
      Writes need `data.write.contexts`.
  - name: Context Assistant
    description: >
      Experimental context builder (feature flag `contextAssistant`). An analyst describes a
      subject, the local model proposes search terms, and the terms are searched for; the result
      is stored as the parameters of the `context-recipe` context plugin. Every route answers
      404 while the feature is off. The caller's permission is checked first, so a caller without
      it gets 403 whether or not the feature is on.

  - name: Authentication
    description: >
      Sign-in settings managed from Admin → Authentication. Requires `admin.auth`.

paths:
  # ─── Ingest Endpoints ──────────────────────────────────────────
  /ingest/systems:
    post:
      tags: [Ingest]
      summary: Ingest systems
      operationId: ingestSystems
      description: Upsert system records. Systems don't require a systemId in the envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          description: Ingest successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ingest/principals:
    post:
      tags: [Ingest]
      summary: Ingest principals
      operationId: ingestPrincipals
      description: Upsert principal records (users, service principals, etc.). Scope by principalType for full sync deletes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'

  /ingest/resources:
    post:
      tags: [Ingest]
      summary: Ingest resources
      operationId: ingestResources
      description: Upsert resource records (groups, roles, apps, business roles). Scope by resourceType.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/resource-assignments:
    post:
      tags: [Ingest]
      summary: Ingest resource assignments
      operationId: ingestResourceAssignments
      description: Upsert assignments (who has access to what). Composite key (resourceId, principalId, assignmentType). Scope by assignmentType.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/resource-relationships:
    post:
      tags: [Ingest]
      summary: Ingest resource relationships
      operationId: ingestResourceRelationships
      description: Upsert resource-to-resource links (Contains, GrantsAccessTo). Scope by relationshipType.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/identities:
    post:
      tags: [Ingest]
      summary: Ingest identities
      operationId: ingestIdentities
      description: Upsert real-person identity records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/identity-members:
    post:
      tags: [Ingest]
      summary: Ingest identity members
      operationId: ingestIdentityMembers
      description: Upsert identity-to-principal links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/contexts:
    post:
      tags: [Ingest]
      summary: Ingest contexts
      operationId: ingestContexts
      description: Upsert organizational contexts (departments, OUs, classifications). Scope by contextType.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/governance/catalogs:
    post:
      tags: [Ingest]
      summary: Ingest governance catalogs
      operationId: ingestGovernanceCatalogs
      description: Upsert governance catalogs (access-package catalogs / IGA sources).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/governance/policies:
    post:
      tags: [Ingest]
      summary: Ingest assignment policies
      operationId: ingestAssignmentPolicies
      description: Upsert assignment policies (approval and settings for business-role assignment).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/governance/requests:
    post:
      tags: [Ingest]
      summary: Ingest assignment requests
      operationId: ingestAssignmentRequests
      description: Upsert assignment requests (access requests and their state).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/governance/certifications:
    post:
      tags: [Ingest]
      summary: Ingest certification decisions
      operationId: ingestCertificationDecisions
      description: Upsert certification decisions (access-review outcomes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEnvelope'
      responses:
        '201':
          $ref: '#/components/responses/IngestSuccess'

  /ingest/reconcile:
    post:
      tags: [Ingest]
      summary: Reconcile a streamed full sync by timestamp
      operationId: reconcileStale
      description: >-
        The full-sync delete for a crawler that streams its source in independent
        delta chunks instead of one sync session (sources of tens of millions of
        rows). Every row of the given system and scope that no ingest has touched
        since `before` is reconciled away: soft-deleted (deletedAt stamped) on
        Principals, Resources and ResourceAssignments, removed on other tables.
        Entities without a system scope (identities, identity-members, contexts,
        context-members) are refused. Use the `serverTime` from GET /crawlers/whoami,
        read at the start of the run, as `before`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
      responses:
        '200':
          description: Reconcile result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ingest/count:
    post:
      tags: [Ingest]
      summary: Count the rows a run touched, for end-of-run verification
      operationId: countTouched
      description: >-
        Counts the live rows of the given system and scope that an ingest has
        touched since `before`, in the database rather than from the ingest's own
        inserted/updated totals, which count every record sent even when several
        share a key. A streaming crawler calls it once per scope after its run and
        fails the job when the count differs from what the source returned. Same
        request shape and refusals as POST /ingest/reconcile; pass the run's
        `serverTime` from GET /crawlers/whoami as `before`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
      responses:
        '200':
          description: Count result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ingest/stages:
    post:
      tags: [Ingest]
      summary: Open a staged full load
      operationId: openIngestStage
      description: >-
        Opens a stage for one (entity, system, scope): rows are appended to an unindexed
        staging table and applied in one step at finalize. Nothing is written to the
        target table before then. Entities - resource-assignments, principals, resources,
        resource-relationships. Requires ingest permission and access to the system.
      responses:
        '201':
          description: Stage opened; the body carries stageId
        '400':
          description: Unknown entity or invalid systemId
        '403':
          $ref: '#/components/responses/Forbidden'
  /ingest/stages/{id}/rows:
    post:
      tags: [Ingest]
      summary: Append records to a stage
      operationId: appendIngestStageRows
      description: >-
        Records get the same defaults, validation, id normalization and per-system
        boundary checks as a batch on /ingest/{entity}. Every batch of a stage must carry
        the same columns. A stage may carry only key columns (a key sweep).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rows staged so far
        '400':
          description: Invalid records, or a batch that adds columns
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown or expired stage
  /ingest/stages/{id}/finalize:
    post:
      tags: [Ingest]
      summary: Apply one stage
      operationId: finalizeIngestStage
      description: >-
        Applies the stage. Into an empty table - drop the non-constraint indexes, insert
        bare, rebuild (under an exclusive lock, falling back when it cannot be had);
        otherwise insert new rows, update only changed rows, and with deleteMissing remove
        rows of the system and scope that are not in the stage. The body reports which path ran.
        maxDeleteShare (0 < share <= 1) caps that removal at a share of the scope's live rows:
        above it the finalize is rolled back and answers 409, so a source read mid-aggregation
        cannot empty a scope. Omit it for no ceiling.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: >-
            path, inserted, updated, deleted, rows (records received) and distinct (distinct keys
            among them); without deleteMissing also present (how many of those keys are live afterwards)
        '400':
          description: maxDeleteShare is not a share
        '404':
          description: Unknown or expired stage
        '409':
          description: The removal exceeds maxDeleteShare; nothing was written
  /ingest/stages/finalize:
    post:
      tags: [Ingest]
      summary: Apply several stages of one table together
      operationId: finalizeIngestStages
      description: >-
        Finalizes a crawler run's stages together so the whole run gets one chance at the
        empty-table path; otherwise each stage merges in its own transaction. deleteMissing and
        maxDeleteShare apply to every stage of the call, as on the single-stage finalize.
      responses:
        '200':
          description: One result per stage, in the order given
        '400':
          description: Bad stageIds, stages of different tables, or maxDeleteShare is not a share
        '409':
          description: A stage's removal exceeds maxDeleteShare; nothing was written
  /ingest/stages/{id}:
    delete:
      tags: [Ingest]
      summary: Abandon a stage
      operationId: abortIngestStage
      description: Drops the stage and its rows. Nothing was written to the target table.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: Stage dropped; nothing was written
  /ingest/refresh-views:
    post:
      tags: [Ingest]
      summary: Schedule a refresh of the materialized views
      operationId: refreshMaterializedViews
      description: >-
        Asks for a refresh of the matrix materialized views and the bookkeeping that
        follows ingest. Returns at once; the refresh runs in the background, debounced
        and one at a time. Poll GET /ingest/refresh-views for the outcome, or pass
        wait=1 to have the request return only once the refresh has finished (for
        scripts that need fresh views before their next step). Requires refreshViews
        permission.
      parameters:
        - name: wait
          in: query
          required: false
          schema: { type: string, enum: ['1', 'true'] }
          description: Wait for the refresh to finish before answering.
      responses:
        '202':
          description: Refresh scheduled; the body carries the current refresh status
        '200':
          description: With wait=1 — the refresh finished successfully
        '500':
          description: With wait=1 — the refresh failed; the body carries the error
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Ingest]
      summary: Status of the background view refresh
      operationId: getMaterializedViewRefreshStatus
      description: >-
        State of the background refresh (idle, scheduled, running), how many were asked
        for and run, and the outcome of the last run (ok, error, duration). Requires
        refreshViews permission.
      responses:
        '200':
          description: Refresh status
        '403':
          $ref: '#/components/responses/Forbidden'

  # ─── Crawler Self-Service ───────────────────────────────────────
  /crawlers/whoami:
    get:
      tags: [Crawlers]
      summary: Get own identity
      operationId: getOwnCrawlerIdentity
      description: Returns the authenticated crawler's metadata.
      responses:
        '200':
          description: Crawler metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlerInfo'

  /crawlers/rotate:
    post:
      tags: [Crawlers]
      summary: Rotate own API key
      operationId: rotateOwnApiKey
      description: Generates a new key and immediately invalidates the current one.
      responses:
        '200':
          description: New key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateResult'

  # ─── Admin Authentication ──────────────────────────────────────
  /admin/context-owner-access:
    get:
      tags: [Authentication]
      summary: Read the context-owner access switch
      operationId: getContextOwnerAccess
      description: >
        Whether people who are Accountable or Responsible for a context may sign in without an
        Identity Atlas role and see that context, its report and its workflows. Off by default.
        Requires `admin.auth`.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The current setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextOwnerAccess'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Authentication]
      summary: Turn context-owner access on or off
      operationId: setContextOwnerAccess
      description: >
        Takes effect on the next request; no restart. A context owner can only read their own
        contexts (and the contexts linked to them as variants of the same unit), each context's
        timeline, risk score and Entitlement Pivot download. Every other endpoint answers 403
        for them. Requires `admin.auth`.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextOwnerAccess'
      responses:
        '200':
          description: The saved setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextOwnerAccess'
        '400':
          description: "`enabled` is missing or not a boolean"
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The setting could not be saved

  # ─── Admin Crawler Management ───────────────────────────────────
  /admin/crawlers:
    get:
      tags: [Admin]
      summary: List all crawlers
      operationId: listCrawlers
      description: List all registered crawlers (Entra ID auth required).
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: List of crawlers
    post:
      tags: [Admin]
      summary: Register a new crawler
      operationId: registerCrawler
      description: Register a new crawler and return its one-time API key.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCrawler'
      responses:
        '201':
          description: Crawler created with one-time API key
        '400':
          description: Missing displayName or permissions outside the allowed set

  /admin/crawlers/{id}:
    patch:
      tags: [Admin]
      summary: Update crawler
      operationId: updateCrawler
      description: >-
        Update a crawler's metadata, permissions, or system scope. The built-in
        worker crawler only accepts description and rateLimit changes.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated
        '400':
          description: Permissions outside the allowed set
        '403':
          description: The built-in worker crawler cannot be changed this way
        '404':
          description: Crawler not found
    delete:
      tags: [Admin]
      summary: Disable crawler
      operationId: disableCrawler
      description: >-
        Disable a crawler (soft delete; its API key stops working). The built-in
        worker crawler cannot be disabled or deleted.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Disabled
        '403':
          description: The built-in worker crawler cannot be disabled or deleted
        '404':
          description: Crawler not found

  /admin/crawlers/{id}/reset:
    post:
      tags: [Admin]
      summary: Admin-initiated key reset
      operationId: resetCrawlerKey
      description: Admin-initiated API-key reset; returns a new one-time key.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: New key returned

  /admin/crawlers/{id}/audit:
    get:
      tags: [Admin]
      summary: Get crawler audit log
      operationId: getCrawlerAuditLog
      description: Return the crawler's paginated audit log.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated audit log

  /effective-access/resolve:
    get:
      tags: [Effective Access]
      summary: Effective access of one principal on one resource
      operationId: resolveEffectiveAccess
      description: >
        Resolves whether a principal effectively holds a resource — direct grants plus grants
        reached via (transitive) group membership — returning the effect and the reachability
        badge (Direct / Indirect / Eligible).
      security:
        - EntraIdBearer: []
      parameters:
        - name: resourceId
          in: query
          required: true
          schema: { type: string }
        - name: principalId
          in: query
          required: true
          schema: { type: string }
        - name: policy
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Effective-access result (effective, badge, decisiveAce)
        '400':
          description: Missing required parameter, or unknown resolution policy

  /resource/{id}/effective-access:
    get:
      tags: [Effective Access]
      summary: Effective capabilities a principal holds at a resource/node
      operationId: getResourceEffectiveAccess
      description: >
        Down-expansion: includes capabilities inherited from ancestor nodes via the Contains
        hierarchy, computed on demand and never stored. One row per capability.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: principalId
          in: query
          required: true
          schema: { type: string }
        - name: policy
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Per-capability effective access at the node
        '400':
          description: Missing principalId, or unknown resolution policy

  /principal/{id}/effective-access:
    get:
      tags: [Effective Access]
      summary: Effective capabilities a principal holds at a given node
      operationId: getPrincipalEffectiveAccess
      description: >
        Principal-centric form of the node down-expansion; includes inherited capabilities.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: node
          in: query
          required: true
          schema: { type: string }
        - name: policy
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Per-capability effective access at the node
        '400':
          description: Missing node, or unknown resolution policy

  /attribute-labels:
    get:
      tags: [Attribute Labels]
      summary: Display names for extendedAttributes keys
      operationId: getAttributeLabels
      description: >
        Maps each stored `extendedAttributes` key to the name it should be shown under, so
        every reader renders the same string. Entra directory-extension keys
        (`extension_<32-hex appId>_<name>`) resolve to their tail verbatim
        (`sAMAccountName`); a crawler-stamped `attributeDisplayNames` map on the source
        System wins over that rule and is what disambiguates two extension apps defining
        the same attribute name. Storage keys are never changed — filters and sorts keep
        addressing the raw key. Only keys that are actually relabelled are returned, so an
        absent key means "show it the way you always did". Documented because the Power
        Query export workbook calls it directly to title its columns.
      security:
        - EntraIdBearer: []
      parameters:
        - name: target
          in: query
          description: Which table's keys to label. Omit for the union of all four.
          schema:
            type: string
            enum: [principal, resource, identity, system]
      responses:
        '200':
          description: Label map (empty when nothing needs relabelling, or on lookup failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: object
                    additionalProperties:
                      type: string
        '400':
          description: Unknown target

  # ─── Reports ───────────────────────────────────────────────────
  /reports:
    get:
      tags: [Reports]
      summary: List the registered report templates
      operationId: listReports
      description: >
        Metadata for every report a deployment offers. Each entry declares its presentation
        `form` and its `columns`; a client renders a report from that metadata alone and never
        needs to know the report by name.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Registered report templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportMetadata'
                  total:
                    type: integer

  /reports/{name}/rows:
    get:
      tags: [Reports]
      summary: Run a report and return its rows
      operationId: runReport
      description: >
        Runs the named report template against the current data and returns its rows. Content is
        computed per request — there are no stored runs, so a re-fetch always reflects the latest
        data. Any query parameters are passed to the template as its parameters. `columns` and
        `pivots` are this run's: a report whose columns are picked through its parameters returns
        the ones it was asked for, which may differ from what `GET /reports` declares.
      security:
        - EntraIdBearer: []
      parameters:
        - name: name
          in: path
          required: true
          description: Report template name, as returned by `GET /reports`.
          schema: { type: string }
      responses:
        '200':
          description: Report content
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ReportMetadata'
                  - type: object
                    properties:
                      rows:
                        type: array
                        description: >
                          One object per row, keyed by the report's column keys. An optional
                          `_entity` property ({kind, id}) links the row to an entity detail page.
                        items:
                          type: object
                          additionalProperties: true
                      total:
                        type: integer
                      truncated:
                        type: boolean
                        description: >
                          True when the report stopped at its row cap, so `rows` holds only the first
                          `total` rows. Custom reports cap at their definition's limit (1,000 by default).
                      details:
                        type: array
                        description: >
                          Facts about what the run covers, as titled blocks of label/value pairs. The
                          Entitlement Pivot returns one block per context: every attribute, the
                          Accountable and Responsibles, or the suggested Accountable and why. Empty for
                          a report that has none. The xlsx download writes them on its Summary tab;
                          csv and json downloads leave them out.
                        items:
                          type: object
                          properties:
                            title: { type: string }
                            entries:
                              type: array
                              items:
                                type: object
                                properties:
                                  label: { type: string }
                                  value: {}
                      generatedAt:
                        type: string
                        format: date-time
        '404':
          description: No report template with that name is registered
        '500':
          description: The report template failed to run

  /reports/{name}/export:
    get:
      tags: [Reports]
      summary: Download a report as a file
      operationId: exportReport
      description: >
        Runs the named report template and returns the result as a downloadable file, with a
        `Content-Disposition: attachment` filename of `identity-atlas-<report>-<date>.<ext>`.
        The content is computed for this request, exactly as `/reports/{name}/rows` computes it,
        so a download always matches what the page shows. Any query parameter other than
        `format` is passed to the template as its parameters.
      security:
        - EntraIdBearer: []
      parameters:
        - name: name
          in: path
          required: true
          description: Report template name, as returned by `GET /reports`.
          schema: { type: string }
        - name: format
          in: query
          required: false
          description: >
            One of the report's advertised `exportFormats`. `csv` holds the declared columns as
            an RFC-4180 table; `json` holds the whole payload (metadata, rows, `generatedAt`).
          schema:
            type: string
            enum: [csv, json]
            default: csv
      responses:
        '200':
          description: The report as a file
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ReportMetadata'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      total:
                        type: integer
                      truncated:
                        type: boolean
                        description: True when the report stopped at its row cap; the file then holds only the first rows.
                      generatedAt:
                        type: string
                        format: date-time
        '400':
          description: The requested format is not one this deployment serves
        '404':
          description: No report template with that name is registered
        '500':
          description: The report template failed to run

  # ─── Report views ──────────────────────────────────────────────
  /report-views:
    post:
      tags: [Reports]
      summary: Save a view of a standard report
      operationId: createReportView
      description: >
        Stores a standard report's parameters under a name, shared across the deployment. The
        view is then listed and run through `GET /reports` as a report named `view-<id>`, which
        runs the standard report with these parameters (overlaid by any given on the run).
        Only parameters the report declares are kept. Needs `data.write.reports`.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportViewInput'
      responses:
        '201':
          description: The saved view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportView' }
        '400':
          description: No name, or not a standard report that takes parameters
        '403':
          description: The caller may not save views
        '409':
          description: A view with that name already exists
  /report-views/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Reports]
      summary: One saved report view, for editing
      operationId: getReportView
      description: >
        The stored view: its name, description and the parameters it saves. Running it goes
        through `GET /reports/view-<id>/rows`. Any signed-in reader may fetch it.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportView' }
        '404':
          description: No such view
    put:
      tags: [Reports]
      summary: Change a saved view's name, description or parameters
      operationId: updateReportView
      description: The report a view is of cannot change. Needs `data.write.reports`.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportViewInput'
      responses:
        '200':
          description: The updated view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportView' }
        '400':
          description: No name
        '403':
          description: The caller may not change views
        '404':
          description: No such view
        '409':
          description: A view with that name already exists
    delete:
      tags: [Reports]
      summary: Delete a saved view
      operationId: deleteReportView
      description: Needs `data.write.reports`.
      security:
        - EntraIdBearer: []
      responses:
        '204':
          description: Deleted
        '403':
          description: The caller may not delete views
        '404':
          description: No such view

  # ─── Custom Reports (experimental) ─────────────────────────────
  /nl-reports/catalog:
    get:
      tags: [Custom Reports]
      summary: Report builder catalog
      operationId: getCustomReportCatalog
      description: >
        The entities, fields, relations, operators and pickable columns a report definition may
        use, with the known values of enumerated fields. Alongside the fields every deployment has,
        this includes the `extendedAttributes` keys discovered in this deployment's own data, named
        `ext.<rawKey>` and marked `discovered`. Requires `data.read.reports` or `data.write.reports`; answers 404 while the
        `customReports` feature is off.

      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Builder catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: object
                    description: Keyed by entity name.
                    additionalProperties:
                      type: object
                      properties:
                        label: { type: string }
                        table: { type: string }
                        description: { type: string }
                        compareRelations:
                          type: array
                          items: { type: string }
                        defaultColumns:
                          type: array
                          items: { type: string }
                        fields:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              label: { type: string }
                              type: { type: string }
                              values:
                                type: array
                                description: Known values, for enumerated fields only.
                                items: { type: string }
                              discovered:
                                type: boolean
                                description: >
                                  Present on a field read from this deployment's own
                                  `extendedAttributes` rather than from the shared catalog.
                        relations:

                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              label: { type: string }
                              target: { type: string }
                              cardinality: { type: string }
                        columns:
                          type: array
                          items:
                            $ref: '#/components/schemas/ReportColumn'
                        groupableFields:
                          type: array
                          description: The fields this entity can be counted per (no date fields).
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              label: { type: string }
                              discovered: { type: boolean }
                  operators:

                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        label: { type: string }
                        needsValue: { type: boolean }
                  operatorsByType:
                    type: object
                    description: Operator names allowed per field type.
                    additionalProperties:
                      type: array
                      items: { type: string }
                  compareMeasures:
                    type: object
                    description: Compare measure name → label.
                    additionalProperties: { type: string }
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '500':
          $ref: '#/components/responses/CustomReportsFailed'

  /nl-reports/lookup:
    get:
      tags: [Custom Reports]
      summary: Search object names for a compare reference
      operationId: lookupCustomReportNames
      description: >
        Fuzzy name search used by the builder's reference picker. A search text shorter than 2
        or longer than 100 characters returns an empty list. Requires `data.read.reports` or `data.write.reports`;
        answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      parameters:
        - name: entity
          in: query
          required: true
          description: Entity name from the catalog.
          schema: { type: string }
        - name: q
          in: query
          required: true
          description: Search text.
          schema: { type: string }
      responses:
        '200':
          description: Best matches, most similar first (at most 5)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        type:
                          type: string
                          nullable: true
                        score: { type: number }
        '400':
          description: Unknown entity
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '500':
          $ref: '#/components/responses/CustomReportsFailed'

  /nl-reports/status:
    get:
      tags: [Custom Reports]
      summary: Report generator availability
      operationId: getCustomReportGeneratorStatus
      description: >
        Whether the local model server is reachable and serves the configured model. Never fails
        on an unreachable server — it reports `available: false` with a reason instead. Requires
        `data.read.reports`; answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Generator status
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  model:
                    type: string
                    nullable: true
                  loaded: { type: boolean }
                  promptCache:
                    type: string
                    enum: [cold, warming, ready, failed]
                  reason:
                    type: string
                    nullable: true
                    description: "`model-not-installed` or `server-unreachable`; null when available."
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'

  /nl-reports/warm:
    post:
      tags: [Custom Reports]
      summary: Warm up the report generator
      operationId: warmCustomReportGenerator
      description: >
        Loads the configured model and restores its prompt cache. Waits at most a few seconds:
        when the warm-up is still running it answers `state: preparing` and continues in the
        background. Requires `data.write.reports`; answers 404 while the `customReports` feature
        is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Warm-up finished (`ready`) or still running (`preparing`)
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    type: string
                    enum: [ready, preparing]
                  model:
                    type: string
                    description: Present when ready.
                  ms:
                    type: integer
                    description: Warm-up duration, present when ready.
                  restored:
                    type: boolean
                    description: Whether a saved prompt cache was restored (llama.cpp backend only).
                  message:
                    type: string
                    description: Present while preparing.
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '502':
          $ref: '#/components/responses/ModelServerFailed'

  /nl-reports/interpret:
    post:
      tags: [Custom Reports]
      summary: Turn a question into a report definition
      operationId: interpretCustomReportQuestion
      description: >
        Sends a plain-language question (plus earlier conversation turns) to the local model and
        returns a validated report definition (`report`), a definition whose named objects need
        confirming (`confirm`), a clarifying question (`clarify`), or `error` when the model's
        answer could not be used. Requires `data.read.reports`; answers 404 while the
        `customReports` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  maxLength: 2000
                history:
                  type: array
                  maxItems: 12
                  description: Earlier turns, at most 10,000 characters of content in total.
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                        maxLength: 20000
                model:
                  type: string
                  pattern: '^[A-Za-z0-9._:/-]{1,100}$'
                  description: Evaluation override of the configured model; the UI never sends it.
                conversationId:
                  type: string
                  pattern: '^[A-Za-z0-9:_-]{1,100}$'
                  description: >
                    Client-generated key shared by every turn of one chat, so the conversation
                    store can thread them. Optional.
      responses:
        '200':
          description: The model's interpretation
          content:
            application/json:
              schema:
                type: object
                required: [kind]
                properties:
                  kind:
                    type: string
                    enum: [report, confirm, clarify, error]
                  spec:
                    $ref: '#/components/schemas/ReportDefinition'
                  confirm:
                    $ref: '#/components/schemas/ReportConfirmation'
                  explanation:
                    $ref: '#/components/schemas/ReportExplanation'
                  assumptions:
                    type: array
                    items: { type: string }
                  warnings:
                    type: array
                    items: { type: string }
                  sql:
                    type: string
                    description: Compiled SQL (`report` only).
                  question:
                    type: string
                    description: Clarifying question (`clarify` only).
                  options:
                    type: array
                    description: Up to 4 suggested answers (`clarify` only).
                    items: { type: string }
                  message:
                    type: string
                    description: What went wrong (`error` only).
                  errors:
                    type: array
                    items: { type: string }
                  raw:
                    type: string
                    description: The model's raw reply.
                  context:
                    type: string
                    description: What was put in front of the question for the model on this turn.
                  logId:
                    type: string
                    format: uuid
                    description: >
                      The conversation-store row this turn wrote. Pass it to /nl-reports/run so
                      the row is completed with what the definition returned.
                  timing:
                    type: object
                    additionalProperties: true
                  model: { type: string }
                  repaired:
                    type: boolean
                    description: Whether a repair round was needed.
        '400':
          $ref: '#/components/responses/CustomReportsBadRequest'
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '429':
          description: The caller's previous question is still being answered (one at a time per user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '502':
          $ref: '#/components/responses/ModelServerFailed'

  /nl-reports/resolve:
    post:
      tags: [Custom Reports]
      summary: Apply a confirmation answer and look named objects up again
      operationId: resolveCustomReportReferences
      description: >
        Validates a report definition, applies the analyst's answer to a "did you mean"
        confirmation (when `choice` is given), and looks up the objects it names again. No model
        is involved. Requires `data.read.reports` or `data.write.reports`; answers 404 while the `customReports` feature
        is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec:
                  $ref: '#/components/schemas/ReportDefinition'
                choice:
                  type: object
                  required: [path, name]
                  properties:
                    path:
                      type: array
                      description: The `path` of the confirmation being answered.
                      items: { type: integer }
                    name:
                      type: string
                      description: The chosen or typed exact name.
                    id:
                      type: string
                      description: The chosen record, when known.
                    keep:
                      type: boolean
                      description: Use a "name is X" value as written, without checking it again.
      responses:
        '200':
          description: The updated definition and the next confirmation, if any
          content:
            application/json:
              schema:
                type: object
                properties:
                  spec:
                    $ref: '#/components/schemas/ReportDefinition'
                  confirm:
                    allOf:
                      - $ref: '#/components/schemas/ReportConfirmation'
                    nullable: true
                  explanation:
                    $ref: '#/components/schemas/ReportExplanation'
        '400':
          $ref: '#/components/responses/CustomReportsBadRequest'
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '500':
          $ref: '#/components/responses/CustomReportsFailed'

  /nl-reports/run:
    post:
      tags: [Custom Reports]
      summary: Run a report definition
      operationId: runCustomReportDefinition
      description: >
        Validates and runs a report definition in a read-only transaction with a statement
        timeout. A definition that is invalid, or names an object that still needs confirming,
        answers 400 with the errors, the confirmation and the validated definition. Requires
        `data.read.reports` or `data.write.reports`; answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec:
                  $ref: '#/components/schemas/ReportDefinition'
                logId:
                  type: string
                  format: uuid
                  description: >
                    The row /nl-reports/interpret wrote for this definition. When given, and only
                    when the definition run is exactly the one logged, the row is completed with
                    the row count, column names and query time. Optional.
      responses:
        '200':
          description: Report rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  spec:
                    $ref: '#/components/schemas/ReportDefinition'
                  explanation:
                    $ref: '#/components/schemas/ReportExplanation'
                  columns:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportColumn'
                  rows:
                    type: array
                    description: >
                      One object per row, keyed by column key, with an `_entity` property
                      ({kind, id}) linking the row to an entity detail page.
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
                  truncated:
                    type: boolean
                    description: More rows matched than the definition's limit.
                  sql:
                    type: string
                  params:
                    type: array
                    items: {}
                  elapsedMs:
                    type: integer
        '400':
          description: Missing or invalid definition, or a named object needs confirming
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  errors:
                    type: array
                    items: { type: string }
                  confirm:
                    $ref: '#/components/schemas/ReportConfirmation'
                  spec:
                    $ref: '#/components/schemas/ReportDefinition'
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '500':
          $ref: '#/components/responses/CustomReportsFailed'

  /nl-reports/saved:
    post:
      tags: [Custom Reports]
      summary: Save a new custom report
      operationId: createSavedCustomReport
      description: >
        Stores a named report definition. Saved reports are listed, run and downloaded through
        `/reports` as `custom-<id>`. Requires `data.write.reports`; answers 404 while the
        `customReports` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedReportInput'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedReport'
        '400':
          $ref: '#/components/responses/CustomReportsBadRequest'
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '409':
          description: A report with that name already exists
        '500':
          $ref: '#/components/responses/CustomReportsFailed'

  /nl-reports/saved/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Saved report id (UUID), as in `editable.builderId` of the report metadata.
        schema:
          type: string
          format: uuid
    get:
      tags: [Custom Reports]
      summary: Get a saved custom report
      operationId: getSavedCustomReport
      description: >
        One saved report with its definition, for editing in the builder. Requires
        `data.read.reports` or `data.write.reports`; answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Saved report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedReport'
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          description: Report not found, or the feature is off
        '500':
          $ref: '#/components/responses/CustomReportsFailed'
    put:
      tags: [Custom Reports]
      summary: Update a saved custom report
      operationId: updateSavedCustomReport
      description: >
        Replaces a saved report's name, description, question and definition. Requires
        `data.write.reports`; answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedReportInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedReport'
        '400':
          $ref: '#/components/responses/CustomReportsBadRequest'
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          description: Report not found, or the feature is off
        '409':
          description: Another report with that name already exists
        '500':
          $ref: '#/components/responses/CustomReportsFailed'
    delete:
      tags: [Custom Reports]
      summary: Delete a saved custom report
      operationId: deleteSavedCustomReport
      description: >
        Deletes a saved report. Requires `data.write.reports`; answers 404 while the
        `customReports` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          description: Report not found, or the feature is off
        '500':
          $ref: '#/components/responses/CustomReportsFailed'

  /admin/nl-reports/config:
    get:
      tags: [Custom Reports]
      summary: Get the report generator model configuration
      operationId: getCustomReportModelConfig
      description: >
        The configured model and the models installed on the local model server. `fixed` is true
        when the release pins the model, in which case it cannot be changed. Requires
        `admin.llm`; answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Model configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    type: string
                    nullable: true
                  models:
                    type: array
                    description: Empty when the model server is unreachable.
                    items:
                      $ref: '#/components/schemas/ReportGeneratorModel'
                  reachable: { type: boolean }
                  fixed: { type: boolean }
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '500':
          $ref: '#/components/responses/CustomReportsFailed'
    put:
      tags: [Custom Reports]
      summary: Choose the report generator model
      operationId: setCustomReportModelConfig
      description: >
        Selects which installed model generates reports. Requires `admin.llm`; answers 404 while
        the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                  pattern: '^[A-Za-z0-9._:/-]{1,100}$'
      responses:
        '200':
          description: Model saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  model: { type: string }
        '400':
          description: Invalid model name, or the model is not installed on the model server
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'
        '409':
          description: The model is fixed by this release
        '502':
          $ref: '#/components/responses/ModelServerFailed'

  # ─── Context Assistant (experimental) ──────────────────────────
  /nl-reports/conversations:
    get:
      tags: [Custom Reports]
      summary: Earlier conversations of the signed-in person
      operationId: listCustomReportConversations
      description: >
        The Ask tab's history: this person's earlier conversations, newest first, one line each.
        Scoped to the caller; with nobody signed in the list is empty. Requires
        `data.read.reports`; answers 404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Conversations, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      type: object
                      properties:
                        conversationId: { type: string }
                        firstQuestion: { type: string }
                        startedAt: { type: string, format: date-time }
                        lastAt: { type: string, format: date-time }
                        turns: { type: integer }
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          $ref: '#/components/responses/CustomReportsDisabled'

  /nl-reports/conversations/{id}:
    get:
      tags: [Custom Reports]
      summary: The turns of one earlier conversation
      operationId: getCustomReportConversation
      description: >
        Everything said in one conversation, in order, with the model's raw replies — what the
        Ask tab needs to pick the conversation back up. A conversation that is not the caller's
        answers 404 exactly like one that does not exist. Requires `data.read.reports`; answers
        404 while the `customReports` feature is off.
      security:
        - EntraIdBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9:_-]{1,100}$' }
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationId: { type: string }
                  turns:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        question: { type: string }
                        definition:
                          $ref: '#/components/schemas/ReportDefinition'
                        outcome: { type: string }
                        clarification: { type: string, nullable: true }
                        rawReply: { type: string, nullable: true }
                        rowCount: { type: integer, nullable: true }
                        createdAt: { type: string, format: date-time }
        '400':
          description: The id is not a plain key
        '403':
          $ref: '#/components/responses/CustomReportsForbidden'
        '404':
          description: No such conversation for this caller, or the feature is off

  /context-assistant/options:
    get:
      tags: [Context Assistant]
      summary: What a context recipe may search
      operationId: getContextAssistantOptions
      description: >
        The resource types that exist in this deployment and the text fields a recipe may search.
        Requires `data.write.contexts`; answers 404 while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Scope options
          content:
            application/json:
              schema:
                type: object
                properties:
                  resourceTypes:
                    type: array
                    items: { type: string }
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        label: { type: string }
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'

  /context-assistant/status:
    get:
      tags: [Context Assistant]
      summary: Report generator availability
      operationId: getContextAssistantStatus
      description: >
        Whether the local model server is reachable and serves the configured model. Never fails
        on an unreachable server — it reports `available: false` with a reason instead. The
        builder works without it: the analyst types the search terms themselves. Requires
        `data.write.contexts`; answers 404 while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Generator status
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  model:
                    type: string
                    nullable: true
                  loaded: { type: boolean }
                  promptCache:
                    type: string
                    enum: [cold, warming, ready, failed]
                  reason:
                    type: string
                    nullable: true
                    description: "`model-not-installed` or `server-unreachable`; null when available."
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'

  /context-assistant/warm:
    post:
      tags: [Context Assistant]
      summary: Warm up the context assistant's prompt
      operationId: warmContextAssistant
      description: >
        Loads the model and restores this assistant's prompt cache. The generator has one slot and
        each assistant keeps its own prompt, so custom reports and the context assistant take
        turns; restoring is fast, preparing a prompt for the first time after an update takes
        minutes and continues in the background (`state: preparing`). Requires
        `data.write.contexts`; answers 404 while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: Warm-up finished (`ready`), the model is loading (`starting`), or the prompt cache is being prepared (`preparing`)
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    type: string
                    enum: [ready, starting, preparing]
                  model: { type: string }
                  ms: { type: integer }
                  restored: { type: boolean }
                  message: { type: string }
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'
        '502':
          $ref: '#/components/responses/ModelServerFailed'

  /context-assistant/interpret:
    post:
      tags: [Context Assistant]
      summary: Turn a description into search terms
      operationId: interpretContextDescription
      description: >
        Sends a description of the subject (plus earlier conversation turns) to the local model and
        returns proposed search terms (`terms`), one clarifying question (`clarify`), or `error`
        when the model's answer could not be used. Only terms containing the analyst's own words
        arrive with `state: accepted`; everything else the model adds arrives `rejected`, for the
        analyst to tick after seeing what it finds. One question at a time per caller (429).
        Requires `data.write.contexts`; answers 404 while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  maxLength: 2000
                history:
                  type: array
                  maxItems: 12
                  description: Earlier turns, at most 10,000 characters of content in total.
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                        maxLength: 20000
      responses:
        '200':
          description: The model's proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextTermsReply'
        '400':
          $ref: '#/components/responses/ContextAssistantBadRequest'
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'
        '429':
          description: The caller's previous question is still being answered
        '502':
          $ref: '#/components/responses/ModelServerFailed'

  /context-assistant/suggest:
    post:
      tags: [Context Assistant]
      summary: Ask for more search terms
      operationId: suggestContextTerms
      description: >
        Asks the model for terms that are not in the recipe yet, told which terms the analyst kept
        and which they dropped. Requires `data.write.contexts`; answers 404 while the
        `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, recipe]
              properties:
                question:
                  type: string
                  maxLength: 2000
                recipe:
                  $ref: '#/components/schemas/ContextRecipe'
      responses:
        '200':
          description: New terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextTermsReply'
        '400':
          $ref: '#/components/responses/ContextAssistantBadRequest'
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'
        '429':
          description: The caller's previous question is still being answered
        '502':
          $ref: '#/components/responses/ModelServerFailed'

  /context-assistant/evaluate:
    post:
      tags: [Context Assistant]
      summary: What a recipe finds
      operationId: evaluateContextRecipe
      description: >
        Runs the recipe read-only and returns the normalised recipe, per-term numbers (hits, hits
        only that term finds, per field, whether it is too broad) and the matched objects with
        their status. No model involved. Requires `data.write.contexts`; answers 404 while the
        `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipe]
              properties:
                recipe:
                  $ref: '#/components/schemas/ContextRecipe'
      responses:
        '200':
          description: The recipe as it will run, and what it finds
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipe:
                    $ref: '#/components/schemas/ContextRecipe'
                  errors:
                    type: array
                    description: What was dropped or corrected while normalising the recipe.
                    items: { type: string }
                  scopeTotal:
                    type: integer
                    description: Objects in scope, whether they match or not.
                  truncated:
                    type: boolean
                    description: More objects matched than were returned.
                  memberCount:
                    type: integer
                  addedByModel:
                    type: integer
                    description: Members found only by kept terms the model added that carry none of the analyst's own words.
                  suggestedOwner:
                    type: object
                    nullable: true
                    description: >
                      The account that owns the most of the found objects, when it owns at least 40% of
                      them — the same best guess the context page offers as Accountable after saving.
                      Read-only here; nothing is assigned.
                    properties:
                      principalId: { type: string, format: uuid }
                      displayName: { type: string }
                      reason: { type: string }
                      count: { type: integer }
                      total: { type: integer }
                  terms:
                    type: array
                    items:
                      type: object
                      properties:
                        text: { type: string }
                        key: { type: string }
                        match:
                          type: string
                          enum: [token, wordStart, contains]
                        state:
                          type: string
                          enum: [accepted, rejected]
                        origin:
                          type: string
                          enum: [model, analyst, related]
                        own: { type: boolean }
                        why: { type: string }
                        hits: { type: integer }
                        unique: { type: integer }
                        tooBroad: { type: boolean }
                        byField:
                          type: object
                          additionalProperties: { type: integer }
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        displayName: { type: string }
                        description:
                          type: string
                          nullable: true
                        resourceType: { type: string }
                        systemName:
                          type: string
                          nullable: true
                        status:
                          type: string
                          enum: [member, included, excluded, candidate]
                        hits:
                          type: array
                          items:
                            type: object
                            properties:
                              term: { type: string }
                              accepted: { type: boolean }
                              fields:
                                type: array
                                items: { type: string }
        '400':
          $ref: '#/components/responses/ContextAssistantBadRequest'
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'
        '500':
          $ref: '#/components/responses/ContextAssistantFailed'

  /context-assistant/related:
    post:
      tags: [Context Assistant]
      summary: Words typical of what the recipe finds
      operationId: getContextRelatedWords
      description: >
        Words that occur far more often in the names of the objects the recipe finds than in the
        names of everything in scope, ranked by that ratio. Found in the data, not by the model —
        this is what finds a deployment's own names. Requires `data.write.contexts`; answers 404
        while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipe]
              properties:
                recipe:
                  $ref: '#/components/schemas/ContextRecipe'
      responses:
        '200':
          description: Suggested words
          content:
            application/json:
              schema:
                type: object
                properties:
                  contextSize: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        word: { type: string }
                        inContext: { type: integer }
                        outside: { type: integer }
                        lift: { type: number }
        '400':
          $ref: '#/components/responses/ContextAssistantBadRequest'
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'
        '500':
          $ref: '#/components/responses/ContextAssistantFailed'

  /context-assistant/lookup:
    get:
      tags: [Context Assistant]
      summary: Find an object by name
      operationId: lookupContextObjects
      description: >
        Fuzzy name search, to include an object by hand that no term finds. Requires
        `data.write.contexts`; answers 404 while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Matching objects (empty for a query shorter than 2 characters)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        type: { type: string }
                        score: { type: number }
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          $ref: '#/components/responses/ContextAssistantDisabled'
        '500':
          $ref: '#/components/responses/ContextAssistantFailed'

  /context-assistant/recipe/{id}:
    get:
      tags: [Context Assistant]
      summary: The recipe behind a context tree
      operationId: getContextRecipe
      description: >
        The stored recipe of a context tree built with the assistant, and the description it was
        built from, so it can be edited and re-run. Requires `data.write.contexts`; answers 404
        while the `contextAssistant` feature is off, and for a context built by anything else.
      security:
        - EntraIdBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: The root context of the tree.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The stored recipe
          content:
            application/json:
              schema:
                type: object
                properties:
                  contextId: { type: string, format: uuid }
                  question: { type: string }
                  recipe:
                    $ref: '#/components/schemas/ContextRecipe'
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          description: Not a context built with the assistant, or the feature is off
        '500':
          $ref: '#/components/responses/ContextAssistantFailed'

  /context-assistant/save:
    post:
      tags: [Context Assistant]
      summary: Build the context tree, or refresh an existing one
      operationId: saveContextRecipe
      description: >
        Runs the `context-recipe` plugin with this recipe and waits for it. Without `contextId` it
        creates a new tree (201); with one it refreshes that tree in place (200), keeping the
        analyst's renames and re-parenting. The recipe is stored as the run's parameters, so the
        tree is refreshed with it after every crawl. Requires `data.write.contexts`; answers 404
        while the `contextAssistant` feature is off.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipe]
              properties:
                recipe:
                  $ref: '#/components/schemas/ContextRecipe'
                question:
                  type: string
                  maxLength: 2000
                  description: The description the context was built from, kept for editing later.
                contextId:
                  type: string
                  format: uuid
                  description: The tree to refresh; omit to create a new one.
      responses:
        '200':
          description: The tree was refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSaveResult'
        '201':
          description: The tree was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSaveResult'
        '400':
          $ref: '#/components/responses/ContextAssistantBadRequest'
        '403':
          $ref: '#/components/responses/ContextAssistantForbidden'
        '404':
          description: The context to refresh was not built with the assistant, or the feature is off
        '500':
          description: The run failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  detail:
                    type: string
                    nullable: true
                  runId: { type: string, format: uuid }

  # ─── Contexts ──────────────────────────────────────────────────
  /contexts:
    get:
      tags: [Contexts]
      summary: List the root contexts, or search every level
      operationId: listContexts
      description: >
        Without `search`, the contexts that have no parent. With `search`, every level is searched
        and at most 1000 matches come back, each with its parent. The other filters narrow either
        list: `contextCategory` is one of the four templates, `sourceAlgorithm` the name of the
        context plugin that produced the tree (for example `manager-hierarchy`).
      security:
        - EntraIdBearer: []
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: extendedSearch, in: query, schema: { type: boolean }, description: Also search every attribute }
        - { name: targetType, in: query, schema: { type: string, enum: [Identity, Resource, Principal, System] } }
        - { name: variant, in: query, schema: { type: string, enum: [synced, generated, manual] } }
        - { name: contextType, in: query, schema: { type: string, maxLength: 100 } }
        - { name: contextCategory, in: query, schema: { $ref: '#/components/schemas/ContextCategory' } }
        - { name: sourceAlgorithm, in: query, schema: { type: string, maxLength: 100 }, description: Name of the producing context plugin }
        - { name: scopeSystemId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: The matching contexts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Context' }
                  total: { type: integer }
    post:
      tags: [Contexts]
      summary: Create a manual context
      operationId: createContext
      description: >
        A context made by hand (`variant = manual`). The template (`contextCategory`) defaults to
        the parent's when a parent is given, else to null ("Other"). A parent must exist and have
        the same `targetType`. `ownerUserId` records who the source says created it; it is not a
        role — see the roles routes for Accountable and Responsible.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContextInput' }
      responses:
        '201':
          description: The created context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Context' }
        '400':
          description: A required field is missing, the category is not a template, or the parent is invalid
        '403':
          description: The caller may not write contexts
  /contexts/uploads:
    get:
      tags: [Contexts]
      summary: The uploaded lists
      operationId: listContextUploads
      description: >
        Every list uploaded as a context tree (a system of type `Upload`), newest first, each with
        its latest upload — the picker for a re-import. Needs `data.write.contexts`.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, description: The list's system id }
                        displayName: { type: string }
                        fileName: { type: string }
                        uploadedAt: { type: string, format: date-time }
                        uploadedBy: { type: string }
                        template: { $ref: '#/components/schemas/ContextUploadTemplate' }
                        rowCount: { type: integer }
                        rootContextId: { type: string, format: uuid }
                        uploadCount: { type: integer }
        '403':
          description: The caller may not write contexts
  /contexts/uploads/analyze:
    post:
      tags: [Contexts]
      summary: Read an uploaded list and guess its mapping
      operationId: analyzeContextUpload
      description: >
        Reads a .csv (delimiter sniffed, UTF-8 with or without BOM) or .xlsx (first sheet) list,
        keeps it server-side as a draft for two hours, and returns its columns with a complete
        best-guess mapping. The guess is deterministic; when the report generator's model is
        configured it may refine it (`aiUsed`, `aiFields`). With `listId` the guess starts from that
        list's last mapping. `existingList` is set when the list (or its name) was uploaded before.
        At most 50,000 data rows.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                listId: { type: integer, description: Update this uploaded list }
      responses:
        '200':
          description: The columns and the guess
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadDraftId: { type: string, format: uuid }
                  fileName: { type: string }
                  rowCount: { type: integer }
                  columns:
                    type: array
                    items:
                      type: object
                      properties:
                        header: { type: string }
                        samples: { type: array, items: { type: string } }
                        shape: { type: string }
                        filled: { type: integer }
                        distinct: { type: integer }
                  guess: { $ref: '#/components/schemas/ContextUploadMapping' }
                  aiUsed: { type: boolean }
                  aiFields: { type: array, items: { type: string } }
                  existingList:
                    type: object
                    nullable: true
                    properties:
                      id: { type: integer }
                      listName: { type: string }
                      lastFileName: { type: string }
                      lastUploadedAt: { type: string, format: date-time }
                      rootContextId: { type: string, format: uuid }
        '400':
          description: The file cannot be read as a list (the message says why)
        '403':
          description: The caller may not write contexts
        '404':
          description: The listId is not an uploaded list
        '413':
          description: The file is larger than any 50,000-row list
  /contexts/uploads/preview:
    post:
      tags: [Contexts]
      summary: What an upload would do
      operationId: previewContextUpload
      description: >
        Applies the mapping to the draft without writing: contexts to create, update, leave
        unchanged and those of the list not in this file; member match statistics with the first
        50 unmatched values; row errors (an empty key, a key with two names, a parent loop) and
        warnings (a parent not in the list).
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadDraftId, mapping]
              properties:
                uploadDraftId: { type: string, format: uuid }
                listId: { type: integer }
                mapping: { $ref: '#/components/schemas/ContextUploadMapping' }
      responses:
        '200':
          description: The preview
          content:
            application/json:
              schema: { type: object }
        '400':
          description: The mapping names a column the file does not have, or is incomplete
        '403':
          description: The caller may not write contexts
        '410':
          description: The draft expired; upload the file again
  /contexts/uploads/apply:
    post:
      tags: [Contexts]
      summary: Import an uploaded list as a context tree
      operationId: applyContextUpload
      description: >
        Writes the list through the ingest: the list's system (type `Upload`), its synced contexts
        (one tree per member kind, keyed so a re-import updates in place), their members, the
        Responsibles and SameUnitAs links, then records the run in ContextUploads. Contexts of the
        list that are not in the file are kept unless `removeMissing` is true. Without `listId` a
        list whose name was uploaded before is refused (409) rather than merged.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadDraftId, mapping]
              properties:
                uploadDraftId: { type: string, format: uuid }
                listId: { type: integer }
                removeMissing: { type: boolean, default: false }
                mapping: { $ref: '#/components/schemas/ContextUploadMapping' }
      responses:
        '201':
          description: The result
          content:
            application/json:
              schema:
                type: object
                properties:
                  listId: { type: integer }
                  rootContextId: { type: string, format: uuid }
                  uploadId: { type: string, format: uuid }
                  contexts:
                    type: object
                    properties:
                      created: { type: integer }
                      updated: { type: integer }
                      unchanged: { type: integer }
                      removed: { type: integer }
                      notInFile: { type: integer }
                  members: { type: object }
        '400':
          description: The mapping is incomplete or rows cannot be imported (details lists them)
        '403':
          description: The caller may not write contexts
        '409':
          description: A list with this name was uploaded before; choose it to update it
        '410':
          description: The draft expired; upload the file again
  /contexts/tree:
    get:
      tags: [Contexts]
      summary: The context tree, nested
      operationId: getContextTree
      description: >
        Every context nested under its parent, largest subtrees first. With `root`, only that
        subtree.
      security:
        - EntraIdBearer: []
      parameters:
        - { name: root, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One entry per root, each with its `children`
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContextTreeNode' }
        '400':
          description: Malformed root id
  /contexts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contexts]
      summary: One context with its first members, children and roles
      operationId: getContext
      description: >
        The context's attributes (with its template, source algorithm and resolved owner), the
        first 50 members, its direct sub-contexts, and its roles (Accountable first).
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The context
          content:
            application/json:
              schema:
                type: object
                properties:
                  attributes: { $ref: '#/components/schemas/Context' }
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/ContextMember' }
                  subContexts:
                    type: array
                    items: { $ref: '#/components/schemas/Context' }
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/ContextRole' }
        '404':
          description: No such context
    patch:
      tags: [Contexts]
      summary: Change a manual or generated context
      operationId: updateContext
      description: >
        Name, description, parent, owner, attributes or template. A synced context is read-only.
        On a generated context a rename or re-parenting is kept across plugin re-runs. The parent
        must have the same `targetType` and may not create a cycle.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 500 }
                description: { type: string, nullable: true }
                parentContextId: { type: string, format: uuid, nullable: true }
                ownerUserId: { type: string, nullable: true }
                extendedAttributes: { type: object, additionalProperties: true }
                contextCategory:
                  allOf: [{ $ref: '#/components/schemas/ContextCategory' }]
                  nullable: true
      responses:
        '200':
          description: The updated context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Context' }
        '400':
          description: Synced context, no updatable field, a non-template category or an invalid parent
        '403':
          description: The caller may not write contexts
        '404':
          description: No such context
    delete:
      tags: [Contexts]
      summary: Delete a manual or generated context
      operationId: deleteContext
      description: >
        Deletes the context, its subtree, its memberships, roles and relationships. A synced
        context cannot be deleted here — remove the upstream record instead.
      security:
        - EntraIdBearer: []
      responses:
        '204':
          description: Deleted
        '400':
          description: Synced context
        '403':
          description: The caller may not write contexts
        '404':
          description: No such context
  /contexts/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Contexts]
      summary: Re-run the plugin that generated this tree
      operationId: syncContext
      description: >
        Queues a run of the generating plugin onto this tree, with the parameters of the run that
        last wrote it, so stale references update without losing analyst edits.
      security:
        - EntraIdBearer: []
      responses:
        '202':
          description: The run is queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId: { type: string, format: uuid }
                  instanceKey: { type: string }
        '400':
          description: Not a generated tree
        '403':
          description: The caller may not write contexts
        '404':
          description: No such context
  /contexts/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contexts]
      summary: The members of a context, paginated
      operationId: listContextMembers
      description: >
        Direct members, or with `include=descendants` the members of the whole subtree, each
        once. `search` matches the member's display name. A member a decision marked former (an
        interview says they left, an analyst decided the interview is right, the source still lists
        them) is left out of the current members and out of `total`; `overriddenCount` says how
        many were left out, and `includeOverridden=true` lists them too, each with `overridden`.
      security:
        - EntraIdBearer: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: include, in: query, schema: { type: string, enum: [descendants] } }
        - { name: includeOverridden, in: query, description: 'Also list the members a decision marked former', schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: One page of members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ContextMember' }
                  total: { type: integer }
                  overriddenCount: { type: integer, description: 'Members a decision marked former, matching the search' }
        '404':
          description: No such context
    post:
      tags: [Contexts]
      summary: Add a member
      operationId: addContextMember
      description: >
        Adds an entity of the context's `targetType` as an analyst member; a plugin re-run keeps
        it. Refused on a synced context.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId]
              properties:
                memberId: { type: string, format: uuid }
      responses:
        '201':
          description: The membership
          content:
            application/json:
              schema:
                type: object
                properties:
                  contextId: { type: string, format: uuid }
                  memberId: { type: string, format: uuid }
                  memberType: { type: string }
        '400':
          description: Synced context or no uuid member id
        '403':
          description: The caller may not write contexts
        '404':
          description: No such context
  /contexts/{id}/members/{memberId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Contexts]
      summary: Remove a member
      operationId: removeContextMember
      description: Refused on a synced context.
      security:
        - EntraIdBearer: []
      responses:
        '204':
          description: Removed
        '400':
          description: Synced context
        '403':
          description: The caller may not write contexts
        '404':
          description: No such context
  /contexts/{id}/members/{memberId}/move:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Contexts]
      summary: Move a person to another manager's node
      operationId: moveContextMember
      description: >
        Only between two nodes produced by the `manager-hierarchy` plugin. Persisted as an
        override of who the person reports to (the target node's manager), so it survives every
        re-run; dropping the person back on their source manager clears the override.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toContextId]
              properties:
                toContextId: { type: string, format: uuid }
      responses:
        '200':
          description: The move
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: uuid }
                  to: { type: string, format: uuid }
                  memberId: { type: string, format: uuid }
                  managerPrincipalId: { type: string, format: uuid, nullable: true }
        '400':
          description: Same source and target, or a node outside the manager hierarchy
        '403':
          description: The caller may not write contexts
        '404':
          description: No such context
  /contexts/{id}/roles:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contexts]
      summary: Who answers for this context
      operationId: listContextRoles
      description: The Accountable (at most one) and the Responsible persons or accounts, with their names.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The roles, Accountable first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContextRole' }
        '404':
          description: No such context
    put:
      tags: [Contexts]
      summary: Set a role on an organizational unit or a logical application
      operationId: putContextRole
      description: >
        Adds the role as the analyst's (a plugin re-run keeps it). An Accountable replaces the
        context's existing Accountable; a Responsible is added next to the others. The holder is
        an account (`principalId`) or a person (`identityId`), exactly one. Refused on a Segment or
        a Tag, which carry no roles.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/ContextRoleType' }
                principalId: { type: string, format: uuid }
                identityId: { type: string, format: uuid }
      responses:
        '200':
          description: The role as stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextRole' }
        '400':
          description: Invalid body, or the context's template carries no roles
        '403':
          description: The caller may not write contexts
        '404':
          description: No such context, principal or identity
  /contexts/{id}/roles/suggestion:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contexts]
      summary: Best guess for the Accountable of a context that has none
      operationId: getContextRoleSuggestion
      description: >
        For a people or accounts unit, the manager of the most members; for a resource unit or a
        logical application, the account that owns the most of its resources. Suggested only when
        they cover at least 40 % of the members, and never once rejected for this context. Confirm
        it with PUT /contexts/{id}/roles.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The suggested Accountable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextRoleSuggestion' }
        '204':
          description: >
            No suggestion — the context already has an Accountable, its template (Segment, Tag)
            carries no roles, or no signal gives a candidate
        '400':
          description: Invalid id
        '404':
          description: No such context
  /contexts/{id}/roles/suggestion/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Contexts]
      summary: Reject the suggested Accountable
      operationId: rejectContextRoleSuggestion
      description: >
        Remembers that this account (`principalId`) or person (`identityId`), exactly one, is not
        the context's Accountable, so it is never suggested again for this context. Idempotent.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                principalId: { type: string, format: uuid }
                identityId: { type: string, format: uuid }
      responses:
        '204':
          description: Rejected (also when already rejected)
        '400':
          description: Invalid id or body
        '403':
          description: The caller may not write contexts
        '404':
          description: No such context, principal or identity
  /contexts/{id}/roles/{roleId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: roleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Contexts]
      summary: Remove a role
      operationId: deleteContextRole
      description: Removes the role, whoever added it.
      security:
        - EntraIdBearer: []
      responses:
        '204':
          description: Removed
        '403':
          description: The caller may not write contexts
        '404':
          description: No such role on this context
  /contexts/{id}/interviews:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Contexts]
      summary: Add information about a unit or an application (a file or pasted text)
      operationId: createContextInterview
      description: >
        Stores a source: a file (.txt, .md, .docx, .vtt or .srt read to plain text; .csv or .xlsx read
        as a list, one line per row as "Header: value; Header: value") or pasted `text`; at most
        5,000,000 characters. Who it is from (an account or a person) is optional: without one the
        source is the file or the text and who added it. When the report generator's model is
        configured (`NL_REPORTS_LLM_URL`) extraction starts in the background (`extractionStatus`
        pending, running, then done or failed); without it the source is stored as `notConfigured` and
        claims are added by hand. Nothing is written to the context: every claim waits for review.
        Organizational units and logical applications only.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [interviewedAt]
              properties:
                file: { type: string, format: binary, description: 'The file; give this or text' }
                text: { type: string, description: 'Pasted text, when there is no file' }
                principalId: { type: string, format: uuid, description: 'Who it is from, as an account (optional)' }
                identityId: { type: string, format: uuid, description: 'Who it is from, as a person (optional)' }
                interviewedAt: { type: string, format: date, description: The date of the source }
      responses:
        '201':
          description: The stored interview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ContextInterview'
                  - type: object
                    properties:
                      llmConfigured: { type: boolean, description: Whether extraction was started }
        '400':
          description: The file cannot be read, a field is missing, or the context is not a unit or an application
        '403':
          description: The caller may not write contexts
        '404':
          description: No such context, principal or identity
        '413':
          description: The file is larger than 25 MB
    get:
      tags: [Contexts]
      summary: The interviews of a context
      operationId: listContextInterviews
      description: Newest interview first, without the transcript, each with its claim counts. Needs `data.write.contexts`.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The interviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ContextInterview'
                        - type: object
                          properties:
                            proposed: { type: integer }
                            confirmed: { type: integer }
                            rejected: { type: integer }
        '403':
          description: The caller may not write contexts
  /contexts/{id}/interviews/{interviewId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: interviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contexts]
      summary: One interview, with its transcript
      description: The interview with its full transcript and where each claim's quote stands in it, for the transcript view.
      operationId: getContextInterview
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The interview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ContextInterview'
                  - type: object
                    properties:
                      transcript: { type: string }
                      highlights:
                        type: array
                        description: >
                          Where each claim's quote stands in the transcript, sorted by start — string offsets,
                          start inclusive, end exclusive. A claim whose quote is not found has none.
                        items:
                          type: object
                          properties:
                            claimId: { type: string, format: uuid }
                            start: { type: integer, minimum: 0 }
                            end: { type: integer, minimum: 0 }
        '403':
          description: The caller may not write contexts
        '404':
          description: No such interview on this context
    delete:
      tags: [Contexts]
      summary: Delete an interview and its claims
      operationId: deleteContextInterview
      description: >
        Removes the interview and every claim it made. What its confirmed claims already changed (a
        description, an attribute, a role) stays; a role only loses its link to the claim.
      security:
        - EntraIdBearer: []
      responses:
        '204':
          description: Deleted
        '403':
          description: The caller may not write contexts
        '404':
          description: No such interview on this context
  /contexts/{id}/interviews/{interviewId}/extract:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: interviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Contexts]
      summary: Read the transcript again with the model
      operationId: extractContextInterview
      description: >
        Starts extraction again. The interview's undecided model claims are replaced; decided claims
        and an analyst's own stay, and are not proposed again.
      security:
        - EntraIdBearer: []
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextInterview' }
        '403':
          description: The caller may not write contexts
        '404':
          description: No such interview on this context
        '409':
          description: A run started less than 15 minutes ago is still going
        '503':
          description: No local model is configured
  /contexts/{id}/interviews/{interviewId}/claims:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: interviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Contexts]
      summary: Add a claim from an interview by hand
      operationId: addContextClaim
      description: >
        The same check a model's claim passes, with the quote optional; when given it must be a
        verbatim part of the transcript. The person is matched like a model's claim; a role claim's
        suggestion is deduced from its relation unless `roleSuggestion` is given. The claim is proposed.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: { $ref: '#/components/schemas/ContextClaimKind' }
                value: { type: string, maxLength: 2000 }
                subject: { type: string, description: 'The person a role, roleHistory or membership claim is about, as named' }
                attribute: { type: string, maxLength: 80, description: The attribute of a property claim }
                relation: { $ref: '#/components/schemas/ContextClaimRelation' }
                membership: { type: string, enum: [current, former, joined, left], description: The status of a membership claim }
                periodFrom: { type: string, description: 'YYYY, YYYY-MM or YYYY-MM-DD' }
                periodTo: { type: string, description: 'YYYY, YYYY-MM or YYYY-MM-DD' }
                periodText: { type: string }
                quote: { type: string }
                roleSuggestion: { $ref: '#/components/schemas/ContextRoleType' }
      responses:
        '201':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextClaim' }
        '400':
          description: The claim is incomplete or its quote is not in the transcript
        '403':
          description: The caller may not write contexts
        '404':
          description: No such interview on this context
  /contexts/{id}/claims:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: status
        in: query
        required: false
        description: Comma-separated statuses (default all). A reader without `data.write.contexts` gets confirmed and edited claims only, whatever is asked.
        schema: { type: string, example: 'proposed,confirmed' }
    get:
      tags: [Contexts]
      summary: What interviews say about a context
      operationId: listContextClaims
      description: >
        The claims of the context's interviews, newest interview first, each with its source. A
        business reader (and a context owner) sees decided, confirmed claims only.
        `accountableDoubt` names the claim in which the current Accountable says they are not the owner.
        `contradictions` pairs each claim that disagrees with a fact (the member list, the
        Accountable, an attribute) or with another claim — open while a claim of it is proposed,
        decided (with how) once its claims are decided. Read from the claims in the reader's statuses.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The claims
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ContextClaim' }
                  accountableDoubt:
                    type: object
                    nullable: true
                    properties:
                      claimId: { type: string, format: uuid }
                      quote: { type: string, nullable: true }
                      intervieweeName: { type: string }
                      interviewedAt: { type: string, format: date }
                  contradictions:
                    type: array
                    items: { $ref: '#/components/schemas/ContextContradiction' }
        '404':
          description: No such context
  /contexts/{id}/claims/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Contexts]
      summary: Reject several proposed claims at once
      operationId: rejectContextClaims
      description: >
        Rejects every proposed claim of the context of one kind and/or one relevance tier, in one
        statement ("Reject all less relevant", "Reject all descriptions"). A claim from before
        relevance tiers counts as high. Decided claims are not touched.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { $ref: '#/components/schemas/ContextClaimKind' }
                relevance: { type: string, enum: [high, low] }
      responses:
        '200':
          description: What was rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  rejected: { type: integer }
                  ids: { type: array, items: { type: string, format: uuid } }
        '400':
          description: Neither a kind nor a relevance, or an unknown one
        '403':
          description: The caller may not write contexts
        '404':
          description: No such context
  /contexts/{id}/people:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contexts]
      summary: The People overview of a unit or an application
      operationId: listContextPeople
      description: >
        One row per person: the members the source lists, merged with what the added sources say
        about people (role, role history, membership claims) — each person once, with one status,
        their roles here, the claims about them, the open contradictions they are in and what they
        still hold. Sorted: the current members the source lists by name, then the people a source
        says are in it, the not confirmed, the left (decided) and the left, each by name. Paged
        (100 by default); `counts` holds the count of every filter. Set-based: a fixed number of
        statements whatever the size of the unit. A reader without `data.write.contexts` (a context
        owner too) is answered from confirmed claims only. Organizational units and logical
        applications only.
      security:
        - EntraIdBearer: []
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [current, former, all, decide], default: current }
          description: current (current, came back, not confirmed), former (left, left decided), all, or decide (people with an open contradiction)
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
          description: A part of the name
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: One page of people
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ContextPerson' } }
                  total: { type: integer, description: How many the filter holds }
                  counts:
                    type: object
                    properties:
                      current: { type: integer }
                      former: { type: integer }
                      all: { type: integer }
                      decide: { type: integer }
                  filter: { type: string }
                  limit: { type: integer }
                  offset: { type: integer }
                  linkedResources: { type: integer, description: How many resources the context is linked to }
        '400':
          description: Not a unit or an application, or an invalid id
        '404':
          description: No such context
  /contexts/claims/{claimId}:
    parameters:
      - name: claimId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Contexts]
      summary: Confirm, edit or reject a claim
      operationId: decideContextClaim
      description: >
        Only a proposed claim can be decided. Confirming (or editing: confirming with a changed value
        or period) a description appends it to the context's description under "From interview
        with NAME, DATE:"; a property sets `extendedAttributes[attribute]`; an alias is added to
        `extendedAttributes.aliases` (once per spelling); a membership changes nothing but the claim
        (members come from their source) — except that a claim saying a person the member list still
        lists has left, confirmed as said ("the interview is right"), marks them former by a decision
        (effect formerMember, with the source it overrides): the members list then leaves them out,
        the People overview shows them as Left (decided), and ContextMembers stays as the source has it; a role claim with a
        suggestion becomes the ContextRole (addedBy analyst, with the claim as `sourceClaimId`). An
        Accountable is set only when the context has none; otherwise 409 with the current holder, and
        `replace: true` replaces them. Give `principalId` or `identityId` when the claim's person was
        not matched, or was matched wrongly. A claim never creates access.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [confirmed, edited, rejected] }
                value: { type: string, maxLength: 2000 }
                periodFrom: { type: string, nullable: true }
                periodTo: { type: string, nullable: true }
                periodText: { type: string, nullable: true }
                principalId: { type: string, format: uuid }
                identityId: { type: string, format: uuid }
                replace: { type: boolean, description: Replace the current Accountable }
      responses:
        '200':
          description: The decided claim and what it changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim: { $ref: '#/components/schemas/ContextClaim' }
                  effect:
                    type: object
                    properties:
                      kind: { type: string, enum: [none, description, property, alias, role, formerMember] }
                      overrides: { type: string, description: 'formerMember: the source whose member list the decision overrides' }
                      attribute: { type: string }
                      aliases: { type: array, items: { type: string }, description: The context's aliases after an alias claim }
                      role: { $ref: '#/components/schemas/ContextRoleType' }
                      roleId: { type: string, format: uuid }
                      displayName: { type: string }
        '400':
          description: Invalid body, no person chosen for a role, or a template without roles
        '403':
          description: The caller may not write contexts
        '404':
          description: No such claim, principal or identity
        '409':
          description: The claim was decided already, or another person is Accountable (details.current)
  /contexts/claims/{claimId}/undo:
    parameters:
      - name: claimId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Contexts]
      summary: Undo the decision on a claim
      operationId: undoContextClaimDecision
      description: >
        Puts a decided claim back to proposed: its contradiction opens again, and a person its
        decision marked former is a current member again. Only a decision that changed nothing but
        the claim can be undone — any rejection, and a confirmed membership, roleHistory or role
        without a suggestion. A confirmed description, property, alias or role changed the context
        and answers 409.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The claim, proposed again
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim: { $ref: '#/components/schemas/ContextClaim' }
                  unmarked: { type: boolean, description: 'A former-member mark was removed' }
        '400':
          description: Invalid ID
        '403':
          description: The caller may not write contexts
        '404':
          description: No such claim
        '409':
          description: The claim is not decided, or its decision changed the context
  /contexts/claims/mentions:
    get:
      tags: [Contexts]
      summary: The contexts whose interviews mention a person
      operationId: listClaimMentions
      description: >
        For an account or a person page ("Mentioned in interviews"). Claims not rejected for a writer;
        confirmed ones only for a reader without `data.write.contexts`.
      security:
        - EntraIdBearer: []
      parameters:
        - name: principalId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: identityId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The contexts, most recently interviewed first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        contextId: { type: string, format: uuid }
                        contextName: { type: string }
                        contextCategory: { type: string, nullable: true }
                        claims: { type: integer }
                        lastInterviewedAt: { type: string, format: date }
        '400':
          description: Neither principalId nor identityId (a uuid) was given
  /contexts/{id}/relationships:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contexts]
      summary: The contexts this one is related to
      operationId: listContextRelationships
      description: >
        Relationships from either end, with the other context's name and the `direction` as seen
        from this context (`out` when stored on it, `in` otherwise).
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The relationships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContextRelationship' }
        '404':
          description: No such context
    post:
      tags: [Contexts]
      summary: Relate this context to another
      operationId: createContextRelationship
      description: >
        Stores the relationship from this context to `relatedContextId` as the analyst's. One
        relationship of a type per pair, in either direction; a context cannot relate to itself.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relatedContextId, relationshipType]
              properties:
                relatedContextId: { type: string, format: uuid }
                relationshipType: { $ref: '#/components/schemas/ContextRelationshipType' }
      responses:
        '201':
          description: The stored relationship
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  contextId: { type: string, format: uuid }
                  relatedContextId: { type: string, format: uuid }
                  relationshipType: { $ref: '#/components/schemas/ContextRelationshipType' }
                  addedBy: { type: string }
                  createdAt: { type: string, format: date-time }
        '400':
          description: Invalid body, self-link, or the pair already has this relationship
        '403':
          description: The caller may not write contexts
        '404':
          description: Either context is missing
  /contexts/{id}/relationships/{relId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: relId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Contexts]
      summary: Remove a relationship
      operationId: deleteContextRelationship
      description: Either end of the relationship may remove it.
      security:
        - EntraIdBearer: []
      responses:
        '204':
          description: Removed
        '403':
          description: The caller may not write contexts
        '404':
          description: No such relationship on this context

  /context-trees/resolve:
    get:
      tags: [Contexts]
      summary: Which adjustable tree a context is in
      operationId: resolveContextTree
      description: >
        The key of the tree the context belongs to — a generated tree, every imported unit of one
        source and template, or a hand-built tree (docs/architecture/adjust-tree.md).
      security:
        - EntraIdBearer: []
      parameters:
        - name: contextId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  treeKey: { type: string }
                  kind: { type: string, enum: [generated, synced, manual] }
                  name: { type: string }
                  targetType: { type: string }
                  contextCategory: { type: string, nullable: true }
                  canAdjust: { type: boolean }
        '400':
          description: contextId is not a uuid
        '404':
          description: No such context
  /context-trees/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: 'A tree key: gen~<algorithmId>~<instanceKey>, sync~<systemId>~<template> or ctx~<rootId> (URL-encoded)'
        schema: { type: string }
    get:
      tags: [Contexts]
      summary: An adjustable tree with its marks
      operationId: getAdjustableContextTree
      description: >
        Every unit of the tree (parentId null = top level), with whether an adjustment touches or
        created it, its Accountable and an interim manager.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The tree
          content:
            application/json:
              schema: { type: object }
        '400':
          description: Malformed tree key
        '404':
          description: No such tree
  /context-trees/{key}/adjustments:
    parameters:
      - name: key
        in: path
        required: true
        description: 'A tree key: gen~<algorithmId>~<instanceKey>, sync~<systemId>~<template> or ctx~<rootId> (URL-encoded)'
        schema: { type: string }
    get:
      tags: [Contexts]
      summary: The tree's adjustments, newest first
      operationId: listContextTreeAdjustments
      description: The adjustments made to this tree, newest first, each with who made it, when, why and a readable sentence.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ContextTreeAdjustment' }
        '404':
          description: No such tree
    post:
      tags: [Contexts]
      summary: Adjust the tree
      operationId: createContextTreeAdjustment
      description: >
        Records one correction (moveUnit, renameUnit, moveMember, addUnit, splitUnit, setManager)
        and applies it at once. It is applied again after every rebuild of the tree by its source.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [op]
              properties:
                op: { type: string, enum: [moveUnit, renameUnit, moveMember, addUnit, splitUnit, setManager] }
                reason: { type: string }
      responses:
        '201':
          description: The adjustment, applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  adjustment: { $ref: '#/components/schemas/ContextTreeAdjustment' }
        '400':
          description: Invalid adjustment
        '403':
          description: The caller may not write contexts
        '404':
          description: No such tree or unit
  /context-trees/{key}/adjustments/{id}:
    parameters:
      - name: key
        in: path
        required: true
        description: 'A tree key: gen~<algorithmId>~<instanceKey>, sync~<systemId>~<template> or ctx~<rootId> (URL-encoded)'
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Contexts]
      summary: Undo an adjustment
      operationId: undoContextTreeAdjustment
      description: Puts back what the adjustment replaced; the remaining adjustments are applied again.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The adjustment, now reverted
        '400':
          description: Already undone
        '403':
          description: The caller may not write contexts
        '404':
          description: No such adjustment
  /context-trees/{key}/adjustments/{id}/redo:
    parameters:
      - name: key
        in: path
        required: true
        description: 'A tree key: gen~<algorithmId>~<instanceKey>, sync~<systemId>~<template> or ctx~<rootId> (URL-encoded)'
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Contexts]
      summary: Redo an undone adjustment
      operationId: redoContextTreeAdjustment
      description: Makes an undone adjustment active again and reapplies the tree; only an undone adjustment can be redone.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The adjustment, applied again
        '400':
          description: Not undone
        '403':
          description: The caller may not write contexts
        '404':
          description: No such adjustment
  /context-trees/{key}/adjustments/{id}/follow:
    parameters:
      - name: key
        in: path
        required: true
        description: 'A tree key: gen~<algorithmId>~<instanceKey>, sync~<systemId>~<template> or ctx~<rootId> (URL-encoded)'
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Contexts]
      summary: Follow a unit or value the source renamed
      operationId: followContextTreeAdjustment
      description: >
        For an adjustment that needs a decision: point it at the unit (or attribute value) it was
        probably renamed to, as proposed in its suggestion.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The adjustment, re-pointed and applied
        '400':
          description: The adjustment does not need a decision
        '403':
          description: The caller may not write contexts
        '404':
          description: No such adjustment
  /context-trees/{key}/attention:
    parameters:
      - name: key
        in: path
        required: true
        description: 'A tree key: gen~<algorithmId>~<instanceKey>, sync~<systemId>~<template> or ctx~<rootId> (URL-encoded)'
        schema: { type: string }
    get:
      tags: [Contexts]
      summary: What in the tree needs the analyst
      operationId: getContextTreeAttention
      description: >
        Adjustments the source overtook (needs a decision, no longer applies, the source agrees,
        ended), split candidates, and people the tree could not place — each with its fix.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }
        '404':
          description: No such tree
  /context-trees/{key}/units/{unitId}/split-options:
    parameters:
      - name: key
        in: path
        required: true
        description: 'A tree key: gen~<algorithmId>~<instanceKey>, sync~<systemId>~<template> or ctx~<rootId> (URL-encoded)'
        schema: { type: string }
      - name: unitId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contexts]
      summary: The attribute values to split a unit by
      operationId: getContextTreeSplitOptions
      description: Department, job title, company and office values among the unit's direct members, with counts (accounts trees only).
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The attributes and their values
          content:
            application/json:
              schema: { type: object }
        '404':
          description: No such tree or unit

  /change-requests:
    get:
      tags: [Contexts]
      summary: What should change in the sources a decision overrides
      operationId: listChangeRequests
      description: >
        The change requests: one per correction a source still owes, raised when an analyst decision
        overrides a context synced from a system or an uploaded list (for example, a member marked
        former while the list still has them). Before answering, every open request whose change the
        data now shows is resolved (the source no longer lists the member, or the context is gone).
        Open requests come first, newest first; at most 500. A request rests on a confirmed decision,
        so every reader may list them. See docs/architecture/change-requests.md.
      security:
        - EntraIdBearer: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved, withdrawn] }
        - name: systemId
          in: query
          description: Only the requests for this source system
          schema: { type: integer, minimum: 1 }
        - name: contextId
          in: query
          description: Only the requests about this context
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The requests, and how many there are per status (within the system and context filters)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChangeRequest' }
                  counts:
                    type: object
                    properties:
                      open: { type: integer }
                      resolved: { type: integer }
                      withdrawn: { type: integer }
        '400':
          description: A filter is not valid
        '503':
          description: The SQL backend is not configured

  /contexts/{id}/workbench:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contexts]
      summary: The authorization workbench of an organizational unit
      operationId: getContextWorkbench
      description: >
        The people of an organizational unit (one row per person, with every account linked to
        them; an account nobody linked is its own row), the access they hold (the matrix's own
        data, one cell per person and resource with the best grant type over their accounts and
        the business roles that explain it), the business roles among the columns with what they
        Contain, and every activity, expertise and duty claim about these people with its source,
        quote and status. Read-only: proposed roles are composed in the browser and saved only as an
        investigation (/contexts/{id}/workbench/investigations).
        At most 400 people and 300 columns (most held first). Needs data.write.contexts.
        See docs/architecture/m1-discovery-and-design.md.
      security:
        - EntraIdBearer: []
      parameters:
        - name: includeChildren
          in: query
          description: Include the members of every sub-unit (default true)
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: The unit, its people, columns, cells and knowledge
          content:
            application/json:
              schema: { type: object }
        '400':
          description: Not an organizational unit, or a malformed id
        '403':
          description: Missing data.write.contexts
        '404':
          description: No such context
        '503':
          description: The SQL backend is not configured

  /contexts/{id}/knowledge:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Contexts]
      summary: State what a person does, knows or holds
      operationId: addContextKnowledge
      description: >
        An analyst states an activity, expertise or duty of one person, for this unit. Stored as a
        claim (proposedBy analyst) whose source is the unit's "Analyst notes"; confirmed at once
        unless status is proposed, and then it names its object (an Activity, Expertise or Duty
        context, found by name or created). Knowledge only: it never creates access.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: { type: string, enum: [activity, expertise, duty] }
                value: { type: string, maxLength: 200 }
                identityId: { type: string, format: uuid }
                principalId: { type: string, format: uuid }
                quote: { type: string, maxLength: 1000 }
                status: { type: string, enum: [confirmed, proposed], default: confirmed }
      responses:
        '201':
          description: The claim, as the claims API lists it
          content:
            application/json:
              schema: { type: object }
        '400':
          description: The body is not valid
        '403':
          description: Missing data.write.contexts
        '404':
          description: No such context or person
        '503':
          description: The SQL backend is not configured

  /org-knowledge/objects:
    get:
      tags: [Contexts]
      summary: The activities, expertise and duties people are said to hold
      operationId: listOrgKnowledgeObjects
      description: Every object of one kind (or all three), with how many people are said to hold it (confirmed, proposed). Needs data.write.contexts.
      security:
        - EntraIdBearer: []
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [activity, expertise, duty] }
      responses:
        '200':
          description: The objects
          content:
            application/json:
              schema: { type: object }
        '400':
          description: Unknown kind
        '403':
          description: Missing data.write.contexts
        '503':
          description: The SQL backend is not configured

  /org-knowledge/objects/{objectId}/people:
    parameters:
      - name: objectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contexts]
      summary: Who is said to hold one activity, expertise or duty
      operationId: listOrgKnowledgeObjectPeople
      description: Every claim naming this object, with its person, status and the unit it was stated for. Needs data.write.contexts.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The claims, by person
          content:
            application/json:
              schema: { type: object }
        '400':
          description: A malformed id
        '403':
          description: Missing data.write.contexts
        '503':
          description: The SQL backend is not configured

  /contexts/{id}/workbench/investigations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contexts]
      summary: The saved workbench investigations of an organizational unit
      operationId: listWorkbenchInvestigations
      description: >
        Every investigation saved on this unit, last saved first: who saved it and when, when the
        access data on screen was read, how many marks it holds and the names of its proposed roles.
        Org-wide, like saved matrices. Needs data.write.contexts.
        See docs/architecture/m1-discovery-and-design.md ("M2a — save and reopen").
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The investigations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WorkbenchInvestigationSummary' }
        '400':
          description: A malformed id
        '403':
          description: Missing data.write.contexts
        '503':
          description: The SQL backend is not configured
    post:
      tags: [Contexts]
      summary: Save a new workbench investigation
      operationId: createWorkbenchInvestigation
      description: >
        Saves the analyst's whole workbench draft on this unit: the view, the cells on screen, the
        marks and every proposed role. A hypothesis: nothing here creates a business role, an
        assignment or a member, and nothing changes access or a source system.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkbenchInvestigationDraft' }
      responses:
        '201':
          description: The investigation as saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbenchInvestigation' }
        '400':
          description: The draft is not valid, or the context is not an organizational unit
        '403':
          description: Missing data.write.contexts
        '404':
          description: No such context
        '409':
          description: The unit already has an investigation with that name
        '503':
          description: The SQL backend is not configured

  /workbench/investigations/{invId}:
    parameters:
      - name: invId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contexts]
      summary: Open a saved workbench investigation
      operationId: getWorkbenchInvestigation
      description: Everything a reopen needs — the view, the cells on screen when it was saved, the marks and the proposed roles. Needs data.write.contexts.
      security:
        - EntraIdBearer: []
      responses:
        '200':
          description: The investigation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbenchInvestigation' }
        '400':
          description: A malformed id
        '403':
          description: Missing data.write.contexts
        '404':
          description: No such investigation
        '503':
          description: The SQL backend is not configured
    put:
      tags: [Contexts]
      summary: Save over a workbench investigation
      operationId: saveWorkbenchInvestigation
      description: >
        The whole draft replaces what was saved: a mark or a proposed role the draft no longer holds
        is removed; an unchanged mark keeps who made it; a proposed role keeps its id. Send
        expectedUpdatedAt (the updatedAt it was opened with) to be refused when someone saved it since.
      security:
        - EntraIdBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkbenchInvestigationDraft' }
      responses:
        '200':
          description: The investigation as saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkbenchInvestigation' }
        '400':
          description: The draft is not valid, or a malformed id
        '403':
          description: Missing data.write.contexts
        '404':
          description: No such investigation
        '409':
          description: Someone saved it after it was opened, or the name is taken on the unit
        '503':
          description: The SQL backend is not configured
    delete:
      tags: [Contexts]
      summary: Delete a workbench investigation
      operationId: deleteWorkbenchInvestigation
      description: Deletes the investigation with its marks, snapshot and proposed roles. Needs data.write.contexts.
      security:
        - EntraIdBearer: []
      responses:
        '204':
          description: Deleted
        '400':
          description: A malformed id
        '403':
          description: Missing data.write.contexts
        '404':
          description: No such investigation
        '503':
          description: The SQL backend is not configured

  /workbench/investigations/{invId}/proposals/{pid}:
    parameters:
      - name: invId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: pid
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Contexts]
      summary: Delete one proposed role of an investigation
      operationId: deleteWorkbenchProposal
      description: Deletes the proposed role with its members, entitlements and evidence; the investigation's other proposed roles stay. Needs data.write.contexts.
      security:
        - EntraIdBearer: []
      responses:
        '204':
          description: Deleted
        '400':
          description: A malformed id
        '403':
          description: Missing data.write.contexts
        '404':
          description: No such proposed role in this investigation
        '503':
          description: The SQL backend is not configured

components:
  securitySchemes:
    CrawlerApiKey:
      type: http
      scheme: bearer
      description: "Crawler API key (format: fgc_<random>)"
    EntraIdBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Entra ID JWT token

  schemas:
    WorkbenchPersonKey:
      type: string
      description: A workbench row — "i:<identity id>" for a person, "p:<account id>" for an account linked to no person.
      pattern: '^[ipIP]:[0-9a-fA-F-]{36}$'
    WorkbenchMark:
      type: object
      required: [person, resourceId, mark]
      properties:
        person: { $ref: '#/components/schemas/WorkbenchPersonKey' }
        resourceId: { type: string, format: uuid }
        mark: { type: string, enum: [other, unrelated, investigate] }
        note: { type: string, maxLength: 1000, nullable: true }
        markedBy: { type: string, readOnly: true }
        markedAt: { type: string, format: date-time, readOnly: true }
    WorkbenchProposal:
      type: object
      description: A proposed role. Never a business role in Resources; extending one only points at it.
      properties:
        id: { type: string, format: uuid, description: 'Optional on save. A UUID the browser chose is kept; any other value (an unsaved draft''s handle) makes it a new proposal' }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 1000, nullable: true }
        baseBusinessRoleId: { type: string, format: uuid, nullable: true }
        mode: { type: string, enum: [new, extend], readOnly: true }
        status: { type: string, enum: [draft, inReview, approved, rejected], readOnly: true }
        version: { type: integer, readOnly: true }
        members:
          type: array
          items: { $ref: '#/components/schemas/WorkbenchPersonKey' }
        entitlements:
          type: array
          items: { type: string, format: uuid }
        evidenceClaimIds:
          type: array
          items: { type: string, format: uuid }
        kind:
          type: string
          enum: [rule, requestable]
          nullable: true
          description: How the role is assigned — rule-based (assignment origin Automatic) or requestable (Requested); null until chosen
        rule:
          type: object
          nullable: true
          description: 'The assignment rule: { includeChildren, filters: { <column>: { values, includeProposed, contains } } } — who holds it (rule) or who may request it (requestable)'
        excluded:
          type: array
          description: People always excluded from the rule's matches
          items: { $ref: '#/components/schemas/WorkbenchPersonKey' }
        joinerPolicy: { type: string, enum: [auto, approval], default: auto }
        leaverPolicy: { type: string, enum: [remove, review, keep], default: remove }
        approver:
          type: object
          nullable: true
          description: Who approves a request
          properties:
            kind: { type: string, enum: [accountable, owner, person] }
            principalId: { type: string, format: uuid, nullable: true }
            name: { type: string, nullable: true }
        rationale: { type: string, maxLength: 2000, nullable: true, description: Why the role should exist }
    WorkbenchInvestigationDraft:
      type: object
      description: The whole workbench draft. On a save over an investigation, what it leaves out is removed.
      properties:
        name: { type: string, maxLength: 200, description: Required for a new investigation }
        description: { type: string, maxLength: 1000, nullable: true }
        view: { type: object, description: 'The workbench view: columns, filters, sort, includeChildren, minHolders, columnSearch, groupBy' }
        accessReadAt: { type: string, format: date-time, nullable: true }
        accessCells:
          type: array
          maxItems: 120000
          items: { type: string, description: '"personKey|resourceId|Direct|Indirect|Eligible"' }
        marks:
          type: array
          maxItems: 120000
          items: { $ref: '#/components/schemas/WorkbenchMark' }
        proposals:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/WorkbenchProposal' }
        expectedUpdatedAt: { type: string, format: date-time, nullable: true }
    WorkbenchInvestigationSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        accessReadAt: { type: string, format: date-time, nullable: true }
        markCount: { type: integer }
        proposals:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    WorkbenchInvestigation:
      type: object
      properties:
        id: { type: string, format: uuid }
        contextId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        view: { type: object }
        accessReadAt: { type: string, format: date-time, nullable: true }
        accessCells:
          type: array
          items: { type: string }
        marks:
          type: array
          items: { $ref: '#/components/schemas/WorkbenchMark' }
        proposals:
          type: array
          items: { $ref: '#/components/schemas/WorkbenchProposal' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    ContextOwnerAccess:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: True when context owners may sign in and see their own contexts
    ContextCategory:
      type: string
      description: The template a context follows. Null means "Other" (a type the templates do not cover).
      enum: [OrganizationalUnit, LogicalApplication, Tag, Segment]
    ContextRoleType:
      type: string
      enum: [Accountable, Responsible]
    ContextUploadTemplate:
      type: string
      enum: [OrganizationalUnit, LogicalApplication]
    ContextUploadMapping:
      type: object
      description: How the columns of an uploaded list become contexts (docs/architecture/context-upload.md).
      required: [template, listName, nameColumn]
      properties:
        template: { $ref: '#/components/schemas/ContextUploadTemplate' }
        listName: { type: string, maxLength: 200 }
        nameColumn: { type: string }
        keyColumn: { type: string, description: Defaults to the name column }
        ownerColumn: { type: string, nullable: true }
        responsibleColumn: { type: string, nullable: true }
        parentColumn: { type: string, nullable: true }
        memberColumns:
          type: array
          maxItems: 20
          items:
            type: object
            required: [column, kind]
            properties:
              column: { type: string }
              kind: { type: string, enum: [Identity, Principal, Resource] }
              shape: { type: string, enum: [list, long] }
        attributeColumns: { type: array, items: { type: string } }
    ContextRelationshipType:
      type: string
      enum: [SameUnitAs]
    Context:
      type: object
      description: One context as the list and the detail return it.
      properties:
        id: { type: string, format: uuid }
        variant: { type: string, enum: [synced, generated, manual] }
        targetType: { type: string, enum: [Identity, Resource, Principal, System] }
        contextType: { type: string }
        contextCategory:
          allOf: [{ $ref: '#/components/schemas/ContextCategory' }]
          nullable: true
        displayName: { type: string }
        description: { type: string, nullable: true }
        parentContextId: { type: string, format: uuid, nullable: true }
        scopeSystemId: { type: integer, nullable: true }
        scopeSystemName: { type: string, nullable: true }
        sourceAlgorithmId: { type: string, format: uuid, nullable: true }
        sourceAlgorithmName: { type: string, nullable: true, description: Name of the context plugin that produced it }
        sourceAlgorithmDisplayName: { type: string, nullable: true }
        ownerUserId: { type: string, nullable: true, description: What the source calls the creator; not a role }
        ownerPrincipalId: { type: string, format: uuid, nullable: true }
        ownerDisplayName: { type: string, nullable: true }
        externalId: { type: string, nullable: true }
        directMemberCount: { type: integer, nullable: true }
        totalMemberCount: { type: integer, nullable: true }
        overriddenMemberCount:
          type: integer
          description: 'GET /contexts/{id} only: direct members a decision marked former (still in directMemberCount, as their source lists them)'
        userRenamed: { type: boolean }
        userReparented: { type: boolean }
        extendedAttributes: { type: object, additionalProperties: true, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContextTreeNode:
      allOf:
        - $ref: '#/components/schemas/Context'
        - type: object
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/ContextTreeNode' }
    ContextInput:
      type: object
      required: [targetType, contextType, displayName]
      properties:
        targetType: { type: string, enum: [Identity, Resource, Principal, System] }
        contextType: { type: string, maxLength: 100 }
        displayName: { type: string, maxLength: 500 }
        description: { type: string }
        parentContextId: { type: string, format: uuid }
        scopeSystemId: { type: integer }
        ownerUserId: { type: string }
        externalId: { type: string }
        contextCategory:
          allOf: [{ $ref: '#/components/schemas/ContextCategory' }]
          nullable: true
          description: Defaults to the parent's template, else null
    ContextMember:
      type: object
      properties:
        id: { type: string }
        displayName: { type: string, nullable: true }
        addedBy: { type: string, enum: [sync, algorithm, analyst] }
        addedAt: { type: string, format: date-time }
        overridden: { $ref: '#/components/schemas/ContextMemberOverrideDecision' }
        holderCount:
          type: integer
          description: Resource members only — distinct holders of the resource (live assignments).
        ownerDisplayName:
          type: string
          nullable: true
          description: >
            Resource members only — the owner: through the ownership link, else the source's ownerId
            resolved to an account, else the source's ownerName as-is.
        ownerEmployeeId: { type: string, nullable: true, description: Resource members only. }
        ownerEmail: { type: string, nullable: true, description: Resource members only. }
      additionalProperties: true
    ContextPerson:
      type: object
      description: >
        One person on a unit's (or an application's) People overview: a member the source lists,
        merged with what the added sources say about them. Keyed by the holder in the context's kind
        of member (`principalId:<id>` / `identityId:<id>`), else by the name as said (`name:<name>`).
      properties:
        key: { type: string }
        status:
          type: string
          enum: [current, cameBack, notConfirmed, leftDecided, left]
          description: >
            current — the source lists them; cameBack — listed, and a source says they left once and
            came back; notConfirmed — a source says they are in it, the member list does not list them;
            leftDecided — the source still lists them, a decision marked them former; left — a source
            says they left and the list does not list them.
        former: { type: boolean, description: 'leftDecided or left: the Former filter' }
        principalId: { type: string, format: uuid, nullable: true }
        identityId: { type: string, format: uuid, nullable: true }
        displayName: { type: string }
        email: { type: string, nullable: true }
        jobTitle: { type: string, nullable: true }
        department: { type: string, nullable: true }
        principalType: { type: string, nullable: true }
        accountEnabled: { type: boolean, nullable: true }
        accountDeleted: { type: boolean }
        roles: { type: array, items: { $ref: '#/components/schemas/ContextRoleType' }, description: The roles they hold here }
        role: { $ref: '#/components/schemas/ContextMemberRoleFact' }
        rejoined: { $ref: '#/components/schemas/ContextMemberRejoinFact' }
        left: { $ref: '#/components/schemas/ContextMemberClaimFact' }
        decision: { $ref: '#/components/schemas/ContextMemberOverrideDecision' }
        stillListed: { type: boolean, description: 'Marked former by a decision while the source still lists them' }
        sources:
          type: array
          items: { type: string, enum: [list, interview, file, text] }
          description: The member list when it lists them, then each kind of added source that says something about them
        claims:
          type: array
          description: Every role, role history and membership claim about them the reader may see
          items: { $ref: '#/components/schemas/ContextClaim' }
        contradictions:
          type: array
          items: { type: string }
          description: The ids of the open contradictions their claims are in (GET …/claims → contradictions)
        liveEntitlements: { type: integer, nullable: true, description: 'Live entitlements they hold; null when nobody was matched' }
        linkedEntitlements: { type: integer, nullable: true, description: How many of those are on this context's resources; null when it has none }
    ContextMemberOverrideDecision:
      type: object
      nullable: true
      description: >
        The decision that marked a member former although their source still lists them; null when
        there is none.
      properties:
        by: { type: string, nullable: true }
        at: { type: string, format: date-time }
        overrides: { type: string, description: 'The source whose member list the decision overrides' }
        claimId: { type: string, format: uuid }
    ContextMemberClaimFact:
      type: object
      nullable: true
      description: One claim about a member, with its source.
      properties:
        claimId: { type: string, format: uuid }
        interviewId: { type: string, format: uuid }
        value: { type: string }
        status: { type: string, enum: [proposed, confirmed, edited] }
        membershipStatus: { type: string, enum: [current, former, joined, left, rejoined] }
        periodFrom: { type: string, format: date, nullable: true }
        periodTo: { type: string, format: date, nullable: true }
        periodText: { type: string, nullable: true }
        quote: { type: string, nullable: true }
        intervieweeName: { type: string }
        interviewedAt: { type: string, format: date }
    ContextMemberRoleFact:
      type: object
      nullable: true
      description: A member's latest role at the context from the interviews, with every role claim about them, oldest first.
      allOf:
        - $ref: '#/components/schemas/ContextMemberClaimFact'
        - type: object
          properties:
            history: { type: array, items: { $ref: '#/components/schemas/ContextMemberClaimFact' } }
    ContextContradiction:
      type: object
      description: >
        A claim and what it contradicts, each with its source. Decided by deciding its claim(s): no
        record of its own.
      properties:
        id: { type: string }
        rule: { type: string, enum: [leftButMember, memberNotListed, accountable, notOwner, property, claims] }
        status: { type: string, enum: [open, decided] }
        resolution: { type: string, nullable: true, enum: [interview, source, both, first, second, neither, null] }
        claimIds: { type: array, items: { type: string, format: uuid } }
        decidedAt: { type: string, format: date-time, nullable: true }
        decidedBy: { type: string, nullable: true }
        claim: { $ref: '#/components/schemas/ContextContradictionSide' }
        other: { $ref: '#/components/schemas/ContextContradictionSide' }
    ContextContradictionSide:
      type: object
      description: One side — a claim (kind claim, with the claim and its interview) or a fact (kind fact, with its source in words).
      properties:
        kind: { type: string, enum: [claim, fact] }
        statement: { type: string }
        source: { type: string }
        claim: { type: object, additionalProperties: true }
    ContextMemberRejoinFact:
      type: object
      nullable: true
      description: >
        The member left once and is in it again: the claim that says they came back, with the roles
        of the earlier stint, oldest first.
      allOf:
        - $ref: '#/components/schemas/ContextMemberClaimFact'
        - type: object
          properties:
            earlier: { type: array, items: { $ref: '#/components/schemas/ContextMemberClaimFact' } }
    ContextRole:
      type: object
      description: Who answers for a context; the holder is an account or a person, exactly one.
      properties:
        id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/ContextRoleType' }
        principalId: { type: string, format: uuid, nullable: true }
        identityId: { type: string, format: uuid, nullable: true }
        displayName: { type: string, nullable: true }
        addedBy:
          type: string
          enum: [sync, algorithm, analyst, sourceOwner]
          description: "`sourceOwner` is the owner a synced context's source names (ownerUserId), kept in step on every sync; `sync` is a role a crawler stated directly."
        sourceClaimId: { type: string, format: uuid, nullable: true, description: The interview claim this role was confirmed from }
        sourceIntervieweeName: { type: string, nullable: true }
        sourceInterviewedAt: { type: string, format: date, nullable: true }
        sourceQuote: { type: string, nullable: true }
    ContextClaimKind:
      type: string
      enum: [description, property, role, roleHistory, membership, alias]
    ContextClaimRelation:
      type: string
      description: What a role claim's person is to the context, as the speaker said it.
      enum: [owner, notOwner, dayToDay, delegate, member, other]
    ChangeRequest:
      type: object
      description: >
        What should change in a source that an analyst decision overrides. The names are as they
        were when the request was raised.
      properties:
        id: { type: string, format: uuid }
        changeKind: { type: string, enum: [EntityCreate, EntityDelete, RelationshipAdd, RelationshipRemove, AttributeUpdate] }
        targetSystemId: { type: integer, nullable: true }
        targetName: { type: string }
        contextId: { type: string, format: uuid, nullable: true }
        contextName: { type: string, nullable: true }
        memberId: { type: string, format: uuid, nullable: true }
        memberName: { type: string, nullable: true }
        attribute: { type: string, nullable: true }
        currentValue: { type: string, nullable: true }
        expectedValue: { type: string, nullable: true }
        summary: { type: string, description: "One line a person can act on, such as: Remove Led from Klanten" }
        status: { type: string, enum: [open, resolved, withdrawn] }
        basisClaimId: { type: string, format: uuid, nullable: true }
        overrideId: { type: string, format: uuid, nullable: true }
        raisedBy: { type: string, nullable: true }
        raisedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        closedReason: { type: string, nullable: true }
    ContextInterview:
      type: object
      description: >
        A source added to a context (Add information): an interview (from an account or a person),
        a file or list from nobody in particular, or pasted text. The paths and the table keep the
        word "interview" for any of them. Without a person, `intervieweeName` is who added it (or the
        file name).
      properties:
        id: { type: string, format: uuid }
        contextId: { type: string, format: uuid }
        principalId: { type: string, format: uuid, nullable: true }
        identityId: { type: string, format: uuid, nullable: true }
        intervieweeName: { type: string }
        interviewedAt: { type: string, format: date }
        fileName: { type: string, description: 'The file as uploaded; "Pasted text" for pasted text' }
        sourceKind: { type: string, enum: [interview, file, text] }
        language: { type: string, nullable: true }
        extractionStatus: { type: string, enum: [pending, running, done, failed, notConfigured] }
        extractionMessage: { type: string, nullable: true }
        extractionStartedAt: { type: string, format: date-time, nullable: true }
        model: { type: string, nullable: true }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ContextClaim:
      type: object
      description: >
        A statement an interview makes about a context or a person, with the verbatim quote it rests
        on. Proposed until someone decides it. `attribute` is a property's key, a role claim's relation, or
        a membership claim's status (current, former, joined, left).
      properties:
        id: { type: string, format: uuid }
        interviewId: { type: string, format: uuid }
        contextId: { type: string, format: uuid }
        claimKind: { $ref: '#/components/schemas/ContextClaimKind' }
        subjectKind: { type: string, enum: [Context, Person] }
        principalId: { type: string, format: uuid, nullable: true }
        identityId: { type: string, format: uuid, nullable: true }
        subjectName: { type: string, nullable: true, description: The person as named in the interview }
        subjectDisplayName: { type: string, nullable: true, description: The matched account's or person's name }
        subjectMatch: { type: string, nullable: true, description: 'How the person was matched: interviewee, key, name, fuzzy or firstName' }
        attribute: { type: string, nullable: true }
        value: { type: string }
        periodFrom: { type: string, format: date, nullable: true }
        periodTo: { type: string, format: date, nullable: true }
        periodText: { type: string, nullable: true }
        quote: { type: string, nullable: true }
        quoteStart: { type: integer, nullable: true, description: Where the quote starts in the transcript (string offset) }
        quoteEnd: { type: integer, nullable: true, description: Where it ends (exclusive) }
        confidence: { type: number, nullable: true }
        relevance: { type: string, nullable: true, enum: [high, low], description: 'How much it matters for access governance; null (older claims) reads as high' }
        roleSuggestion: { type: string, nullable: true, enum: [Accountable, Responsible] }
        status: { type: string, enum: [proposed, confirmed, rejected, edited] }
        proposedBy: { type: string, enum: [model, analyst], description: Who proposed the claim }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        appliedRoleId: { type: string, format: uuid, nullable: true }
        intervieweeName: { type: string }
        interviewedAt: { type: string, format: date }
        fileName: { type: string }
        sourceKind: { type: string, enum: [interview, file, text], description: What kind of source the claim comes from }
    ContextRoleSuggestion:
      type: object
      description: A suggested Accountable and why; the holder is an account or a person, exactly one.
      required: [role, displayName, reason, count, total]
      properties:
        role: { type: string, enum: [Accountable] }
        principalId: { type: string, format: uuid }
        identityId: { type: string, format: uuid }
        displayName: { type: string }
        reason: { type: string, example: manages 11 of the 14 members }
        count: { type: integer, description: Members the candidate manages or owns }
        total: { type: integer, description: Members of the context's kind }
    ContextRelationship:
      type: object
      description: A relationship as seen from one context.
      properties:
        id: { type: string, format: uuid }
        relationshipType: { $ref: '#/components/schemas/ContextRelationshipType' }
        direction: { type: string, enum: [out, in], description: "`out` when stored on this context" }
        relatedContextId: { type: string, format: uuid }
        relatedDisplayName: { type: string }
        relatedContextCategory:
          allOf: [{ $ref: '#/components/schemas/ContextCategory' }]
          nullable: true
        relatedTargetType: { type: string }
        relatedTotalMemberCount: { type: integer, nullable: true, description: "Members of the related context, sub-contexts included." }
        addedBy: { type: string, enum: [sync, algorithm, analyst] }
        createdAt: { type: string, format: date-time }
    ContextTreeAdjustment:
      type: object
      description: One correction of a generated or imported tree, as the Adjust tree log shows it.
      properties:
        id: { type: string, format: uuid }
        op: { type: string, enum: [moveUnit, renameUnit, moveMember, addUnit, splitUnit, setManager] }
        subjectId: { type: string, format: uuid, nullable: true }
        subjectName: { type: string, nullable: true }
        memberId: { type: string, format: uuid, nullable: true }
        payload: { type: object }
        reason: { type: string, nullable: true }
        validUntil: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, needsDecision, orphaned, matches, expired, reverted] }
        statusDetail: { type: string, nullable: true }
        suggestion: { type: object, nullable: true }
        description: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    ContextRecipe:
      type: object
      description: >
        What a context built with the assistant searches for, and the analyst's corrections to it.
        Stored as the parameters of the `context-recipe` context plugin and re-applied after every
        crawl. Include and exclude live here rather than as member edits, because a plugin run
        replaces every member it added.
      properties:
        version:
          type: integer
          enum: [1]
        name:
          type: string
          maxLength: 200
        target:
          type: string
          enum: [resource]
        resourceTypes:
          type: array
          maxItems: 20
          items: { type: string }
        fields:
          type: array
          description: Text fields to search, by catalog name.
          items:
            type: string
            enum: [displayName, description, mail]
        terms:
          type: array
          maxItems: 40
          items:
            type: object
            required: [text]
            properties:
              text:
                type: string
                maxLength: 60
              key:
                type: string
                description: The term reduced to lowercase letters, digits and single spaces — what is matched.
              match:
                type: string
                enum: [token, wordStart, contains]
              state:
                type: string
                enum: [accepted, rejected]
              origin:
                type: string
                enum: [model, analyst, related]
              own:
                type: boolean
                description: A model term containing one of the analyst's own words; only these arrive ticked.
              why:
                type: string
                maxLength: 40
        include:
          type: array
          maxItems: 2000
          description: Objects kept in whatever the terms find.
          items: { type: string, format: uuid }
        exclude:
          type: array
          maxItems: 2000
          description: Objects kept out; wins over every term.
          items: { type: string, format: uuid }
        structure:
          type: string
          enum: [byTerm, flat]
        template:
          type: string
          description: What the context is — its template, written as the root's contextCategory. Defaults to LogicalApplication.
          enum: [OrganizationalUnit, LogicalApplication, Tag, Segment]
    ContextTermsReply:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [terms, clarify, error]
        name:
          type: string
          description: A name for the context, proposed by the model.
        template:
          type: string
          nullable: true
          description: >
            What the model takes the subject to be (a guess for the recipe's template); null when
            it gave none or an unknown one. The builder applies it only while the analyst has not
            chosen a template themselves.
          enum: [OrganizationalUnit, LogicalApplication, Tag, Segment]
        terms:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              match:
                type: string
                enum: [token, wordStart, contains]
              state:
                type: string
                enum: [accepted, rejected]
              origin:
                type: string
                enum: [model]
              own: { type: boolean }
              why: { type: string }
        notes:
          type: array
          items: { type: string }
        question:
          type: string
          description: Present when kind is clarify.
        options:
          type: array
          items: { type: string }
        message:
          type: string
          description: Present when kind is error.
        raw:
          type: string
          description: The model's reply as it came back.
        timing:
          type: object
          additionalProperties: { type: integer }
    ContextSaveResult:
      type: object
      properties:
        runId: { type: string, format: uuid }
        contextId:
          type: string
          format: uuid
          nullable: true
        membersAdded: { type: integer }
        membersRemoved: { type: integer }
    ReportViewInput:
      type: object
      required: [name]
      properties:
        reportName:
          type: string
          description: The standard report this is a view of. Required on create; ignored on update.
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        params:
          type: object
          description: >
            The report's parameters, as its `parametersSchema` declares them. Each value is a
            string or a list of strings; undeclared keys and empty values are dropped.
          additionalProperties: true
    ReportView:
      type: object
      properties:
        id: { type: string, format: uuid }
        report:
          type: string
          description: The name the view is listed and run under in `/reports` (`view-<id>`).
        reportName: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        params:
          type: object
          additionalProperties: true
        createdBy: { type: string, nullable: true }
        updatedBy: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    ReportMetadata:
      type: object
      description: Everything a client needs to list and render a report — no report-specific knowledge.
      required: [name, displayName, form, columns]
      properties:
        name:
          type: string
          description: Stable template slug, used as the path parameter.
        displayName:
          type: string
        description:
          type: string
        form:
          type: string
          description: "Presentation form the client resolves a renderer for (e.g. list)."
        parametersSchema:
          type: object
          description: JSON-Schema-ish description of the parameters the template accepts.
        columns:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key:
                type: string
              label:
                type: string
        exportFormats:
          type: array
          description: >
            Formats this deployment can serve the report as a download in, for use as the
            `format` parameter of the export endpoint. Advertised rather than assumed, so a
            client only offers downloads the server can actually produce.
          items:
            type: string
          example: [csv, json]
        pivots:
          type: array
          description: >
            Pivot tables the `xlsx` download opens with, each on its own tab over the report's
            rows. Every field is a column key; values are summed. Empty for most reports.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, description: "Tab name." }
              rows: { type: array, items: { type: string }, description: "Row fields, outermost first." }
              filters: { type: array, items: { type: string }, description: "Filter fields." }
              values: { type: array, items: { type: string }, description: "Summed fields." }
        charts:
          type: array
          description: >
            Pie charts the `xlsx` download opens with, on a Charts tab after the summary. Each
            splits the rows over one column key, counting rows or summing `value`. Empty for most
            reports.
          items:
            type: object
            required: [name, type, category]
            properties:
              name: { type: string }
              type: { type: string, enum: [pie] }
              category: { type: string, description: "Column key whose values are the slices." }
              value: { type: string, description: "Column key summed per slice; omitted, rows are counted." }
              title: { type: string }
              valueLabel: { type: string }
              colors: { type: object, additionalProperties: { type: string }, description: "Slice colour per category, RRGGBB." }
        source:
          type: string
          enum: [builtin, custom, view]
          description: >
            `builtin` ships with Identity Atlas; `custom` was built by someone in this
            deployment (the experimental custom reports feature); `view` is a saved view of a
            built-in report. Clients list them apart.
        view:
          type: object
          nullable: true
          description: For a saved view, which view it is and which standard report it runs. Null otherwise.
          properties:
            id: { type: string, format: uuid }
            reportName: { type: string }
            reportDisplayName: { type: string }
        author:
          type: object
          nullable: true
          description: Who built a custom report and who last changed it. Null for built-in reports.
          properties:
            createdBy:
              type: string
              nullable: true
            updatedBy:
              type: string
              nullable: true
            updatedAt:
              type: string
              format: date-time
              nullable: true
        editable:
          type: object
          nullable: true
          description: >
            Present on a custom report. `builderId` opens it in the report builder. Editing and
            deleting it also require the `data.write.reports` permission.
          properties:
            builderId:
              type: string

    ErrorMessage:
      type: object
      properties:
        error:
          type: string

    ReportColumn:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string
        discovered:
          type: boolean
          description: >
            Only in the builder catalog: the column reads an `extendedAttributes` key found in this
            deployment's own data rather than a field of the shared catalog.
        headerFill:
          type: string
          pattern: '^[0-9A-Fa-f]{8}$'
          description: >
            Optional ARGB colour for the column's header in the Excel download, to set a group of
            columns apart (the unit report's organisational-claim columns).


    ReportDefinition:
      type: object
      description: >
        A custom report definition — `{ entity, match, conditions, columns, groupBy?, sort?, limit? }`.
        Conditions are `field`, `relation`, `group` or `compare` objects; the catalog lists the
        entities, fields, relations and operators they may use. The server validates every
        definition and returns the normalised form.

      required: [entity]
      additionalProperties: true
      properties:
        entity:
          type: string
        match:
          type: string
          enum: [all, any]
        conditions:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: true
        columns:
          type: array
          maxItems: 15
          items:
            type: string
        groupBy:
          type: string
          description: >
            Count records per distinct value of this field instead of listing them. The result then
            has two columns — the value and `count` — and no record to open per row. Not combinable
            with a compare condition, and not allowed on a date field.
        sort:
          type: object
          description: >
            On a grouped definition the field must be the grouped field or `count`; the default is
            the largest count first.
          properties:
            field:
              type: string
            direction:
              type: string
        limit:
          type: integer
          maximum: 5000
          default: 1000


    ReportConfirmation:
      type: object
      description: >
        A named object in the definition that did not match exactly — the analyst picks one of
        `choices` or types the exact name, and sends it to `/nl-reports/resolve`.
      properties:
        kind:
          type: string
          enum: [reference, value]
        path:
          type: array
          description: Index path to the condition in the definition.
          items:
            type: integer
        name:
          type: string
        label:
          type: string
        message:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              type:
                type: string
                nullable: true
              score:
                type: number

    ReportExplanation:
      type: object
      description: The definition in plain language, one line per condition.
      properties:
        title:
          type: string
        lines:
          type: array
          items:
            type: object
            properties:
              depth:
                type: integer
              text:
                type: string

    SavedReportInput:
      type: object
      required: [name, definition]
      properties:
        name:
          type: string
          maxLength: 200
          description: Unique (case-insensitive).
        description:
          type: string
          maxLength: 2000
        question:
          type: string
          maxLength: 2000
          description: The question the report was built from, if any.
        definition:
          $ref: '#/components/schemas/ReportDefinition'

    SavedReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        definition:
          $ref: '#/components/schemas/ReportDefinition'
        question:
          type: string
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time

    ReportGeneratorModel:
      type: object
      description: A model on the local model server. Size details are reported by the Ollama backend only.
      properties:
        name:
          type: string
        loaded:
          type: boolean
        sizeBytes:
          type: integer
        parameterSize:
          type: string
        quantization:
          type: string

    IngestEnvelope:
      type: object
      required: [records]
      properties:
        systemId:
          type: integer
          description: Target system ID (required for all entity types except systems)
        syncMode:
          type: string
          enum: [full, delta]
          default: delta
          description: "full: merge + delete missing records. delta: merge only."
        scope:
          type: object
          description: 'Narrow delete scope (e.g., { resourceType: "Group" })'
          additionalProperties:
            type: string
        idGeneration:
          type: string
          enum: [native, deterministic]
          default: native
        idPrefix:
          type: string
          description: Namespace for deterministic GUID generation
        syncSession:
          type: string
          enum: [start, continue, end]
          description: For chunked uploads across multiple requests
        syncId:
          type: string
          format: uuid
          description: Session ID (required for continue/end)
        records:
          type: array
          maxItems: 50000
          items:
            type: object
            additionalProperties: true

    IngestResult:
      type: object
      properties:
        table:
          type: string
        inserted:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
        records:
          type: integer
        durationMs:
          type: integer
        accountable:
          type: object
          description: >-
            Contexts only. The owner a source names on a synced context
            (ownerUserId) is stated as that context's Accountable: matched to an
            account by externalId, else by an employeeId exactly one live account
            carries. An Accountable an analyst or a plugin set is never changed.
          properties:
            set:
              type: integer
              description: Accountables added where the context had none
            replaced:
              type: integer
              description: Source-set Accountables pointed at a different account
            removed:
              type: integer
              description: Source-set Accountables removed because the source no longer names a resolvable owner
            unresolved:
              type: integer
              description: Contexts whose named owner matched no account (or more than one by employeeId)

    ReconcileRequest:
      type: object
      required: [entity, systemId, before]
      properties:
        entity:
          type: string
          description: Ingest entity type (e.g. resource-assignments); must carry a system scope
        systemId:
          type: integer
        scope:
          type: object
          description: 'Narrow the reconcile to a scope (e.g. { assignmentType: "Direct", resourceType: "Entitlement" })'
          additionalProperties:
            type: string
        before:
          type: string
          format: date-time
          description: Rows not ingested since this moment are reconciled away

    ReconcileResult:
      type: object
      properties:
        table:
          type: string
        deleted:
          type: integer
        before:
          type: string
          format: date-time

    CountResult:
      type: object
      properties:
        table:
          type: string
        count:
          type: integer
          description: Live rows of the system and scope touched since `since`
        since:
          type: string
          format: date-time

    CrawlerInfo:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        serverTime:
          type: string
          format: date-time
          description: The API container's clock at the time of the call
        systemIds:
          type: array
          items:
            type: integer
          nullable: true
        permissions:
          type: array
          items:
            type: string

    RotateResult:
      type: object
      properties:
        apiKey:
          type: string
          description: New API key (shown once)
        apiKeyPrefix:
          type: string
        rotatedAt:
          type: string
          format: date-time

    CreateCrawler:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          maxLength: 255
        description:
          type: string
        systemIds:
          type: array
          items:
            type: integer
          nullable: true
          description: Allowed system IDs (null = all)
        permissions:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ingest, refreshViews]
          default: [ingest]
          description: >-
            Crawler permissions. Only ingest and refreshViews can be granted
            through the API; the worker-class admin permission belongs to the
            built-in worker alone.
        rateLimit:
          type: integer
          default: 100
        expiresAt:
          type: string
          format: date-time
          nullable: true

  responses:
    ContextAssistantForbidden:
      description: The caller lacks `data.write.contexts` (checked before the feature flag)
    ContextAssistantDisabled:
      description: The `contextAssistant` feature is not enabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ContextAssistantBadRequest:
      description: The request or the recipe is invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              errors:
                type: array
                items:
                  type: string
    ContextAssistantFailed:
      description: The request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    IngestSuccess:
      description: Ingest successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestResult'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              details:
                type: array
                items:
                  type: string
    Unauthorized:
      description: Missing or invalid API key
    Forbidden:
      description: Insufficient permissions or system access
    CustomReportsForbidden:
      description: The caller lacks the required permission (checked before the feature flag)
    CustomReportsDisabled:
      description: The `customReports` feature is not enabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    CustomReportsBadRequest:
      description: The request or report definition is invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              errors:
                type: array
                items:
                  type: string
    CustomReportsFailed:
      description: The request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ModelServerFailed:
      description: The local model server is not reachable or failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
