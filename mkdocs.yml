site_name: Identity Atlas
site_description: Universal authorization intelligence — sync, analyze, and govern permissions from any identity system
site_url: https://fortigi.github.io/IdentityAtlas
repo_url: https://github.com/Fortigi/IdentityAtlas
repo_name: Fortigi/IdentityAtlas
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mike:
      canonical_version: stable

# The per-suite HTML coverage reports under docs/coverage/ are generated and
# committed by .github/workflows/coverage.yml. They're linked from the curated
# Test Coverage page rather than the nav, so silence the "not in nav" warnings.
not_in_nav: |
  /coverage/

extra_css:
  - assets/extra.css

