name: DoR reset (release sidekick on PR close)

# Build-side slice B (deterministic — no AI): when a deployed PR is merged or closed, reset the
# sidekick that was holding it (docker compose down -v + image prune), clear its reservation, and
# bring the edge placeholder back so its N.build URL serves something between builds. INERT until
# DOR_ENABLED=true.
#
# Targeting without a runner-admin token: run one job per sidekick, each pinned to its stable label
# (sk5 / sk6); each self-checks whether IT holds this PR's reservation and only the holder acts. The
# rest no-op. (The HARD reservation — pulling the runner from the pool while reserved — is slice C.)

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: dor-reset-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reset:
    if: >-
      vars.DOR_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        sk: [sk5, sk6, sk3]
    runs-on:
      - self-hosted
      - ${{ matrix.sk }}
    permissions:
      pull-requests: write
    steps:
      - name: Reset this sidekick if it holds PR #${{ github.event.pull_request.number }}
        id: reset
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          lock="$HOME/.dor-reservation"
          if [ ! -f "$lock" ] || [ "$(cat "$lock")" != "$PR" ]; then
            echo "::notice::$(hostname) is not holding PR #$PR — nothing to reset."
            echo "did=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$(hostname) holds PR #$PR — resetting."
          dir="$HOME/stacks/pr-$PR"
          if [ -d "$dir" ]; then
            ( cd "$dir" && { docker compose -f docker-compose.yml -f dor-tls.override.yml down -v 2>/dev/null \
                              || docker compose down -v 2>/dev/null || true; } )
          fi
          rm -rf "$dir"
          docker image prune -f >/dev/null 2>&1 || true
          rm -f "$lock"
          # Bring the empty edge placeholder back so the N.build URL serves something between builds.
          if [ -d "$HOME/stacks/edge" ]; then
            ( cd "$HOME/stacks/edge" && docker compose -f docker-compose.prod.yml up -d 2>/dev/null || true )
          fi
          echo "did=true" >> "$GITHUB_OUTPUT"
          echo "host=$(hostname)" >> "$GITHUB_OUTPUT"
          echo "::notice::$(hostname) reset and released back to the pool."

      - name: Comment on the PR that its sidekick was released
        if: steps.reset.outputs.did == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HOST: ${{ steps.reset.outputs.host }}
        run: |
          set -euo pipefail
          verb="closed"; [ "${{ github.event.pull_request.merged }}" = "true" ] && verb="merged"
          body="♻️ PR ${verb}. Reset **${HOST}** (stack down, volumes + images pruned) and released it back to the \`dor-build\` pool."
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${PR}/comments" \
            -d "$(printf '{"body":"%s"}' "$body")" -o /dev/null -w 'comment posted: HTTP %{http_code}\n'
