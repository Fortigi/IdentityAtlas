# ─── Node-version consistency gate ───────────────────────────────────────────
# .nvmrc is the single source of truth for the Node major version. This gate
# fails if any `node-version:` in a workflow, `FROM node:<v>` in a Dockerfile, or
# `engines.node` in a package.json declares a different major — so nothing can
# silently revert to an older Node (e.g. 22). See tools/node-version/ratchet.py.
# ─────────────────────────────────────────────────────────────────────────────
name: Node-version gate

on:
  pull_request:
    branches: [main]
    # Only the files that can carry a Node version affect this gate.
    paths:
      - '.nvmrc'
      - '.github/workflows/**'
      - '**/Dockerfile'
      - '**/package.json'
      - 'tools/node-version/**'
  workflow_dispatch:

concurrency:
  group: node-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Node-version gate
    runs-on: ubuntu-latest   # git + python3 are preinstalled on the GitHub runner
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Validate the gate logic (Python) before it gates anything.
      - name: Test the gate logic
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/node-version/test_ratchet.py -q

      - name: Run node-version gate
        run: python3 tools/node-version/ratchet.py
