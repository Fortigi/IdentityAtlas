# ─── Docker Image Publishing ─────────────────────────────────────────────────
# Builds container images, runs a basic smoke test, then pushes to GitHub
# Container Registry. A broken image never reaches :latest or :edge.
#
# Flow:  Build (local) → Start stack → Smoke test → Push
#
# Images published (only after smoke test passes):
#   ghcr.io/fortigi/identity-atlas         — Node.js API + React frontend (web service)
#   ghcr.io/fortigi/identity-atlas-worker  — PowerShell worker (crawlers, risk scoring)
#
# Tags pushed depend on the trigger:
#   main (via bump-version):  :edge  + Major.Minor.yyyyMMdd.HHmm
#   v5.2.0 tag push:          :latest + Major.Minor.Patch.0
#   v5.2.0-beta.1 tag push:   :beta   + Major.Minor.Patch-beta.N  (never touches :latest)
# ─────────────────────────────────────────────────────────────────────────────

name: Publish Docker Images

on:
  workflow_run:
    workflows: ["Bump version on PR merge"]
    types: [completed]
    # No branches filter: the filter matches the feature branch that triggered
    # bump-version (via pull_request), not main — so it would never fire.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build from (e.g. main, v5.2.0)'
        required: true
        default: 'main'

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build, Test & Push Images
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Determine ref and channel
        id: config
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.ref }}"
          elif [ "$EVENT" = "push" ]; then
            # Tag push: github.ref_name = v5.2.0
            REF="${{ github.ref_name }}"
          else
            # workflow_run from bump-version: always build main (bump-version
            # only runs on PR merge to main, so the result always lands on main)
            REF="main"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Stable release tag: v5.2.0 → version 5.2.0.0
            VERSION="${REF#v}.0"
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "use_tag_version=true" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc|alpha) ]]; then
            # Pre-release tag: v5.2.0-beta.1 → version 5.2.0-beta.1 (no .0 suffix)
            VERSION="${REF#v}"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "use_tag_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=main" >> "$GITHUB_OUTPUT"
            echo "use_tag_version=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.config.outputs.ref }}

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [ "${{ steps.config.outputs.use_tag_version }}" = "true" ]; then
            echo "version=${{ steps.config.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "Version from tag: ${{ steps.config.outputs.version }}"
          else
            version=$(grep -oP "ModuleVersion\s*=\s*'\K[^']+" setup/IdentityAtlas.psd1)
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Version from psd1: $version"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          # Pin a current BuildKit so the type=gha cache uses the GitHub Actions
          # Cache Service v2. The legacy v1 service was retired, which is what
          # broke cache export with "failed to reserve cache".
          driver-opts: image=moby/buildkit:buildx-stable-1

      # ── Build images locally (don't push yet) ───────────────────────
      - name: Build web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./app/api/Dockerfile
          push: false
          load: true
          tags: identity-atlas-web:qa
          build-args: MODULE_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=min,scope=web,ignore-error=true

      - name: Build worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./setup/docker/Dockerfile.powershell
          push: false
          load: true
          tags: identity-atlas-worker:qa
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=min,scope=worker,ignore-error=true

      # ── Smoke test: start the stack and verify it boots ─────────────
      - name: Start stack
        run: |
          cat > docker-compose.qa.yml <<'EOF'
          services:
            postgres:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: identity_atlas
                POSTGRES_USER: identity_atlas
                POSTGRES_PASSWORD: qa_test
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U identity_atlas"]
                interval: 5s
                timeout: 3s
                retries: 20
            web:
              image: identity-atlas-web:qa
              environment:
                NODE_ENV: production
                USE_SQL: "true"
                DATABASE_URL: "postgres://identity_atlas:qa_test@postgres:5432/identity_atlas"
                AUTH_ENABLED: "false"
                PORT: "3001"
              ports: ["3001:3001"]
              depends_on:
                postgres: { condition: service_healthy }
          EOF
          docker compose -f docker-compose.qa.yml up -d

      - name: Wait for API ready
        run: |
          # #691 opens the port BEFORE running DB migrations (so Azure's startup
          # probe can't kill a slow migration mid-flight), so a 200 on a liveness
          # endpoint no longer means the schema exists. Wait for the real
          # readiness signal — /api/health → schemaReady:true, which flips once
          # migrateDatabase() completes — before smoke-testing; otherwise the
          # matview-backed read endpoints race the background migration and 500.
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3001/api/health 2>/dev/null | grep -q '"schemaReady":true'; then
              echo "✅ schema ready after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::schema did not become ready within 180s"
          docker compose -f docker-compose.qa.yml logs web
          exit 1

      - name: Smoke test endpoints
        run: |
          FAILED=0
          for ep in /api/version /api/admin/status /api/systems /api/users?limit=1 /api/resources?limit=1 /api/permissions?userLimit=1 /api/openapi.json; do
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost:3001${ep}" || echo "000")
            if [ "$CODE" = "200" ]; then echo "✅ $ep"; else echo "❌ $ep → $CODE"; FAILED=$((FAILED+1)); fi
          done
          if [ $FAILED -gt 0 ]; then echo "::error::$FAILED endpoint(s) failed"; exit 1; fi

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.qa.yml down -v 2>/dev/null || true

      # ── Push images (only reached if smoke test passed) ─────────────
      # Push the EXACT images that were built, loaded and smoke-tested above by
      # retagging the local :qa images — NOT by rebuilding. A rebuild (even a
      # cached one) can diverge from the tested bits on a cache miss, a
      # best-effort cache-export failure, or base-image drift between the two
      # builds, so "published" would no longer equal "tested".
      #
      # Safe because the build steps above use buildx `load: true`, which only
      # works for a single-platform image (this workflow sets no `platforms:`), so
      # the loaded :qa image IS the artifact. `Tear down` runs `compose down -v`
      # (containers/volumes only), so the images survive. If this workflow ever
      # goes multi-arch, `load` can't hold a manifest list — switch to a
      # build-once, smoke-test-by-digest, push-by-digest flow instead.
      - name: Resolve channel's floating tag
        id: tags
        run: |
          case "${{ steps.config.outputs.channel }}" in
            release) FLOAT=latest ;;
            beta)    FLOAT=beta   ;;
            *)       FLOAT=edge   ;;
          esac
          echo "float=$FLOAT" >> "$GITHUB_OUTPUT"

      - name: Push web image (tested artifact)
        run: |
          FLOAT="${{ steps.tags.outputs.float }}"
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ env.REGISTRY }}/fortigi/identity-atlas"
          docker tag identity-atlas-web:qa "$REPO:$FLOAT"
          docker tag identity-atlas-web:qa "$REPO:$VERSION"
          docker push "$REPO:$FLOAT"
          docker push "$REPO:$VERSION"

      - name: Push worker image (tested artifact)
        run: |
          FLOAT="${{ steps.tags.outputs.float }}"
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ env.REGISTRY }}/fortigi/identity-atlas-worker"
          docker tag identity-atlas-worker:qa "$REPO:$FLOAT"
          docker tag identity-atlas-worker:qa "$REPO:$VERSION"
          docker push "$REPO:$FLOAT"
          docker push "$REPO:$VERSION"
