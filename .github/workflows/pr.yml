# ─── Pull Request Pipeline ────────────────────────────────────────────────────
# Fast checks that run on every PR. No Docker, no Azure credentials needed.
#
# Scope-aware pipeline (see docs/architecture/ci-scope-testing.md):
#   changes  — detects whether this push added non-housekeeping commits.
#              Skips everything when only chore: bump version / Merge branch
#              commits were pushed (e.g. "Update branch" housekeeping).
#   filter   — uses dorny/paths-filter to scope jobs to what actually changed.
#              Falls back to running all jobs if the filter step itself errors.
#   ci-passed — single gate job required by branch protection. Passes when
#               every job either succeeded or was legitimately skipped.
#
# Jobs:
#   1. lint-ps    — PSScriptAnalyzer on all PowerShell files
#   2. lint-js    — ESLint on the frontend (app/ui)
#   3. unit-tests — Pester tests in 4 parallel shards, merged code coverage
#   4. unit-js    — Vitest tests for the API (validation, middleware, docs structure,
#                   core ontology check)
#   5. unit-ui    — Vitest tests for the UI
#   6. node-launcher-ui-build — crawler wizard bundle check
#   7. static-gates — six small checks as steps of one job: file-length ratchet,
#                   migration immutability, Node-version consistency, OpenAPI lint,
#                   crawler-manifest completeness, compiled Azure templates
#   8. audit      — npm audit on frontend and API packages
#   9. hygiene    — tests + changelog fragment required for code changes
#  10. duplication — jscpd clone detection; threshold in .jscpd.json
#  11. complexity — cyclomatic + cognitive complexity ratchet (from complexity.yml)
#  12. ci-scripts — self-tests for the path gates and the DoR scripts
#  13. docs-build — MkDocs --strict, so a PR can't break the nav or a cross-link
#  14. security-authz — authorization regression across REST and MCP (real PostgreSQL)
#  15. diff-coverage — changed-line coverage from the lcov the suites above produced.
#                      ADVISORY: the one job NOT aggregated into ci-passed (see the job).
#
# All of the others feed ci-passed, so none needs to be an individual required
# check — mark only ci-passed required, and it self-skips per the filter scopes.
#
# A gate belongs HERE, not in its own workflow. A workflow that filters on
# `paths:` can never be a required check: GitHub leaves a required check that
# never reports permanently pending, so it would block every PR that misses
# those paths. This file has no top-level `paths:` — it always triggers and
# gates its JOBS instead, which is what lets one required check stand for all
# of them. test/ci-scripts/test-gate-wiring.sh enforces that every job here is
# aggregated, and that no other workflow quietly gates a PR from outside.
#
# Target branches: PRs into main
# ─────────────────────────────────────────────────────────────────────────────

name: PR Checks

# `feature/**` and `bugfixes/**` are here because CLAUDE.md calls stacked PRs the
# preferred workflow, and a filter of just [main, release/**] silently gives a
# stacked PR NO checks at all — not a failure, not a pending gate, simply "no
# checks" on the page, which reads as nothing to see.
#
# That is not hypothetical. PR #1268 was based on a feature branch, showed no
# checks, was reviewed and merged, and carried three defects that nothing could
# have caught: two PowerShell files registered for neither mutation testing nor
# exclusion, a T-SQL guard violation, and an endpoint missing from the OpenAPI
# spec. All three surfaced the moment its base branch targeted main.
#
# The cost is that a stack of N PRs now runs the suite N times. That is the
# correct trade: a review is worth what its evidence is worth, and a green tick
# nobody produced is worse than a red one.
on:
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
      - 'bugfixes/**'

# Cancel superseded runs when a PR branch is pushed again, so a stale run can't
# race the latest commit (or waste runners) (audit finding F4).
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN (SEC-2026-09 L-19). Every job reads the repository; the one that
# needs more asks for it itself. Today that is only the path filter, which lists the PR's changed
# files through the API. Artifacts and the Actions cache use the runner's own token, not this one.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  POWERSHELL_TELEMETRY_OPTOUT: 1

jobs:
  # ── Commit-range skip ────────────────────────────────────────────────────
  # Detects whether this push added non-housekeeping commits. If every new
  # commit is "chore: bump version" or "Merge branch 'main'", CI skips.
  # This fixes the "Update branch" re-run problem: after merging main, the
  # PR diff still shows product files but no new product commits were added.
  changes:
    name: 'Detect: product changes in this push'
    runs-on: ubuntu-latest
    outputs:
      has_product_changes: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: check
        run: |
          # First push to a new branch: before is all-zeros. Always run CI.
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # After a rebase or force-push, event.before may no longer be in
          # the rewritten history. Treat this as a real change (safe default).
          if ! git merge-base --is-ancestor "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null; then
            echo "result=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Count commits added by this push that are not housekeeping.
          # Use wc -l (always exits 0) instead of grep -cvE (exits 1 on empty
          # input, causing || echo 0 to fire and produce "0\n0").
          NON_HOUSEKEEPING=$(
            git log "${{ github.event.before }}..${{ github.sha }}" --format="%s" \
              | grep -v '^$' \
              | grep -vE "^chore: bump version to [0-9]|^Merge (remote-tracking )?branch '" \
              | wc -l \
              | tr -d ' '
          )
          if [ "$NON_HOUSEKEEPING" -gt 0 ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "Found $NON_HOUSEKEEPING non-housekeeping commit(s) — running CI." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            printf "CI skipped — no product code changes in this push.\n\nOnly housekeeping commits detected (chore: bump version / Merge branch 'main').\nIf this is wrong, push a real commit or add the \`integration-test\` label.\n" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Path-scope filter ────────────────────────────────────────────────────
  # Scopes jobs to what actually changed. The fallback-to-run-all (outcome ==
  # 'failure') ensures a dorny/paths-filter outage doesn't silently skip jobs
  # and produce a false green.
  filter:
    name: 'Detect: changed path scopes'
    needs: [changes]
    if: needs.changes.outputs.has_product_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # dorny/paths-filter reads the PR's changed-file list via the API
    outputs:
      ps:      ${{ steps.f.outputs.ps }}
      pester:  ${{ steps.f.outputs.pester }}
      api:     ${{ steps.f.outputs.api }}
      ui:      ${{ steps.f.outputs.ui }}
      openapi: ${{ steps.f.outputs.openapi }}
      docs:    ${{ steps.f.outputs.docs }}
      code:    ${{ steps.f.outputs.code }}
      migrations:   ${{ steps.f.outputs.migrations }}
      node_version: ${{ steps.f.outputs.node_version }}
      azure:        ${{ steps.f.outputs.azure }}
      outcome: ${{ steps.f.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: f
        with:
          filters: |
            ps:
              - 'tools/crawlers/**/*.ps1'
              - 'tools/powershell-sdk/**'
              - 'tools/riskscoring/**'
              - 'tools/csv-templates/transforms/**'
              - 'tools/psscriptanalyzer/**'
              - '.ci/psscriptanalyzer-baseline.json'
              - 'setup/**/*.ps1'
              - 'setup/IdentityAtlas.psm1'
            pester:
              - 'tools/powershell-sdk/**'
              - 'tools/crawlers/shared/**'
              - 'setup/docker/Invoke-CrawlerJob.ps1'
              - 'setup/docker/Invoke-CrawlerJobProcess.ps1'
              - 'setup/docker/Build-FGContexts.ps1'
              - 'app/desktop/node-launcher/**'
              - 'setup/IdentityAtlas.psm1'
              - 'test/unit/**'
              - 'azure/**'
              - 'tools/release/**'
              - 'tools/psscriptanalyzer/**'
              - 'tools/pester/**'
              # Self-referencing, as coverage.yml does: editing the scope config or this job's
              # own definition must run the job it configures, not silently skip it (#1088).
              - '.ci/psmutant.config.json'
              - '.ci/psmutant-scope-baseline.json'
              - '.github/workflows/pr.yml'
            api:
              - 'app/api/src/**'
              - 'app/api/contract-tests/**'
              - 'app/api/test-utils/**'
              - 'app/api/package.json'
              # The lockfile is what actually gets installed: package.json declares ranges,
              # and a transitive bump — the commonest kind, and the likeliest to surprise —
              # moves only this file. Omitting it meant every lockfile-only PR (every npm
              # Dependabot PR, every `npm audit fix`) skipped the suites that run against
              # the tree it installs. See #997.
              - 'app/api/package-lock.json'
              - 'app/api/vitest.config.js'
              - 'app/api/vitest.contract.config.js'
              - 'app/api/eslint.config.js'
              # The coverage ratchets' own tests (test_ratchet.py,
              # test_aggregate_floors.py) run in this job's per-file ratchet step.
              - 'tools/coverage/**'
              # The desktop job worker's tests run in the API Vitest suite.
              - 'app/desktop/*.cjs'
              - 'app/desktop/*.test.js'
              # So do the scale test fixture generator's.
              - 'tools/scale-dataset/**'
              # The core ontology is checked by the API suite (unit check + contract test).
              - 'ontology/**'
            ui:
              - 'app/ui/src/**'
              - 'app/ui/package.json'
              - 'app/ui/package-lock.json'   # see the api scope above (#997)
              - 'app/ui/vite.config.js'
              - 'app/ui/eslint.config.js'
              - 'app/ui/eslint-rules/**'
              - 'tools/crawlers/**/*.jsx'
              - 'tools/crawlers/**/*.test.js'
              - 'tools/crawlers/**/*.test.jsx'
            openapi:
              - 'app/api/src/openapi.yaml'
            # The docs site: pages, the hand-curated nav, and the guard itself.
            # A docs-only PR matches no other scope, so without this the
            # structure guard would never run on exactly the PRs that can break
            # the nav or a cross-link.
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'app/api/src/docs/**'
              # docs/concepts/ontology.md quotes ontology/*.ttl verbatim.
              - 'ontology/**'
            # Any source file the file-length / complexity ratchets measure, keyed
            # by extension. A docs-only / version-bump / baseline PR matches none
            # of these, so `code` is false and both ratchets skip (they re-measure
            # the whole tree, so there's nothing new to check).
            code:
              - '**/*.ps1'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.sql'
              - '**/*.py'
            # The migration files, their committed hash baseline, and the gate itself.
            migrations:
              - 'app/api/src/db/migrations/**'
              - '.ci/migration-hashes.json'
              - 'tools/migrations/**'
            # The Azure templates: the Bicep sources and the compiled ARM the
            # Deploy to Azure button and the release package deploy.
            azure:
              - 'azure/**'
              - '.github/workflows/pr.yml'
            # Only the files that can carry a Node version affect that gate.
            node_version:
              - '.nvmrc'
              - '.github/workflows/**'
              - '**/Dockerfile'
              - '**/package.json'
              - 'tools/node-version/**'

  # ── Stage 1: PowerShell linting ──────────────────────────────────────────
  lint-ps:
    name: 'Lint: PSScriptAnalyzer'
    needs: [filter]
    if: |
      needs.filter.outputs.ps == 'true' ||
      needs.filter.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      # What is scanned, which rules are off and why, and the baseline ratchet all
      # live in tools/psscriptanalyzer/ (unit-tested by
      # test/unit/PSAnalyzerRatchet.Tests.ps1). The two dead-code rules,
      # PSUseDeclaredVarsMoreThanAssignments and PSReviewUnusedParameter, are on:
      # their existing hits sit in .ci/psscriptanalyzer-baseline.json, which only
      # shrinks, and any new one fails here (review item A14).
      - name: Analyse PowerShell files
        shell: pwsh
        run: pwsh tools/psscriptanalyzer/Invoke-PSAnalyzerGate.ps1

  # ── Stage 2: JavaScript linting ──────────────────────────────────────────
  lint-js:
    name: 'Lint: ESLint'
    needs: [filter]
    # This job lints BOTH app/ui and app/api — and the API config carries the
    # eslint-plugin-security rules — so an API-only PR must still trigger it
    # (audit finding F7: previously gated on `ui` alone, so API-only PRs skipped
    # the security linter).
    if: |
      needs.filter.outputs.ui == 'true' ||
      needs.filter.outputs.api == 'true' ||
      needs.filter.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: app/ui
        run: npm ci

      - name: Run ESLint (UI)
        working-directory: app/ui
        run: npm run lint

      - name: Install API dependencies
        working-directory: app/api
        run: npm ci

      - name: Run ESLint (API — security rules)
        working-directory: app/api
        run: npm run lint

  # ── Stage 3: Pester unit tests ───────────────────────────────────────────
  # Sharded over 4 runners: the single job was the slowest in PR Checks (~94s of
  # tests behind ~20s of coverage set-up/processing), dominated by a few heavy
  # files. tools/pester/PesterShards.ps1 assigns files heaviest-first using
  # measured weights (.ci/pester-weights.json); every shard measures coverage
  # over the SAME product files, and `unit-tests` below merges them exactly (a
  # command is covered when any shard executed it) before applying the floor.
  # Changing the shard count: edit the matrix, SHARDS, and PESTER_SHARDS together.
  unit-tests-shard:
    name: 'Unit Tests: Pester (shard ${{ matrix.shard }}/4)'
    needs: [filter]
    if: |
      needs.filter.outputs.pester == 'true' ||
      needs.filter.result == 'failure'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester
        shell: pwsh
        run: |
          # ubuntu-latest ships Pester pre-loaded, so a plain Install-Module -Force
          # always warns that it can't overwrite the in-use version. Skip the install
          # when the runner already satisfies the minimum version.
          if (-not (Get-Module Pester -ListAvailable | Where-Object Version -ge '5.0.0')) {
            Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          }

      - name: Run Pester shard with coverage
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          . ./tools/pester/PesterShards.ps1
          $root = (Get-Location).Path
          $weights = (Get-Content .ci/pester-weights.json -Raw | ConvertFrom-Json -AsHashtable).weights
          $all = Get-ChildItem test/unit -Recurse -Filter '*.Tests.ps1' -File | ForEach-Object FullName
          $mine = @(Get-PesterShardFile -TestFile $all -Weight $weights -Count $env:SHARDS -Index $env:SHARD)
          if (-not $mine.Count) { throw "Shard $env:SHARD/$env:SHARDS was assigned no test files — lower the shard count." }
          Write-Host "Shard $env:SHARD/$env:SHARDS runs $($mine.Count) of $($all.Count) test files:"
          $mine | ForEach-Object { Write-Host "  $(Split-Path $_ -Leaf)" }

          $cfg = New-PesterConfiguration
          $cfg.Run.Path = $mine
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          # TestResult (JUnit/NUnit) export is deliberately OFF. Pester's XML writers don't sanitize
          # FailureMessage, so the ESC byte its own assertion diff embeds throws out of Invoke-Pester
          # and $result never gets assigned — the failure gate below then reads $null and passes, and
          # the job dies on the coverage floor at 0% instead. pester/Pester#2511 fixed this for
          # captured test output only; both formats and both 5.7.1/5.9.0 crash the same way. Nothing
          # consumed pester-results.xml, and Output.Verbosity already logs every test's outcome.
          $cfg.CodeCoverage.Enabled = $true
          # Every shard measures the same product files, so their coverage merges exactly.
          $cfg.CodeCoverage.Path = Get-PesterCoverageTarget -Root $root
          $cfg.CodeCoverage.OutputPath = 'pester-coverage.xml'
          $cfg.CodeCoverage.OutputFormat = 'JaCoCo'
          $result = Invoke-Pester -Configuration $cfg
          # Anything Invoke-Pester throws leaves $result unassigned, and every check below then reads
          # properties off $null and passes. Fail on the missing object before interpreting it.
          if (-not $result) {
            Write-Host '::error::Invoke-Pester returned no result object — it threw before returning (see the error above). The test outcome is UNKNOWN, not a pass.'
            exit 1
          }
          New-Item -ItemType Directory -Force pester-shard | Out-Null
          ConvertTo-PesterShardRecord -Result $result -Root $root |
            ConvertTo-Json -Depth 3 -Compress | Set-Content "pester-shard/shard-$env:SHARD.json"
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Upload shard coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pester-shard-${{ matrix.shard }}
          path: pester-shard/
          retention-days: 3

  # Merges the shards' coverage and applies the PowerShell floor. Keeps the old
  # job's id and check name, so the Pester result still reads as one check.
  unit-tests:
    name: 'Unit Tests: Pester'
    needs: [filter, unit-tests-shard]
    if: |
      always() && needs.unit-tests-shard.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      PESTER_SHARDS: 4
    steps:
      - name: Require every shard to pass
        if: needs.unit-tests-shard.result != 'success'
        run: |
          echo "::error::A Pester shard failed or was cancelled (result: ${{ needs.unit-tests-shard.result }}). See the 'Unit Tests: Pester (shard N/4)' jobs."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pester-shard-*
          path: pester-shard
          merge-multiple: true

      - name: Merge coverage and apply the floor
        shell: pwsh
        run: |
          . ./tools/pester/PesterShards.ps1
          $files = @(Get-ChildItem pester-shard -Filter 'shard-*.json' -File)
          if ($files.Count -ne [int]$env:PESTER_SHARDS) {
            Write-Host "::error::Expected $env:PESTER_SHARDS Pester shard records, found $($files.Count). Coverage would be incomplete."
            exit 1
          }
          $merged = Merge-PesterShardRecord -Record @($files | ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json })
          $pct = [Math]::Round($merged.Percent, 1)
          Write-Host "Tests: $($merged.Tests) over $($merged.Shards) shards, $($merged.Failed) failed."
          Write-Host "Coverage: $pct% ($($merged.Covered) / $($merged.Analyzed) commands)"
          "Pester: $($merged.Tests) tests over $($merged.Shards) shards, coverage **$pct%** ($($merged.Covered) / $($merged.Analyzed) commands)" >> $env:GITHUB_STEP_SUMMARY
          if ($merged.Failed -gt 0) { exit 1 }
          # PowerShell coverage floor — the "coverage never down" ratchet for the
          # PS side (the JS side already has committed vitest thresholds). RAISE
          # this when coverage rises; only ever lower it as a reviewed, justified
          # change. Measured 92.1% merged over the shards (Nov 2026); floor = measured minus ~1.
          $FLOOR = 91.0
          if ($pct -lt $FLOOR) {
            Write-Host "::error::Pester coverage $pct% is below the floor of $FLOOR%. Add tests for the PowerShell you changed, or lower the floor in pr.yml with justification."
            exit 1
          }

  # ── Stage 4: API unit tests (Vitest) ────────────────────────────────────
  unit-js:
    name: 'Unit Tests: Vitest (API)'
    needs: [filter]
    # Also runs on the `docs` scope: src/docs/ holds the documentation structure
    # guard (nav completeness, cross-links, learning-path contract, depth
    # anchors), and a docs-only PR matches no code scope. The docs site is only
    # built on push to main, so without this a broken nav or dead cross-link is
    # discovered after merge — which is how 15 pages fell out of the menu.
    # Deliberately folded into this job rather than given its own: a second job
    # would duplicate the checkout + setup-node + npm ci block (jscpd flagged
    # exactly that).
    if: |
      needs.filter.outputs.api == 'true' ||
      needs.filter.outputs.docs == 'true' ||
      needs.filter.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/api/package-lock.json

      - name: Install dependencies
        working-directory: app/api
        run: npm ci

      # ontology/core.ttl must agree with the ingest registries, the ownership /
      # visibility lists and the docs diagrams (docs/architecture/core-ontology.md).
      # Also asserted inside the suite (src/ontology/ontology.guard.test.js); this
      # step just names the failure. The real-database half is a contract test.
      - name: Core ontology check
        working-directory: app/api
        run: npm run ontology:check

      - name: Run Vitest (with coverage)
        id: tests
        working-directory: app/api
        run: npm run test:coverage

      # Named after the suite's CONTENT KEY (tools/coverage/suite-key.sh: a hash of every
      # input that can change this suite's coverage), and uploaded only when the suite
      # PASSED. After merge, coverage.yml computes the same key for main and publishes this
      # exact file instead of running the suite again (CI review B8).
      - name: Content key
        id: key
        if: always() && steps.tests.outcome == 'success'
        run: echo "key=$(bash tools/coverage/suite-key.sh api-unit)" >> "$GITHUB_OUTPUT"

      - name: Upload coverage (lcov)
        if: always() && steps.tests.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cov-api-unit-${{ steps.key.outputs.key }}
          path: app/api/coverage/lcov.info
          retention-days: 14

      - name: Per-file coverage ratchet (API)
        # Committed per-file line-coverage floor (.ci/coverage-baseline.json) so an
        # EXISTING file can't quietly shed coverage — the complement to the
        # diff-coverage gate (which only judges changed lines). See
        # tools/coverage/ratchet.py. Reads the deterministic unit lcov just produced.
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/coverage/test_ratchet.py tools/coverage/test_aggregate_floors.py -q
          python3 tools/coverage/ratchet.py --lcov app/api/coverage/lcov.info --prefix app/api/

  # ── Stage 4b: Contract tests (Vitest + testcontainers) ──────────────────
  # Runs *.contract.test.js files against a real PostgreSQL container spun up
  # by testcontainers. Kept separate from unit-js so normal `npm test` stays
  # fast and so this job can use a longer timeout (container start + 42
  # migrations takes ~30-60s).
  contract-tests:
    name: 'Contract Tests: Vitest + PostgreSQL'
    needs: [filter]
    if: |
      needs.filter.outputs.api == 'true' ||
      needs.filter.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/api/package-lock.json

      - name: Install dependencies
        working-directory: app/api
        run: npm ci

      # With coverage, so the diff-coverage job below can judge API changed lines on
      # unit + contract combined without running this suite a second time.
      - name: Run contract tests (with coverage)
        working-directory: app/api
        run: npm run test:contract -- --coverage

      # Named after the suite's CONTENT KEY (tools/coverage/suite-key.sh: a hash of every
      # input that can change this suite's coverage), and uploaded only when the suite
      # PASSED. After merge, coverage.yml computes the same key for main and publishes this
      # exact file instead of running the suite again (CI review B8).
      - name: Content key
        id: key
        run: echo "key=$(bash tools/coverage/suite-key.sh api-contract)" >> "$GITHUB_OUTPUT"

      - name: Upload contract coverage (lcov)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cov-api-contract-${{ steps.key.outputs.key }}
          path: app/api/coverage-contract/lcov.info
          retention-days: 14

  # ── Stage 4b+: Authorization security regression ────────────────────────
  # Who may see what, across REST and MCP — its own named check so a security
  # regression is unmistakable on the PR page (docs/architecture/mcp-authorization.md).
  # The unit half (scope rules, every MCP tool's owner policy, the sign-in gate)
  # and the PostgreSQL half (contract-tests/authzSecurity.integration.test.js:
  # eight personas, REST and MCP compared object by object, adversarial probes
  # with admin positive controls). No external LLM: every MCP tool is called
  # directly with fixed inputs. Some of these also run in unit-js / contract-tests;
  # the duplication is the price of a check that cannot be mistaken for another.
  security-authz:
    name: 'Security: authorization regression'
    needs: [filter]
    if: |
      needs.filter.outputs.api == 'true' ||
      needs.filter.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/api/package-lock.json

      - name: Install dependencies
        working-directory: app/api
        run: npm ci

      - name: Run the authorization security suite
        working-directory: app/api
        run: npm run test:security

  # ── Stage 4c: UI unit tests (Vitest) ────────────────────────────────────
  unit-ui:
    name: 'Unit Tests: Vitest (UI)'
    needs: [filter]
    if: |
      needs.filter.outputs.ui == 'true' ||
      needs.filter.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/ui/package-lock.json

      - name: Install dependencies
        working-directory: app/ui
        run: npm ci

      - name: Run Vitest (with coverage ratchet)
        id: tests
        working-directory: app/ui
        # Coverage-enabled so the committed thresholds floor in vite.config.js is
        # enforced — a change that drops UI coverage below the floor fails here.
        run: npm run test:coverage

      - name: Per-file coverage ratchet (UI)
        # Per-file line-coverage floor (.ci/coverage-baseline.json), same gate as
        # the API job — the aggregate vite.config.js floor above can't tell that one
        # file quietly regressed while another rose. See tools/coverage/ratchet.py.
        run: python3 tools/coverage/ratchet.py --lcov app/ui/coverage/lcov.info --prefix app/ui/

      # Named after the suite's CONTENT KEY (tools/coverage/suite-key.sh: a hash of every
      # input that can change this suite's coverage), and uploaded only when the suite
      # PASSED. After merge, coverage.yml computes the same key for main and publishes this
      # exact file instead of running the suite again (CI review B8).
      - name: Content key
        id: key
        if: always() && steps.tests.outcome == 'success'
        run: echo "key=$(bash tools/coverage/suite-key.sh ui)" >> "$GITHUB_OUTPUT"

      - name: Upload coverage (lcov)
        if: always() && steps.tests.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cov-ui-${{ steps.key.outputs.key }}
          path: app/ui/coverage/lcov.info
          retention-days: 14

  # ── Stage 4d: Diff coverage (ADVISORY) ──────────────────────────────────
  # The committed Vitest thresholds are GLOBAL — a new, barely-covered file hides
  # behind the whole-suite average. This judges only a PR's CHANGED lines (80%),
  # leaving legacy files alone. The API side combines UNIT and CONTRACT coverage,
  # because routes and SQL are often exercised only by the contract suite.
  #
  # It reuses the lcov the three suites above already produced, instead of running
  # them again — this used to be its own workflow (diff-coverage.yml) that re-ran
  # API unit, contract and UI unit on two more runners for every push.
  #
  # ADVISORY on purpose: deliberately NOT in ci-passed's `needs:` (excused by name in
  # test/ci-scripts/test-gate-wiring.sh). It cannot be made blocking while pure-JSX
  # page shells produce expected reds — v8 does not line-instrument a big JSX
  # `return`, so a routing or layout edit can fail on a line no test can reach
  # (#725). A red here is a question to answer, not a gate to pass.
  diff-coverage:
    name: 'Diff coverage (advisory)'
    needs: [unit-js, contract-tests, unit-ui]
    # Only judge suites that actually passed: a failing suite's lcov is partial, and
    # that failure is already reported by its own job.
    if: |
      always() &&
      ((needs.unit-js.result == 'success' && needs.contract-tests.result == 'success') ||
       needs.unit-ui.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAIL_UNDER: '80'   # fraction of a PR's changed, coverage-eligible lines that must be covered
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # diff-cover needs history back to the PR's merge-base

      - name: Install diff-cover
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 -m pip install --quiet diff_cover

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 'cov-*'   # cov-api-unit-<key>, cov-api-contract-<key>, cov-ui-<key>
          path: cov
          merge-multiple: false

      - name: 'Diff coverage: API (unit + contract)'
        if: needs.unit-js.result == 'success' && needs.contract-tests.result == 'success'
        run: |
          # lcov SF paths are package-relative (src/...); make them repo-relative
          # (app/api/src/...) so they align with git-diff paths.
          sed 's#^SF:#SF:app/api/#' cov/cov-api-unit-*/lcov.info > /tmp/api-unit.lcov
          sed 's#^SF:#SF:app/api/#' cov/cov-api-contract-*/lcov.info > /tmp/api-contract.lcov
          python3 -m diff_cover.diff_cover_tool /tmp/api-unit.lcov /tmp/api-contract.lcov \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under="${FAIL_UNDER}"

      - name: 'Diff coverage: UI'
        if: always() && needs.unit-ui.result == 'success'
        run: |
          sed 's#^SF:#SF:app/ui/#' cov/cov-ui-*/lcov.info > /tmp/ui.lcov
          # App.jsx is the top-level hash-router shell, exercised end-to-end by
          # e2e/navigation.spec.js rather than line-instrumented by v8. See #669.
          python3 -m diff_cover.diff_cover_tool /tmp/ui.lcov \
            --compare-branch="origin/${{ github.base_ref }}" \
            --exclude '*/App.jsx' \
            --fail-under="${FAIL_UNDER}"

  # ── Stage 4c: Node-launcher UI build (crawler wizard bundling) ──────────
  # The portable/desktop build (app/desktop/scripts/build-node-launcher.mjs)
  # builds the UI from a separate pipeline than Docker's. Crawler wizards
  # under tools/crawlers/ broke that build the moment the first wizard
  # (midpoint, #336) shipped — caught only by this check, not by unit-ui or
  # lint-js, because it depends on the *production build* step, not the
  # source files. It went unnoticed on main for hours because the script
  # otherwise only runs on a beta/release cut (cut-beta.yml etc.), not on
  # every PR. --ui-only runs just the UI build + its own crawler-wizard
  # bundle check, skipping the Windows-only esbuild/pglite/re2/node.exe/zip
  # steps so this has no pwsh dependency and stays fast.
  node-launcher-ui-build:
    name: 'Build: Node-launcher UI (crawler wizards)'
    needs: [filter]
    if: |
      needs.filter.outputs.ui == 'true' ||
      needs.filter.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'

      - name: Build UI via the node-launcher pipeline
        run: node app/desktop/scripts/build-node-launcher.mjs --ui-only

  # ── Stage 6: Dependency audit ────────────────────────────────────────────
  audit:
    name: 'Audit: npm audit'
    needs: [changes]
    if: needs.changes.outputs.has_product_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'

      - name: Audit frontend dependencies
        working-directory: app/ui
        run: npm audit --audit-level=high

      - name: Audit API dependencies
        working-directory: app/api
        run: npm audit --audit-level=high

  # ── Stage 6b: Supply-chain firewall (Socket Firewall Free) ───────────────
  # Installs both Node projects through Socket Firewall, which proxies the npm
  # registry and BLOCKS known-malicious packages — typosquats, install-script
  # malware, and hijacked/compromised maintainer releases — before they reach
  # the build. This covers the supply-chain class that `npm audit` and
  # Dependabot structurally miss: a freshly-published malicious version that
  # has no CVE/advisory yet, including a malicious version bump proposed by
  # Dependabot's own PRs. Complements (does not replace) the npm audit job.
  #
  # Note: setup-node's npm cache is intentionally NOT enabled here — the
  # firewall must see the actual registry downloads, not a cache replay. A
  # Dependabot bump changes the lockfile, so the relevant packages are fetched
  # fresh and inspected regardless.
  #
  # Powered by Socket Firewall Free — https://github.com/SocketDev/sfw-free
  supply-chain:
    name: 'Audit: Supply-chain firewall (Socket)'
    needs: [changes]
    if: needs.changes.outputs.has_product_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'

      - name: Enable Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install API dependencies through the firewall
        working-directory: app/api
        run: sfw npm ci

      - name: Install UI dependencies through the firewall
        working-directory: app/ui
        run: sfw npm ci

  # ── Stage 7: PR hygiene (tests + changelog required for code changes) ────
  # Blocks merging a code change that ships without tests or a changelog
  # fragment — the gap that let an undocumented, untested feature reach main.
  # Escape hatch: a maintainer can apply the 'skip-hygiene' label. The label does
  # NOT skip the job (a job-level skip left the bypass invisible and let ci-passed
  # treat it as green). Instead the job always runs on product changes and honours
  # the label internally — on a would-be failure it prints exactly what was waived
  # and passes, so every bypass is recorded and provable in the job log.
  hygiene:
    name: 'PR Hygiene'
    needs: [changes]
    if: needs.changes.outputs.has_product_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require tests + changelog fragment for code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_HYGIENE: ${{ contains(github.event.pull_request.labels.*.name, 'skip-hygiene') }}
        # The rules live in the script so test/ci-scripts/test-pr-hygiene.sh can
        # exercise them. Besides "a test changed", the test must be ABOUT the code
        # that changed (review item A13): touching any unrelated test no longer passes.
        run: git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | bash .github/scripts/pr_hygiene.sh

  # ── Stage 10: Code duplication threshold ─────────────────────────────────
  # Fails if overall duplication exceeds the threshold in .jscpd.json.
  # Threshold is 2% (above the 1.65% baseline after dedup phases 1-4). Lower it
  # progressively as further dedup refactor phases land in main.
  duplication:
    name: 'Lint: Code duplication (jscpd)'
    needs: [changes]
    if: needs.changes.outputs.has_product_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ONE head scan does both jobs — jscpd still writes its JSON report when it
      # exits 1 over the threshold — and the base scan runs IN PARALLEL from a git
      # worktree. This used to be three sequential full scans (head for the
      # threshold, head again and base for the delta), which made a lint check the
      # ~3-minute critical path of PR Checks.
      #
      # Aggregate gate: fail if total duplication exceeds the threshold in .jscpd.json.
      # PR-delta gate: catch a NEW clone this PR introduces even when the total stays
      # under the aggregate threshold (minTokens=50/minLines=10 means small pastes never
      # move the 2% average). Compares clone counts head-vs-base, and degrades to a
      # warning (the aggregate check still gates) if a report can't be produced or
      # parsed — so it can never make CI worse.
      - name: Check code duplication (aggregate threshold + new clones vs base)
        run: |
          set -uo pipefail
          npm install -g --silent jscpd@3   # once: two concurrent `npx` installs race on the npx cache
          clones() { node -e "try{console.log(require(process.argv[1]+'/jscpd-report.json').statistics.total.clones)}catch(e){console.log(-1)}" "$1"; }

          BASE_DIR="$RUNNER_TEMP/jscpd-base-tree"
          BASE_PID=""
          if git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" && git worktree add -q --detach "$BASE_DIR" FETCH_HEAD; then
            # The base is scanned with the BASE's own .jscpd.json, as before. --threshold 100:
            # only the count is wanted here, never a failure.
            ( cd "$BASE_DIR" && jscpd . --config .jscpd.json --threshold 100                 --reporters json --output "$RUNNER_TEMP/jscpd-base" >/dev/null 2>&1 ) &
            BASE_PID=$!
          fi

          jscpd . --config .jscpd.json --reporters console,json --output "$RUNNER_TEMP/jscpd-head"
          AGGREGATE_RC=$?
          HEAD_CLONES=$(clones "$RUNNER_TEMP/jscpd-head")

          BASE_CLONES=-1
          if [ -n "$BASE_PID" ]; then
            wait "$BASE_PID" || true
            BASE_CLONES=$(clones "$RUNNER_TEMP/jscpd-base")
          fi

          if [ "$AGGREGATE_RC" -ne 0 ]; then
            echo "::error::Total code duplication is above the threshold in .jscpd.json (see the report above)."
            exit 1
          fi
          echo "jscpd clones — base: ${BASE_CLONES}, head: ${HEAD_CLONES}"
          if [ "${HEAD_CLONES}" = "-1" ] || [ "${BASE_CLONES}" = "-1" ]; then
            echo "::warning::jscpd delta check couldn't produce or parse a report; relying on the aggregate threshold only."
            exit 0
          fi
          if [ "${HEAD_CLONES}" -gt "${BASE_CLONES}" ]; then
            echo "::error::This PR introduces $((HEAD_CLONES - BASE_CLONES)) new code clone(s) (base ${BASE_CLONES} -> head ${HEAD_CLONES}) below the aggregate threshold. Extract the shared code instead (Reuse before creating)."
            exit 1
          fi

  # ── Stage 14: Complexity ratchet (cyclomatic + cognitive) ────────────────
  # Per-unit complexity baselines that only ratchet down. Same `code` scope and
  # ci-passed membership as the file-length ratchet. See tools/complexity/ratchet.py.
  complexity:
    name: 'Complexity ratchet'
    needs: [filter]
    if: |
      needs.filter.outputs.code == 'true' ||
      needs.filter.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            app/api/package-lock.json
            app/ui/package-lock.json

      # ESLint (with the project's configs/plugins) is the JS/TS measurer, so the
      # workspaces it lints must have their dependencies installed.
      - name: Install JS dependencies
        run: |
          npm ci --prefix app/api
          npm ci --prefix app/ui

      # The PowerShell measurer is the published PSComplexity module.
      - name: Install PSComplexity (PowerShell complexity measurer)
        shell: pwsh
        run: Install-Module PSComplexity -RequiredVersion 0.5.1 -Force -Scope CurrentUser

      # Validate the ratchet gate logic (Python) before it gates anything.
      - name: Test the ratchet gate logic
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/complexity/test_ratchet.py -q

      - name: Run cyclomatic-complexity ratchet
        run: python3 tools/complexity/ratchet.py

      - name: Run cognitive-complexity ratchet
        run: python3 tools/complexity/ratchet.py --metric cognitive

  # ── Stage 12: CI-logic self-tests ─────────────────────────────────────────
  # The path-gate / crawler-scope / commit-range scripts in test/ci-scripts/
  # encode the expected behaviour of the path filters and skip logic in this
  # workflow and pr-integration.yml. Run them so a change that breaks those
  # assumptions is caught here instead of silently mis-scoping CI (audit F6).
  # Cheap (bash, seconds) — synthetic inputs, no real git diff needed.
  ci-scripts:
    name: 'CI: path-gate / scope self-tests'
    needs: [changes]
    if: needs.changes.outputs.has_product_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run CI path-gate / crawler-scope / commit-range self-tests
        run: |
          bash test/ci-scripts/test-path-gates.sh
          bash test/ci-scripts/test-assert-test-secrets.sh
          bash test/ci-scripts/test-crawler-scope.sh
          bash test/ci-scripts/test-commit-range.sh
          bash test/ci-scripts/test-dor-gate-notice.sh
          bash test/ci-scripts/test-dor-reconcile-liveness.sh
          bash test/ci-scripts/test-dor-reconcile-selfheal.sh
          bash test/ci-scripts/test-dor-push-lease.sh
          bash test/ci-scripts/test-dor-finalize-merged-pr.sh
          bash test/ci-scripts/test-dor-sidekick-claim.sh
          bash test/ci-scripts/test-dor-sparse-workspace.sh
          bash test/ci-scripts/test-dor-run-touched-tests.sh
          bash test/ci-scripts/test-dor-drop-workflow-labels.sh
          bash test/ci-scripts/test-dor-trusted-spec.sh
          bash test/ci-scripts/test-dor-agent-sandbox.sh
          bash test/ci-scripts/test-dor-token-checkpoint.sh
          bash test/ci-scripts/test-release-prev-tag.sh
          bash test/ci-scripts/test-pr-hygiene.sh
          bash test/ci-scripts/test-mutation-scripts.sh
          bash test/ci-scripts/test-recent-changes.sh
          bash test/ci-scripts/test-gate-wiring.sh
          bash test/ci-scripts/test-coverage-reuse.sh

      # The two Python tools that render and feed the Test Coverage docs page.
      # Both are run only by post-merge workflows (coverage.yml, js-mutation.yml),
      # so without this step a PR could break the page and nothing would say so
      # until it had already landed on main — which is how these tests came to
      # exist and never run. The ratchet gates test their own logic in their own
      # jobs; these have no gate job to live in, so they live here.
      - name: Test the coverage-docs tooling
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/test_generate_coverage_doc.py \
                            tools/mutation/test_stryker_to_mutation_json.py -q

      # Runs only from cut-release.yml / cut-hotfix.yml, so nothing else would
      # exercise it until a release was already being cut — and a release is a
      # bad place to discover that the notes generator throws.
      - name: Test the release-notes dependency delta
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/release-notes/test_dependency_delta.py -q

  # ── Stage 15: Docs site build (strict) ────────────────────────────────────
  # `docs.yml` publishes the site, but it only runs on push to main — so until
  # now a PR could break the nav, an internal cross-link or a link to a source
  # file and nobody found out until it was already merged and deployed.
  #
  # --strict promotes MkDocs' warnings to errors. That covers a nav entry
  # pointing at a file that does not exist, and any relative link that resolves
  # to nothing inside the docs tree — including `../../app/...` links to repo
  # source, which cannot work in the published site (only docs/** is copied).
  # Link to source with an absolute https://github.com/Fortigi/IdentityAtlas/blob/main/…
  # URL instead; that is already the convention in ~70 places.
  #
  # Same `docs` scope the filter already defines for exactly this purpose.
  docs-build:
    name: 'Docs: MkDocs build (strict)'
    needs: [filter]
    if: |
      needs.filter.outputs.docs == 'true' ||
      needs.filter.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      # The same pinned toolchain docs.yml deploys with, so a PR cannot pass here
      # and then fail on main.
      - name: Install the docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Build the site with warnings as errors
        run: mkdocs build --strict --site-dir /tmp/docs-site

  # ── Static gates: six small checks in one job ───────────────────────────
  # File-length ratchet, migration immutability, Node-version consistency, OpenAPI
  # lint, crawler-manifest completeness and the compiled Azure templates. Each does
  # 5-20 s of work; as six separate jobs each also paid a 15-20 s runner start +
  # checkout and held its own runner slot — six slots per push for about a minute
  # of work, which is what queued every job for 14 minutes on a Dependabot burst.
  #
  # Each check is still scoped by its own path filter (step `if:`), still runs even
  # when an earlier one fails (`continue-on-error`), and the Verdict step fails the
  # job if ANY of them failed, with a per-check table in the job summary. When the
  # path filter itself errors (`needs.filter.result != 'success'`) every check runs.
  # test/ci-scripts/test-gate-wiring.sh asserts every check step feeds the Verdict.
  static-gates:
    name: 'Lint: static gates'
    needs: [changes, filter]
    if: ${{ !cancelled() && needs.changes.outputs.has_product_changes == 'true' }}
    runs-on: ubuntu-latest   # git, python3, node, az and jq are preinstalled on the runner
    env:
      ALL: ${{ needs.filter.result != 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pytest
        run: python3 -m pip install --quiet pytest

      # ── File-length ratchet (scope: code) ──────────────────────────────────
      - name: 'File-length ratchet'
        id: filesize
        if: always() && (env.ALL == 'true' || needs.filter.outputs.code == 'true')
        continue-on-error: true
        run: |
          # Validate the ratchet gate logic before it gates anything.
          python3 -m pytest tools/filesize/test_ratchet.py -q
          # The report generator image runs this supervisor as its main process: it
          # loads the model on demand and unloads it when idle. Standard library only.
          python3 -m pytest setup/docker/report-generator/test_supervisor.py -q
          python3 tools/filesize/ratchet.py

      # ── Migration immutability (scope: migrations) ─────────────────────────
      - name: 'Migration immutability gate'
        id: migrations
        if: always() && (env.ALL == 'true' || needs.filter.outputs.migrations == 'true')
        continue-on-error: true
        run: |
          python3 -m pytest tools/migrations/test_ratchet.py -q
          python3 tools/migrations/ratchet.py

      # ── Node-version consistency (scope: node_version) ─────────────────────
      # .nvmrc is the single source of truth for the Node major. Fails if any
      # `node-version:` in a workflow, `FROM node:<v>` in a Dockerfile, or
      # `engines.node` in a package.json declares a different major.
      - name: 'Node-version gate'
        id: node_version
        if: always() && (env.ALL == 'true' || needs.filter.outputs.node_version == 'true')
        continue-on-error: true
        run: |
          python3 -m pytest tools/node-version/test_ratchet.py -q
          python3 tools/node-version/ratchet.py

      # ── OpenAPI lint (scope: openapi) ───────────────────────────────────────
      - name: Setup Node.js (for Spectral)
        if: always() && (env.ALL == 'true' || needs.filter.outputs.openapi == 'true')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'

      - name: 'Lint: OpenAPI spec'
        id: openapi
        if: always() && (env.ALL == 'true' || needs.filter.outputs.openapi == 'true')
        continue-on-error: true
        run: |
          npm install -g @stoplight/spectral-cli
          spectral lint app/api/src/openapi.yaml

      # ── Crawler manifest completeness (every product-change push) ──────────
      - name: 'Lint: Crawler manifest completeness'
        id: crawler_manifest
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail

          # Library crawlers (dependsOn only) — never need CrawlerMeta.js.
          LIBRARY_CRAWLERS="odata"

          FAIL=0

          for manifest in tools/crawlers/*/crawler.json; do
            dir=$(dirname "$manifest")
            type=$(node -e "process.stdout.write(require('./$manifest').type ?? '')")
            [ -z "$type" ] && continue

            # Skip library crawlers entirely.
            if echo "$LIBRARY_CRAWLERS" | grep -qw "$type"; then continue; fi

            # Check CrawlerMeta.js exists.
            meta="$dir/CrawlerMeta.js"
            if [ ! -f "$meta" ]; then
              echo "::error file=$manifest::Crawler '$type' is missing CrawlerMeta.js — add one to $dir/"
              FAIL=1
            fi

            # Crawler-specific files and hardcoded type strings must not appear
            # anywhere under app/ui/ — everything belongs in tools/crawlers/<type>/.
            stray_files=$(find app/ui/src app/ui/e2e -iname "*${type}*" 2>/dev/null || true)
            if [ -n "$stray_files" ]; then
              echo "::error::Found file(s) named after crawler type '$type' outside tools/crawlers/$type/ — move them there:"
              echo "$stray_files"
              FAIL=1
            fi

            hits=$(grep -rlE "(['\"])${type}\1" app/ui/src app/ui/e2e 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "::error::Crawler type '$type' is hardcoded as a string outside tools/crawlers/$type/ — it must be discovered via CrawlerMeta.js only:"
              echo "$hits"
              FAIL=1
            fi

            # Same rule for the API core. Crawler-specific behaviour in the API
            # must be manifest-driven (capability flags read via
            # crawlerManifests.js), never a hardcoded type string. Exclusions:
            # app-bundle.mjs is a gitignored generated bundle (vendored deps
            # like mime-db legitimately contain type-like substrings), and test
            # files are excluded the same way the UI side excludes its own.
            api_files=$(find app/api/src -iname "*${type}*" ! -name 'app-bundle.mjs' ! -name '*.test.js' 2>/dev/null || true)
            if [ -n "$api_files" ]; then
              echo "::error::Found file(s) named after crawler type '$type' in app/api/src — move them to tools/crawlers/$type/:"
              echo "$api_files"
              FAIL=1
            fi

            api_hits=$(grep -rlE "(['\"])${type}\1" app/api/src --include='*.js' --include='*.mjs' --exclude='app-bundle.mjs' --exclude='*.test.js' 2>/dev/null || true)
            if [ -n "$api_hits" ]; then
              echo "::error::Crawler type '$type' is hardcoded as a string in app/api/src — core must discover behaviour via crawler.json manifest flags (see crawlerManifests.js), not type literals:"
              echo "$api_hits"
              FAIL=1
            fi
          done

          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "Crawler manifest check passed."

      # ── Compiled Azure templates match Bicep (scope: azure) ────────────────
      # The Deploy to Azure button and every release package deploy the COMPILED
      # azure/main.json and main-auth.json, not the .bicep files — so a .bicep change
      # without a rebuild ships nothing, and a hand edit to the .json ships something
      # no source describes. Rebuilt with the Bicep version that produced the
      # committed file (its metadata names it), so a newer compiler cannot turn this
      # red on its own. No Azure sign-in: building needs none.
      - name: 'Azure: compiled templates match Bicep'
        id: azure
        if: always() && (env.ALL == 'true' || needs.filter.outputs.azure == 'true')
        continue-on-error: true
        run: |
          set -euo pipefail
          stale=0
          for tpl in main main-auth; do
            json="azure/$tpl.json"
            version=$(jq -r '.metadata._generator.version' "$json" | cut -d. -f1-3)
            az bicep install --version "v$version" >/dev/null 2>&1
            az bicep build --file "azure/$tpl.bicep" --outfile "$RUNNER_TEMP/$tpl.json"
            if ! diff -q "$json" "$RUNNER_TEMP/$tpl.json" >/dev/null; then
              echo "::error file=$json::$json is not the build of azure/$tpl.bicep (Bicep $version). Run: az bicep build --file azure/$tpl.bicep --outfile $json"
              diff -u "$json" "$RUNNER_TEMP/$tpl.json" | head -n 40 || true
              stale=1
            else
              echo "$json matches azure/$tpl.bicep (Bicep $version)"
            fi
          done
          exit $stale

      # ── Verdict ─────────────────────────────────────────────────────────────
      # `continue-on-error` turns each step's CONCLUSION green, so read the
      # OUTCOMES. An out-of-scope step has outcome 'skipped'.
      - name: Verdict
        if: always()
        env:
          OUTCOMES: >-
            File-length=${{ steps.filesize.outcome }}
            Migration-immutability=${{ steps.migrations.outcome }}
            Node-version=${{ steps.node_version.outcome }}
            OpenAPI=${{ steps.openapi.outcome }}
            Crawler-manifest=${{ steps.crawler_manifest.outcome }}
            Azure-templates=${{ steps.azure.outcome }}
        run: |
          failed=""
          { echo "| Check | Outcome |"; echo "|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          for kv in $OUTCOMES; do
            name="${kv%%=*}"; outcome="${kv#*=}"
            echo "| $name | ${outcome:-skipped} |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" != "success" ] && [ "$outcome" != "skipped" ] && [ -n "$outcome" ]; then
              failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Static gate(s) failed:$failed — open that step's log above."
            exit 1
          fi
          echo "All in-scope static gates passed."

  # ── Gate: single required check for branch protection ───────────────────
  # Replaces the individual job requirements in branch protection. Update branch
  # protection to require only "ci-passed" — not each individual job name.
  #
  # Migration: add ci-passed as a NEW branch protection requirement alongside
  # the old ones, verify on 2-3 PRs, then remove the old individual requirements.
  # Never remove + add in the same step (creates a window where PRs can merge unprotected).
  #
  # Passing on a housekeeping push (all jobs skipped) is INTENTIONAL.
  ci-passed:
    name: 'CI Passed'
    needs:
      - changes
      - filter
      - lint-ps
      - lint-js
      - unit-tests-shard
      - unit-tests
      - unit-js
      - contract-tests
      - security-authz
      - unit-ui
      - node-launcher-ui-build
      - audit
      - supply-chain
      - hygiene
      - duplication
      - complexity
      - static-gates
      - ci-scripts
      - docs-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          FAILED=$(echo '${{ toJSON(needs) }}' \
            | jq -r 'to_entries | .[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$FAILED" ]; then
            echo "## CI Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The following jobs failed or were cancelled:" >> "$GITHUB_STEP_SUMMARY"
            echo "$FAILED" | while read -r job; do
              echo "- $job" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 1
          fi
          echo "All checks passed or were legitimately skipped." >> "$GITHUB_STEP_SUMMARY"

  # ── PR Summary stub ─────────────────────────────────────────────────────────
  # The Claude GitHub App (issue triage, autofix, release-notes synthesis) creates
  # a check suite named "PR Summary" on every PR push. It stays queued if its
  # auto-summary feature doesn't fire, showing as "expected" in the GitHub UI.
  # This stub job emits a completed "PR Summary" check run that overshadows the
  # pending app suite — same check name, workflow wins in the UI display.
  pr-summary:
    name: 'PR Summary'
    needs: [ci-passed]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR Summary check satisfied by CI gate."
