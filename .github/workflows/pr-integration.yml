# ─── PR Integration Tests ──────────────────────────────────────────────────────
# Full Docker-based integration test suite that runs on PRs targeting main.
# Builds the complete stack (postgres + web + worker), then exercises every
# nightly test scenario so main stays stable.
#
# Three parallel jobs. The durations below are measured across recent successful
# runs rather than estimated; the previous figures (20 / 15 / 50 min) overstated
# every job, which makes it hard to judge what re-running the suite costs.
#   1. integration  — core + secret-dependent tests (~5 min)
#   2. e2e          — Playwright browser tests (~5 min)
#   3. load-soak    — 1.5M-row load test (~7 min) + 15-min soak test (~22 min)
#
# Note: load-soak currently finishes in ~8 min, not ~22, because the soak test
# does not actually run. It takes a memory baseline from GET /admin/container-stats
# and skips — recording a PASS — when that is unavailable, which is always: #213
# removed the endpoint and the Docker socket mount it needed, because mounting
# docker.sock into the web container was a host-takeover primitive. So a step
# named "Soak test (15 min)" completes in 0 min and goes green. #721 tracks it.
#
# ~22 min is what this job should cost once the soak works again. Do NOT get
# there by restoring the endpoint or the socket mount — that re-opens the hole
# #213 closed. See #721 for the alternatives.
#
# Secret-dependent tests (Entra ID crawler, LLM risk scoring) skip gracefully
# when GitHub Actions secrets are not configured. Set them in repo Settings →
# Secrets and variables → Actions:
#
#   TEST_GRAPH_TENANT_ID      — Entra ID tenant for crawler tests
#   TEST_GRAPH_CLIENT_ID      — App registration client ID
#   TEST_GRAPH_CLIENT_SECRET  — App registration secret
#   TEST_LLM_API_KEY          — Anthropic/OpenAI/Azure OpenAI API key
#   TEST_LLM_PROVIDER         — "anthropic", "openai", or "azure-openai" (default: anthropic)
#   TEST_LLM_MODEL            — Model name (default: claude-haiku-4-5-20251001)
#   TEST_RISK_PROFILE_DOMAIN  — Public domain for profile generation test
#
# For Azure OpenAI, also set:
#   TEST_LLM_ENDPOINT         — Azure OpenAI endpoint URL
#   TEST_LLM_DEPLOYMENT       — Deployment name
#   TEST_LLM_API_VERSION      — API version (e.g. 2024-02-15-preview)
# ───────────────────────────────────────────────────────────────────────────────

name: PR Integration Tests

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    # NO top-level paths-ignore. The workflow must run on EVERY PR so its
    # `if: always()` gate job (Integration CI Passed) always posts a status —
    # a required status check whose job is skipped stays "pending" forever and
    # deadlocks the merge, so a paths-ignore here (which skips the whole workflow
    # for docs-only PRs) is incompatible with making the gate required.
    # The EXPENSIVE suites are still scoped: the `changes` (commit-range) and
    # `filter` (dorny path-scope) jobs gate integration / e2e / load-soak, so a
    # docs-only or PowerShell-only PR skips whichever aren't relevant. Skipped
    # jobs pass the gate (it only fails on `failure`/`cancelled`), so the gate
    # goes green without running them. See docs/architecture/ci-scope-testing.md.

# Cancel superseded runs when a PR branch is pushed again — these Docker/load
# suites are expensive, so don't let a stale run keep burning a runner (F4).
concurrency:
  group: pr-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  POWERSHELL_TELEMETRY_OPTOUT: 1

# ── Shared build steps (YAML anchor) ────────────────────────────────────────
# Each job builds its own Docker stack. GHA layer cache keeps rebuilds fast.

jobs:
  # ── Commit-range skip ───────────────────────────────────────────────────────
  # Same logic as pr.yml — skips the entire integration suite when this push
  # added only housekeeping commits (chore: bump version / Merge branch 'main').
  changes:
    name: 'Detect: product changes in this push'
    runs-on: ubuntu-latest
    outputs:
      has_product_changes: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git merge-base --is-ancestor "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null; then
            echo "result=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NON_HOUSEKEEPING=$(
            git log "${{ github.event.before }}..${{ github.sha }}" --format="%s" \
              | grep -v '^$' \
              | grep -vE "^chore: bump version to [0-9]|^Merge (remote-tracking )?branch '" \
              | wc -l \
              | tr -d ' '
          )
          if [ "$NON_HOUSEKEEPING" -gt 0 ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            printf "Integration CI skipped — no product code changes in this push.\n" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Path-scope filter ──────────────────────────────────────────────────────
  # Scopes integration, e2e, and load-soak via dorny/paths-filter (Phase 1).
  # Per-crawler scoping uses a separate git-diff step (Phase 2) so it stays
  # fully dynamic — adding a new crawler requires no YAML changes.
  filter:
    name: 'Detect: integration path scopes'
    needs: [changes]
    if: needs.changes.outputs.has_product_changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      integration:       ${{ steps.f.outputs.integration }}
      e2e:               ${{ steps.f.outputs.e2e }}
      load_soak:         ${{ steps.f.outputs.load_soak }}
      crawlers_to_test:  ${{ steps.scope.outputs.crawlers_to_test }}
      only_tests:        ${{ steps.scope.outputs.only_tests }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v3
        id: f
        with:
          filters: |
            integration:
              - 'app/api/src/**'
              - 'tools/crawlers/**/*.ps1'
              - 'tools/crawlers/**/*.js'
              - 'tools/crawlers/shared/**'
              - 'tools/powershell-sdk/**'
              - 'setup/docker/Invoke-CrawlerJob.ps1'
              - 'setup/IdentityAtlas.psm1'
              - 'app/api/Dockerfile'
              - 'setup/docker/Dockerfile.powershell'
              - 'docker-compose*.yml'
            e2e:
              - 'app/ui/src/**'
              - 'app/ui/e2e/**'
              - 'app/ui/scripts/**'
              - 'app/ui/playwright*.config.js'
              - 'tools/crawlers/**/*.jsx'
              - 'tools/crawlers/**/*.e2e.*'
              - 'app/api/src/**'
              - 'app/api/Dockerfile'
            load_soak:
              - 'app/api/src/**'
              - 'tools/crawlers/shared/**'
              - 'tools/powershell-sdk/**'
              - 'tools/crawlers/*/Start-*.ps1'
              - 'setup/docker/Invoke-CrawlerJob.ps1'
              - 'setup/docker/Dockerfile.powershell'
              - 'docker-compose*.yml'

      # Dynamically detect which crawler types changed from the git diff.
      # No hardcoded type list — new crawlers are picked up automatically.
      #
      # Logic:
      #   1. If shared infra changed (shared/, powershell-sdk/, Invoke-CrawlerJob,
      #      IdentityAtlas.psm1, Dockerfile.powershell) → full run (empty output).
      #   2. Otherwise extract type names from tools/crawlers/<type>/ paths in the
      #      diff. Empty list means integration was triggered by non-crawler paths
      #      (e.g. app/api/src/) → full run.
      #   3. Empty crawlers_to_test → PS runner asserts all crawlers (unchanged).
      - id: scope
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")

          # only_tests: true when EVERY changed file is a test file (JS/JSX unit
          # or Pester). The heavy integration/e2e/load-soak suites build and run
          # the app, which a test-only change leaves unaffected — so they're
          # gated off below. (dorny path filters can't express this: their `!`
          # negation is additive OR, not subtractive, so app/api/src/** still
          # matches a co-located *.test.js. We compute it here from the diff.)
          if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qvE '\.test\.(js|jsx)$|\.Tests\.ps1$'; then
            echo "only_tests=true" >> "$GITHUB_OUTPUT"
            echo "ONLY_TESTS: true — test-only change, skipping integration/e2e/load-soak" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "only_tests=false" >> "$GITHUB_OUTPUT"
          fi

          # Shared infra change → must test all crawlers
          if echo "$CHANGED" | grep -qE \
            "^tools/crawlers/shared/|^tools/powershell-sdk/|^setup/docker/Invoke-CrawlerJob\.ps1|^setup/IdentityAtlas\.psm1|^setup/docker/Dockerfile\.powershell"; then
            echo "crawlers_to_test=" >> "$GITHUB_OUTPUT"
            echo "CRAWLERS_TO_TEST: all (shared/infra change)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Extract changed crawler type names from the diff.
          # Require trailing slash to match subdirectories only —
          # tools/crawlers/CLAUDE.md (a file) must not be treated as a type.
          # tools/crawlers/<type>/... → <type>
          LIST=$(echo "$CHANGED" \
            | grep -oE "^tools/crawlers/[^/]+/" \
            | sed 's|tools/crawlers/||;s|/$||' \
            | grep -v '^shared$' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//')

          echo "crawlers_to_test=$LIST" >> "$GITHUB_OUTPUT"
          if [ -n "$LIST" ]; then
            echo "CRAWLERS_TO_TEST: $LIST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CRAWLERS_TO_TEST: all (integration triggered by non-crawler paths)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ═══════════════════════════════════════════════════════════════════
  # JOB 1: Core Integration Tests
  # ═══════════════════════════════════════════════════════════════════
  integration:
    name: Integration Tests
    needs: [filter]
    if: |
      (needs.filter.outputs.integration == 'true' && needs.filter.outputs.only_tests != 'true') ||
      needs.filter.result == 'failure' ||
      contains(github.event.pull_request.labels.*.name, 'integration-test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CRAWLERS_TO_TEST: comma-separated list of crawler types to assert.
      # Empty = test everything (current behaviour). Set by the filter/scope job.
      # The integration-test label forces a full run regardless of paths.
      CRAWLERS_TO_TEST: ${{ contains(github.event.pull_request.labels.*.name, 'integration-test') && '' || needs.filter.outputs.crawlers_to_test }}
      TEST_GRAPH_TENANT_ID:     ${{ secrets.TEST_GRAPH_TENANT_ID }}
      TEST_GRAPH_CLIENT_ID:     ${{ secrets.TEST_GRAPH_CLIENT_ID }}
      TEST_GRAPH_CLIENT_SECRET: ${{ secrets.TEST_GRAPH_CLIENT_SECRET }}
      TEST_LLM_API_KEY:         ${{ secrets.TEST_LLM_API_KEY }}
      TEST_LLM_PROVIDER:        ${{ secrets.TEST_LLM_PROVIDER }}
      TEST_LLM_MODEL:           ${{ secrets.TEST_LLM_MODEL }}
      TEST_RISK_PROFILE_DOMAIN: ${{ secrets.TEST_RISK_PROFILE_DOMAIN }}
      TEST_LLM_ENDPOINT:        ${{ secrets.TEST_LLM_ENDPOINT }}
      TEST_LLM_DEPLOYMENT:      ${{ secrets.TEST_LLM_DEPLOYMENT }}
      TEST_LLM_API_VERSION:     ${{ secrets.TEST_LLM_API_VERSION }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          # Current BuildKit → type=gha uses the Actions Cache Service v2 (the
          # legacy v1 service was retired). See docker-publish.yml.
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Build web image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./app/api/Dockerfile
          push: false
          load: true
          tags: identity-atlas-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=min,scope=web,ignore-error=true

      - name: Build worker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./setup/docker/Dockerfile.powershell
          push: false
          load: true
          tags: identity-atlas-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=min,scope=worker,ignore-error=true

      - name: Start stack
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for API ready
        run: |
          # #691 opens the port BEFORE running DB migrations, so a 200 on a
          # liveness endpoint no longer means the schema exists. Wait for the
          # real readiness signal — /api/health → schemaReady:true, which flips
          # once migrateDatabase() completes — before hitting schema-dependent
          # endpoints (and before reading the worker key that bootstrapWorker
          # creates after the schema is ready); otherwise they race the
          # background migration and 500 / come back empty.
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3001/api/health 2>/dev/null | grep -q '"schemaReady":true'; then
              echo "schema ready after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::schema did not become ready within 180s"
          docker compose -f docker-compose.ci.yml logs web
          exit 1

      - name: Get built-in worker API key
        id: apikey
        run: |
          KEY=$(docker compose -f docker-compose.ci.yml exec -T worker cat /data/uploads/.builtin-worker-key 2>/dev/null | tr -d '\r\n')
          if [ -z "$KEY" ]; then
            echo "::error::Could not read built-in worker API key"
            exit 1
          fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "API key retrieved (${#KEY} chars)"

      # ── Schema verification ──────────────────────────────────────
      - name: 'Test: Verify Postgres schema'
        run: |
          TABLES=$(docker compose -f docker-compose.ci.yml exec -T postgres \
            psql -U identity_atlas -d identity_atlas -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';")
          TABLES=$(echo "$TABLES" | tr -d '[:space:]')
          echo "Tables found: $TABLES"
          if [ "$TABLES" -lt 25 ]; then
            echo "::error::Expected at least 25 tables, found $TABLES"
            docker compose -f docker-compose.ci.yml exec -T postgres \
              psql -U identity_atlas -d identity_atlas -tAc \
              "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;"
            exit 1
          fi

      # ── Matrix expand affordance (regression: uuid=text cast) ────
      - name: 'Test: matrix expand queries type-check on real Postgres'
        run: |
          # The expand-affordance query joins ResourceRelationships.parentResourceId (uuid) to
          # Resources.targetNodeId (a TEXT generated column). A missing ::text cast type-errors on
          # real Postgres but is invisible to the DB-mocked unit tests (which is how the original
          # bug shipped). Run the predicate with ON_ERROR_STOP=1 so a type regression fails CI.
          # Keep this predicate in sync with /api/groups-with-nested in routes/permissions.js.
          docker compose -f docker-compose.ci.yml exec -T postgres \
            psql -U identity_atlas -d identity_atlas -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM \"Resources\" r
               WHERE r.\"capabilityId\" IS NOT NULL AND r.\"targetNodeId\" IS NOT NULL
                 AND EXISTS (SELECT 1 FROM \"ResourceRelationships\" rr
                              WHERE rr.\"relationshipType\" = 'Contains'
                                AND rr.\"parentResourceId\"::text = r.\"targetNodeId\");"
          echo "OK: expand-affordance predicate type-checks against the live schema"
          # The expand endpoints must respond with their documented shape (not a masked 500).
          curl -sf http://localhost:3001/api/groups-with-nested \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert isinstance(d.get('groupIds'), list); print('OK: /groups-with-nested responds')"

      # ── Demo data ────────────────────────────────────────────────
      - name: 'Test: Load demo data'
        run: |
          # Queue demo job
          JOB=$(curl -sf -X POST http://localhost:3001/api/admin/crawler-jobs \
            -H "Content-Type: application/json" \
            -d '{"jobType": "demo"}')
          JOB_ID=$(echo "$JOB" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          echo "Demo job queued: $JOB_ID"
          if [ -z "$JOB_ID" ]; then
            echo "::error::Failed to queue demo job"
            echo "$JOB"
            exit 1
          fi
          # Poll until complete
          for i in $(seq 1 40); do
            STATUS=$(curl -sf "http://localhost:3001/api/admin/crawler-jobs/$JOB_ID" | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)
            if [ "$STATUS" = "completed" ]; then
              echo "Demo job completed after $((i*3))s"
              break
            elif [ "$STATUS" = "failed" ]; then
              echo "::error::Demo job failed"
              curl -sf "http://localhost:3001/api/admin/crawler-jobs/$JOB_ID"
              exit 1
            fi
            sleep 3
          done
          if [ "$STATUS" != "completed" ]; then
            echo "::error::Demo job timed out (status: $STATUS)"
            exit 1
          fi

      - name: 'Test: Verify demo data loaded'
        run: |
          FAILED=0
          for ep in "/systems|1" "/users?limit=1|1" "/resources?limit=1|1" "/permissions?userLimit=1|1"; do
            PATH_PART=$(echo "$ep" | cut -d'|' -f1)
            MIN=$(echo "$ep" | cut -d'|' -f2)
            BODY=$(curl -sf "http://localhost:3001/api${PATH_PART}")
            # Check for non-empty array or object with data
            HAS_DATA=$(echo "$BODY" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if isinstance(d, list): print(len(d))
          elif 'data' in d: print(len(d['data']))
          elif 'users' in d: print(len(d['users']))
          elif 'rows' in d: print(len(d['rows']))
          else: print(len(d))
          " 2>/dev/null || echo "0")
            if [ "$HAS_DATA" -ge "$MIN" ]; then
              echo "  $PATH_PART: $HAS_DATA records"
            else
              echo "::error::$PATH_PART returned $HAS_DATA records (expected >= $MIN)"
              FAILED=$((FAILED+1))
            fi
          done
          if [ $FAILED -gt 0 ]; then exit 1; fi

      # The step above is a smoke check — "did any rows arrive on 4 endpoints".
      # This is the real verification of the same data: 35 assertions on row
      # counts, referential integrity and business logic (principal types,
      # governance flags, context hierarchy). The demo crawler queued above
      # ingests test/demo-dataset/demo-company.json, which is exactly what this
      # runner asserts against.
      #
      # It runs here for the first time. Until #707 it still spoke v4 SQL Server
      # and no workflow ever invoked it, so it rotted two schema generations
      # behind unnoticed — it never failed CI because it never ran (#709).
      #
      # Must be before the clean step below, which empties the database.
      # -PgPassword: the CI stack uses ci_test, not the local-compose default.
      - name: 'Test: Verify demo dataset'
        shell: pwsh
        run: |
          & test/demo-dataset/Verify-DemoDataset.ps1 `
            -ApiBaseUrl http://localhost:3001/api `
            -ComposeFile docker-compose.ci.yml `
            -PgPassword ci_test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ── Clean + verify empty ─────────────────────────────────────
      - name: 'Test: Clean database and verify empty'
        run: |
          # Clean
          CLEAN=$(curl -sf -X POST http://localhost:3001/api/admin/clean-database)
          echo "Clean response: $CLEAN"
          # Verify key tables are empty
          USERS=$(curl -sf "http://localhost:3001/api/users?limit=1" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total', d.get('totalCount', len(d.get('data',d.get('users',[]))))))" 2>/dev/null || echo "-1")
          if [ "$USERS" != "0" ]; then
            echo "::error::Users table not empty after clean (count: $USERS)"
            exit 1
          fi
          echo "Database clean verified"
          # Reload demo data for remaining tests
          JOB=$(curl -sf -X POST http://localhost:3001/api/admin/crawler-jobs \
            -H "Content-Type: application/json" -d '{"jobType": "demo"}')
          JOB_ID=$(echo "$JOB" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          for i in $(seq 1 40); do
            S=$(curl -sf "http://localhost:3001/api/admin/crawler-jobs/$JOB_ID" | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)
            [ "$S" = "completed" ] && break
            sleep 3
          done

      # ── Smoke test all read endpoints ────────────────────────────
      - name: 'Test: Smoke test read endpoints'
        run: |
          FAILED=0
          ENDPOINTS=(
            /auth-config /features /admin/status /admin/auth-settings
            /systems /users?limit=1 /resources?limit=1
            /permissions?userLimit=1 /sync-log /categories
            /tags /access-packages /risk-profiles
            /account-linking/config /admin/crawler-configs
            /version /openapi.json
          )
          for ep in "${ENDPOINTS[@]}"; do
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost:3001/api${ep}" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "  $ep: $CODE"
            else
              echo "::error::$ep returned $CODE"
              FAILED=$((FAILED+1))
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED endpoint(s) failed"
            exit 1
          fi

      # ── Configure LLM (pre-flight for LLM-dependent tests) ──────
      - name: 'Pre-flight: Configure LLM'
        if: env.TEST_LLM_API_KEY != ''
        shell: pwsh
        run: |
          & test/nightly/Configure-LLM.ps1 -ApiBaseUrl http://localhost:3001/api
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ── Test scripts (PowerShell) ────────────────────────────────
      - name: 'Test: Ingest API'
        shell: pwsh
        run: |
          & test/nightly/Test-IngestAPI.ps1 `
            -ApiBaseUrl http://localhost:3001/api `
            -ApiKey '${{ steps.apikey.outputs.key }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 'Test: Detail page counts'
        shell: pwsh
        run: |
          & test/nightly/Test-DetailPageCounts.ps1 `
            -ApiBaseUrl http://localhost:3001/api `
            -ApiKey '${{ steps.apikey.outputs.key }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 'Test: Account correlation'
        shell: pwsh
        run: |
          & test/nightly/Test-AccountCorrelation.ps1 `
            -ApiBaseUrl http://localhost:3001/api `
            -ApiKey '${{ steps.apikey.outputs.key }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 'Test: Matrix scope statistics'
        shell: bash
        run: |
          # Back-date the audit log so the timeline reconstruction has real depth
          # to verify (disable history pruning first so the 180-day baseline
          # survives). This only rewrites _history timestamps — live data is
          # untouched, so later tests are unaffected.
          docker compose -f docker-compose.ci.yml exec -T postgres psql -U identity_atlas -d identity_atlas -c \
            "INSERT INTO \"WorkerConfig\"(\"configKey\",\"configValue\") VALUES ('HISTORY_RETENTION_DAYS','0') ON CONFLICT (\"configKey\") DO UPDATE SET \"configValue\"=EXCLUDED.\"configValue\";"
          docker compose -f docker-compose.ci.yml exec -T postgres psql -U identity_atlas -d identity_atlas \
            < test/demo-dataset/Simulate-History.sql
          # Earlier test steps ingested rows without refreshing the matrix
          # materialized views, so the live scope-stats (which read the views)
          # would lag the raw tables the timeline reconstructs from. Refresh so
          # the "latest timeline point == live stats" check compares like with like.
          curl -sf -X POST http://localhost:3001/api/ingest/refresh-views \
            -H "Authorization: Bearer ${{ steps.apikey.outputs.key }}" \
            -H "Content-Type: application/json" -d '{}' || true
          pwsh -Command "& test/nightly/Test-MatrixScopeStats.ps1 -ApiBaseUrl http://localhost:3001/api -ApiKey '${{ steps.apikey.outputs.key }}' -ExpectHistoryDepth; if (\$LASTEXITCODE -ne 0) { exit 1 }"

      - name: 'Test: Secrets vault'
        shell: pwsh
        run: |
          & test/nightly/Test-SecretsVault.ps1 `
            -ApiBaseUrl http://localhost:3001/api `
            -ComposePath docker-compose.ci.yml
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 'Test: LLM substrate'
        shell: pwsh
        run: |
          & test/nightly/Test-LLMSubstrate.ps1 `
            -ApiBaseUrl http://localhost:3001/api `
            -ApiKey '${{ steps.apikey.outputs.key }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 'Test: Risk scoring (deterministic)'
        shell: pwsh
        run: |
          & test/nightly/Test-RiskScoring.ps1 `
            -ApiBaseUrl http://localhost:3001/api
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 'Test: Risk scoring with LLM'
        if: env.TEST_LLM_API_KEY != ''
        shell: pwsh
        run: |
          & test/nightly/Test-RiskScoringLLM.ps1 `
            -ApiBaseUrl http://localhost:3001/api
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ── Crawler-colocated integration tests (topology-aware, scope-aware) ──
      # Discovers all Test-*.ps1 files in tools/crawlers/<type>/ and runs them
      # in topological dependency order (dependency crawlers first, dependents after).
      # Same level runs in parallel. Adding a new crawler with a Test-*.ps1 file
      # automatically adds it here — no YAML changes needed.
      #
      # CRAWLERS_TO_TEST (env var, comma-separated):
      #   empty → test everything (full run, current behaviour)
      #   set   → testSet = given types + transitive dependents (assert these)
      #           runSet  = testSet + transitive dependencies (run for data setup)
      #   Types in runSet but not testSet run without assertions (exit code ignored).
      - name: 'Test: Crawler-colocated integration tests'
        shell: pwsh
        run: |
          Import-Module ./setup/IdentityAtlas.psd1 -Force -ErrorAction Stop
          $registry  = Get-CrawlerRegistry
          $apiBase   = 'http://localhost:3001/api'
          $apiKey    = '${{ steps.apikey.outputs.key }}'

          # ── Scope resolution ────────────────────────────────────────────────
          # Parse CRAWLERS_TO_TEST env var. Empty = full run.
          $scopeRaw = $env:CRAWLERS_TO_TEST
          $fullRun  = [string]::IsNullOrWhiteSpace($scopeRaw)

          # Traverse dependsOn upward (find all types that transitively depend on $T).
          # Used to expand the initial set: if odata changed, omada must also be tested.
          function Get-Dependents([string]$T, [hashtable]$reg) {
            $reg.Keys | Where-Object {
              $deps = $reg[$_].Manifest['dependsOn'] ?? @()
              $T -in $deps
            }
          }

          # Traverse dependsOn downward (find all dependencies of $T recursively).
          # Used to build runSet: types that must run first to seed data.
          function Get-Dependencies([string]$T, [hashtable]$reg, [System.Collections.Generic.HashSet[string]]$visited) {
            if ($visited.Contains($T)) { return }
            $null = $visited.Add($T)
            foreach ($dep in ($reg[$T].Manifest['dependsOn'] ?? @())) {
              Get-Dependencies $dep $reg $visited
            }
          }

          if (-not $fullRun) {
            # Seed testSet with the directly changed types.
            $testSet = [System.Collections.Generic.HashSet[string]]::new(
              [string[]]($scopeRaw -split ','), [System.StringComparer]::OrdinalIgnoreCase)

            # Expand testSet upward: add any type that (transitively) depends on a changed type.
            $changed = @($testSet)  # snapshot to avoid modifying while iterating
            foreach ($changedType in $changed) {
              $queue = [System.Collections.Queue]::new()
              $queue.Enqueue($changedType)
              while ($queue.Count -gt 0) {
                $current = $queue.Dequeue()
                foreach ($dep in (Get-Dependents $current $registry)) {
                  if ($testSet.Add($dep)) { $queue.Enqueue($dep) }
                }
              }
            }

            # Build runSet: testSet + all their transitive dependencies (data setup).
            $runSet = [System.Collections.Generic.HashSet[string]]::new($testSet, [System.StringComparer]::OrdinalIgnoreCase)
            foreach ($type in @($testSet)) {
              $deps = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
              Get-Dependencies $type $registry $deps
              foreach ($d in $deps) { $null = $runSet.Add($d) }
            }

            Write-Host "Scope: testSet=[$($testSet -join ', ')] runSet=[$($runSet -join ', ')]" -ForegroundColor Cyan
          } else {
            Write-Host "Scope: full run (CRAWLERS_TO_TEST not set)" -ForegroundColor Cyan
          }

          # ── Topology sort ────────────────────────────────────────────────────
          # Compute dependency depth for all types; run depth-0 first (no deps).
          $depths = @{}
          function Get-Depth([string]$T) {
            if ($depths.ContainsKey($T)) { return $depths[$T] }
            if (-not $registry.ContainsKey($T)) { throw "Crawler type '$T' referenced in dependsOn but not found in registry" }
            $deps = $registry[$T].Manifest['dependsOn'] ?? @()
            $d = if ($deps.Count -gt 0) { ($deps | ForEach-Object { Get-Depth $_ } | Measure-Object -Max).Maximum + 1 } else { 0 }
            $depths[$T] = $d; return $d
          }
          foreach ($type in $registry.Keys) { $null = Get-Depth $type }
          $maxDepth = ($depths.Values | Measure-Object -Max).Maximum

          # ── Run ──────────────────────────────────────────────────────────────
          $totalFailed = 0
          for ($depth = 0; $depth -le $maxDepth; $depth++) {
            $typesAtDepth = @($depths.GetEnumerator() | Where-Object Value -eq $depth | Select-Object -ExpandProperty Key)
            $jobs = @()
            $jobMeta = @{}  # job name → type (for scope check after Wait-Job)
            foreach ($type in $typesAtDepth) {
              # Skip types not in runSet (when scoped run).
              if (-not $fullRun -and -not $runSet.Contains($type)) { continue }

              $testFile = Get-ChildItem "tools/crawlers/$type/Test-*.ps1" -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $testFile) { continue }

              $asserting = $fullRun -or $testSet.Contains($type)
              $label = if ($asserting) { "ASSERT" } else { "setup-only" }
              Write-Host "::group::Crawler: $type (depth $depth, $label)"
              Write-Host "::notice title=${type}::Starting at $(Get-Date -Format 'HH:mm:ss')"

              $job = Start-Job -ScriptBlock {
                param($path, $url, $key)
                & pwsh -NoProfile -File $path -ApiBaseUrl $url -ApiKey $key
                if ($LASTEXITCODE -ne 0) { throw "Test script exited with code $LASTEXITCODE" }
              } -ArgumentList $testFile.FullName, $apiBase, $apiKey
              $jobs += $job
              $jobMeta[$job.Name] = $type
            }
            if ($jobs.Count -eq 0) { continue }
            $jobs | Wait-Job | ForEach-Object {
              $type = $jobMeta[$_.Name]
              $output = Receive-Job -Job $_ -Keep
              $output | ForEach-Object { Write-Host $_ }
              $failed = $_.State -ne 'Completed' -or ($_.ChildJobs[0].State -ne 'Completed')
              Remove-Job $_ -Force -ErrorAction SilentlyContinue

              $asserting = $fullRun -or $testSet.Contains($type)
              if ($failed) {
                if ($asserting) {
                  Write-Host "::error title=${type}::Test FAILED — see log above"
                  $totalFailed++
                } else {
                  Write-Host "::warning title=${type}::Setup-only run failed (not asserting — continuing)"
                }
              } else {
                Write-Host "::notice title=${type}::Passed"
              }
              Write-Host "::endgroup::"
            }
          }
          if ($totalFailed -gt 0) {
            Write-Host "$totalFailed crawler test file(s) failed" -ForegroundColor Red
            exit 1
          }

      # ── API benchmark (informational, non-blocking) ─────────────
      - name: 'Test: API benchmark'
        shell: pwsh
        continue-on-error: true
        run: |
          $benchScript = 'test/benchmark/Run-Benchmark.ps1'
          if (Test-Path $benchScript) {
            & $benchScript -ApiBaseUrl http://localhost:3001/api
          } else {
            Write-Host "Benchmark script not found — skipping"
          }

      # ── Cleanup ──────────────────────────────────────────────────
      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose -f docker-compose.ci.yml logs web    > ci-logs/web.log    2>&1 || true
          docker compose -f docker-compose.ci.yml logs worker > ci-logs/worker.log  2>&1 || true
          docker compose -f docker-compose.ci.yml logs postgres > ci-logs/postgres.log 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-logs
          path: ci-logs/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════════════
  # JOB 2: Playwright E2E Tests
  # ═══════════════════════════════════════════════════════════════════
  e2e:
    name: Playwright E2E
    needs: [filter]
    if: |
      ((needs.filter.outputs.e2e == 'true' && needs.filter.outputs.only_tests != 'true') || needs.filter.result == 'failure') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          # Current BuildKit → type=gha uses the Actions Cache Service v2 (the
          # legacy v1 service was retired). See docker-publish.yml.
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Build web image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./app/api/Dockerfile
          push: false
          load: true
          tags: identity-atlas-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=min,scope=web,ignore-error=true

      - name: Build worker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./setup/docker/Dockerfile.powershell
          push: false
          load: true
          tags: identity-atlas-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=min,scope=worker,ignore-error=true

      - name: Start stack
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for API ready
        run: |
          # Wait for schemaReady, not just the open port — see the note above.
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3001/api/health 2>/dev/null | grep -q '"schemaReady":true'; then
              echo "schema ready after $((i*2))s"
              break
            fi
            sleep 2
          done

      - name: Load demo data
        run: |
          JOB=$(curl -sf -X POST http://localhost:3001/api/admin/crawler-jobs \
            -H "Content-Type: application/json" -d '{"jobType": "demo"}')
          JOB_ID=$(echo "$JOB" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          for i in $(seq 1 40); do
            S=$(curl -sf "http://localhost:3001/api/admin/crawler-jobs/$JOB_ID" | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)
            [ "$S" = "completed" ] && break
            sleep 3
          done
          echo "Demo data loaded"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: app/ui
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: app/ui
        env:
          CI: true
        run: |
          npx playwright test \
            --config=playwright.ci.config.js \
            --project=chromium \
            --reporter=html,list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: app/ui/playwright-report/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════════════
  # JOB 3: Load & Soak Tests
  # ═══════════════════════════════════════════════════════════════════
  load-soak:
    name: Load & Soak Tests
    needs: [filter]
    if: |
      (
        (needs.filter.outputs.load_soak == 'true' && needs.filter.outputs.only_tests != 'true') ||
        needs.filter.result == 'failure' ||
        contains(github.event.pull_request.labels.*.name, 'load-soak')
      ) &&
      !contains(github.event.pull_request.labels.*.name, 'skip-load-soak')
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          # Current BuildKit → type=gha uses the Actions Cache Service v2 (the
          # legacy v1 service was retired). See docker-publish.yml.
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Build web image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./app/api/Dockerfile
          push: false
          load: true
          tags: identity-atlas-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=min,scope=web,ignore-error=true

      - name: Build worker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./setup/docker/Dockerfile.powershell
          push: false
          load: true
          tags: identity-atlas-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=min,scope=worker,ignore-error=true

      - name: Start stack
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for API ready
        run: |
          # #691 opens the port BEFORE running DB migrations, so a 200 on a
          # liveness endpoint no longer means the schema exists. Wait for the
          # real readiness signal — /api/health → schemaReady:true, which flips
          # once migrateDatabase() completes — before hitting schema-dependent
          # endpoints (and before reading the worker key that bootstrapWorker
          # creates after the schema is ready); otherwise they race the
          # background migration and 500 / come back empty.
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3001/api/health 2>/dev/null | grep -q '"schemaReady":true'; then
              echo "schema ready after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::schema did not become ready within 180s"
          docker compose -f docker-compose.ci.yml logs web
          exit 1

      - name: Get built-in worker API key
        id: apikey
        run: |
          KEY=$(docker compose -f docker-compose.ci.yml exec -T worker cat /data/uploads/.builtin-worker-key 2>/dev/null | tr -d '\r\n')
          if [ -z "$KEY" ]; then
            echo "::error::Could not read built-in worker API key"
            exit 1
          fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: 'Test: Load test (1.5M rows)'
        shell: pwsh
        run: |
          & test/nightly/Test-LoadAndBenchmark.ps1 `
            -ApiBaseUrl http://localhost:3001/api `
            -ApiKey '${{ steps.apikey.outputs.key }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 'Test: Soak test (15 min)'
        shell: pwsh
        run: |
          & test/nightly/Test-SoakTest.ps1 `
            -ApiBaseUrl http://localhost:3001/api `
            -DurationMinutes 15
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose -f docker-compose.ci.yml logs web    > ci-logs/web.log    2>&1 || true
          docker compose -f docker-compose.ci.yml logs worker > ci-logs/worker.log  2>&1 || true
          docker compose -f docker-compose.ci.yml logs postgres > ci-logs/postgres.log 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: load-soak-logs
          path: ci-logs/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════════════
  # Summary — blocks merge if any job failed
  # ── Gate: single required check for branch protection ───────────────────────
  # Replaces per-job branch protection requirements. After Phase 3 lands, this
  # gate wraps the crawler-tests matrix too — individual matrix job names can't
  # be required in branch protection, but this wrapper can.
  #
  # Migration: add ci-integration-passed alongside old requirements first,
  # verify on 2-3 PRs, then remove old requirements. See ci-scope-testing.md.
  ci-integration-passed:
    name: 'Integration CI Passed'
    runs-on: ubuntu-latest
    needs: [changes, filter, integration, e2e, load-soak]
    if: always()
    steps:
      - name: Check results
        run: |
          FAILED=$(echo '${{ toJSON(needs) }}' \
            | jq -r 'to_entries | .[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$FAILED" ]; then
            echo "## Integration CI Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The following jobs failed or were cancelled:" >> "$GITHUB_STEP_SUMMARY"
            echo "$FAILED" | while read -r job; do
              echo "- $job" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 1
          fi
          # Emit a summary even when everything was skipped (housekeeping push).
          echo "## PR Integration Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for job in integration e2e load-soak; do
            result=$(echo '${{ toJSON(needs) }}' | jq -r --arg j "$job" '.[$j].result // "skipped"')
            case "$result" in
              success) icon="✅" ;;
              skipped) icon="⏭️" ;;
              *) icon="❌" ;;
            esac
            echo "- ${icon} ${job}: ${result}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All integration checks passed or were legitimately skipped."
