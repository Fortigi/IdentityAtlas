# ─── Cut a Hotfix Release ─────────────────────────────────────────────────────
# Manually triggered. Tags the HEAD of a hotfix branch with a new patch version,
# triggering docker-publish to build :latest + :X.Y.Z.0.
#
# Usage:
#   1. git checkout -b bugfixes/fix-foo v5.2.0   ← branch from the release tag
#   2. Fix the bug, push the branch
#   3. Go to Actions → Cut Hotfix → Run workflow
#   4. Enter the branch name and new version (e.g. "5.2.1")
#   5. After the hotfix ships, open a PR to cherry-pick the fix into main
# ─────────────────────────────────────────────────────────────────────────────

name: Cut Hotfix

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Hotfix branch name (e.g. bugfixes/fix-login-crash)'
        required: true
      version:
        description: 'New version (major.minor.patch, e.g. "5.2.1")'
        required: true

jobs:
  cut-hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate version input
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be in Major.Minor.Patch format (e.g. 5.2.1)"
            exit 1
          fi

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Create and push hotfix tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Hotfix release $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          COMMIT=$(git rev-parse --short HEAD)
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "✅ Tagged ${TAG} on ${COMMIT}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Stamp hotfix version into .psd1
        run: sed -i "s/ModuleVersion = '[^']*'/ModuleVersion = '${{ env.VERSION }}.0'/" setup/IdentityAtlas.psd1

      - name: Install desktop dependencies (PGlite)
        run: npm install --prefer-offline
        working-directory: app/desktop

      - name: Build portable Windows ZIP
        run: npm run build:node-launcher
        working-directory: app/api

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname \
            | grep -vE '-(beta|rc|alpha)' \
            | grep -v "^${TAG}$" \
            | head -1)

          if [ -n "$PREV_TAG" ]; then
            FIRST_OLD=$(git show "${PREV_TAG}:CHANGES.md" 2>/dev/null | head -1)
            if [ -n "$FIRST_OLD" ]; then
              CUTLINE=$(grep -Fn "${FIRST_OLD}" CHANGES.md | head -1 | cut -d: -f1)
              [ -n "$CUTLINE" ] \
                && NEW_MD=$(head -n $((CUTLINE - 1)) CHANGES.md) \
                || NEW_MD=$(cat CHANGES.md)
            else
              NEW_MD=$(cat CHANGES.md)
            fi
          else
            NEW_MD=$(cat CHANGES.md)
          fi

          BULLETS=$(printf '%s\n' "$NEW_MD" \
            | grep -v '^## Changes in this PR$' \
            | awk 'BEGIN{blank=1} /^[[:space:]]*$/{if(!blank){print ""; blank=1}; next} {blank=0; print}')

          {
            printf '## Changes'
            [ -n "$PREV_TAG" ] && printf ' since %s' "$PREV_TAG"
            printf '\n\n%s\n' "$BULLETS"
            [ -n "$PREV_TAG" ] && printf '\n**Full Changelog:** https://github.com/${{ github.repository }}/compare/%s...%s\n' \
              "$PREV_TAG" "$TAG"
          } > release-notes.md

      - name: Create GitHub release with portable ZIP
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh release create "$TAG" \
            app/api/dist-node-launcher/IdentityAtlas-portable.zip \
            --title "$TAG" \
            --notes-file release-notes.md \
            --latest

      - name: Post run summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ✅ Hotfix tagged

          | | |
          |---|---|
          | **Tag** | \`${TAG}\` |
          | **Version** | \`${VERSION}.0\` |
          | **Branch** | \`${{ github.event.inputs.branch }}\` |
          | **Commit** | \`${COMMIT}\` |

          docker-publish is now building \`:latest\` + \`:${VERSION}.0\` — check the [Actions tab](../../actions) for progress.

          ### Next step — cherry-pick to main
          \`\`\`bash
          git checkout main && git pull
          git cherry-pick ${COMMIT}
          gh pr create --base main --title "fix: cherry-pick hotfix from ${TAG}"
          \`\`\`
          EOF
