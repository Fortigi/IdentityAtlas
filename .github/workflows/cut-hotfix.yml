# ─── Cut a Hotfix Release ─────────────────────────────────────────────────────
# Tags a commit of the release line (release/X.Y) with a new patch version,
# triggering docker-publish to build :latest + :X.Y.Z.0. The GitHub release gets
# both portable Windows ZIPs (IdentityAtlas-portable.zip and
# IdentityAtlas-portable-postgres.zip).
#
# Main first: every commit after the stable tag must be on main, a clean
# `git cherry-pick -x` of a main commit, or a Dependabot update merged into the
# release line. tools/release/Assert-ReleaseFromMain.ps1 refuses anything else
# before the tag is created (v6.0.1 was cut before its PR was approved).
#
# Normally nobody runs this by hand: the weekly stable route
# (release-weekly.yml → release-route.yml) calls it through workflow_call with
# the exact commit whose beta passed the release test. By hand (Actions → Cut
# Hotfix, from main): branch = release/X.Y or a commit on it, version X.Y.(Z+1).
# dry_run: true does everything up to the tag but pushes no tag and creates no
# release.
#
# The steps are shared with Cut Release and Cut Beta in cut-tag.yml.
# ─────────────────────────────────────────────────────────────────────────────

name: Cut Hotfix

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release line, tag or commit to tag (e.g. release/6.1)'
        required: true
      version:
        description: 'New version (major.minor.patch, e.g. "5.2.1")'
        required: true
      dry_run:
        description: 'Check and build everything, but push no tag and publish nothing'
        type: boolean
        default: false
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
      version:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
    # Named, never `secrets: inherit` (releaseKeyEnvironment.guard.test.js).
    secrets:
      BOT_APP_ID:
        required: true
      # Passed by name; it resolves only in the job that names release-automation.
      BOT_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  cut-hotfix:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/cut-tag.yml
    with:
      kind: hotfix
      version: ${{ inputs.version }}
      ref: ${{ inputs.branch }}
      mode: Hotfix
      dry_run: ${{ inputs.dry_run }}
      notes_prompt: |
        Read `release-notes.md`. It contains raw changelog bullets for
        Identity Atlas hotfix ${{ inputs.version }}.

        Rewrite it as polished GitHub release notes following these rules:

        1. Keep the "Full Changelog" link at the bottom unchanged.
        2. Group bullets under `###` headings by theme if there are enough to
           warrant it; otherwise a flat list under "## Bug fixes" is fine.
        3. Drop CI, tooling, and pure-implementation bullets with no
           user-visible effect.
        4. Rewrite in user-facing language — focus on the effect for the user.

        Overwrite `release-notes.md` with the result.
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  summary:
    needs: cut-hotfix
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post run summary
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ needs.cut-hotfix.outputs.tag }}
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
          COMMIT: ${{ needs.cut-hotfix.outputs.commit }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            HEADING="🧪 Dry run: hotfix checked, nothing published"
            NEXT="No tag was pushed and no release was created, so docker-publish does not run."
          else
            HEADING="✅ Hotfix tagged"
            NEXT="docker-publish is now building \`:latest\` + \`:${VERSION}.0\` — check the [Actions tab](../../actions) for progress."
          fi
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ${HEADING}

          | | |
          |---|---|
          | **Tag** | \`${TAG}\` |
          | **Version** | \`${VERSION}.0\` |
          | **Branch** | \`${BRANCH}\` |
          | **Commit** | \`${COMMIT}\` |

          ${NEXT}

          Nothing to bring back to main: a hotfix only holds commits that were on main first.
          EOF
