# ─── Cut a Hotfix Release ─────────────────────────────────────────────────────
# Manually triggered. Tags the HEAD of a hotfix branch with a new patch version,
# triggering docker-publish to build :latest + :X.Y.Z.0.
#
# Usage:
#   1. git checkout -b bugfixes/fix-foo v5.2.0   ← branch from the release tag
#   2. Fix the bug, push the branch
#   3. Go to Actions → Cut Hotfix → Run workflow
#   4. Enter the branch name and new version (e.g. "5.2.1")
#   5. After the hotfix ships, open a PR to cherry-pick the fix into main
# ─────────────────────────────────────────────────────────────────────────────

name: Cut Hotfix

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Hotfix branch name (e.g. bugfixes/fix-login-crash)'
        required: true
      version:
        description: 'New version (major.minor.patch, e.g. "5.2.1")'
        required: true

jobs:
  cut-hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Validate version input
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be in Major.Minor.Patch format (e.g. 5.2.1)"
            exit 1
          fi

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Create and push hotfix tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Hotfix release $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          COMMIT=$(git rev-parse --short HEAD)
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "✅ Tagged ${TAG} on ${COMMIT}"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Stamp hotfix version into .psd1
        run: sed -i "s/ModuleVersion = '[^']*'/ModuleVersion = '${{ env.VERSION }}.0'/" setup/IdentityAtlas.psd1

      - name: Install desktop dependencies (PGlite)
        run: npm install --prefer-offline
        working-directory: app/desktop

      - name: Build portable Windows ZIP
        run: npm run build:node-launcher
        working-directory: app/api

      - name: Generate release notes
        run: |
          # Compare against the previous tag in the same major.minor series
          # (e.g. v5.7.2 when cutting v5.7.3), not the globally latest stable.
          BASE_MINOR=$(echo "${{ github.event.inputs.version }}" | cut -d. -f1,2)
          PREV_TAG=$(git tag --list "v${BASE_MINOR}.*" --sort=-version:refname \
            | grep -v beta | grep -v rc | grep -v alpha | grep -v "^${TAG}$" | head -1)

          # Primary source: unmerged changes/*.md fragments on this hotfix branch.
          # bump-version hasn't run yet so fragments aren't in CHANGES.md.
          FRAG_BULLETS=$(find changes/ -name '*.md' -not -name 'TEMPLATE*' 2>/dev/null \
            | sort | xargs cat 2>/dev/null \
            | grep -v '^## Changes in this PR$' \
            | awk 'BEGIN{blank=1} /^[[:space:]]*$/{if(!blank){print ""; blank=1}; next} {blank=0; print}')

          # Fallback: slice CHANGES.md by line count (prepend model).
          if [ -z "$FRAG_BULLETS" ] && [ -n "$PREV_TAG" ]; then
            OLD_LINES=$(git show "${PREV_TAG}:CHANGES.md" 2>/dev/null | wc -l)
            TOTAL_LINES=$(wc -l < CHANGES.md)
            NEW_LINES=$((TOTAL_LINES - OLD_LINES))
            [ "$NEW_LINES" -gt 0 ] && FRAG_BULLETS=$(head -n "$NEW_LINES" CHANGES.md \
              | grep -v '^## Changes in this PR$' \
              | awk 'BEGIN{blank=1} /^[[:space:]]*$/{if(!blank){print ""; blank=1}; next} {blank=0; print}')
          fi

          {
            printf '## Changes'
            [ -n "$PREV_TAG" ] && printf ' since %s' "$PREV_TAG"
            printf '\n\n%s\n' "$FRAG_BULLETS"
            [ -n "$PREV_TAG" ] && printf '\n**Full Changelog:** https://github.com/${{ github.repository }}/compare/%s...%s\n' \
              "$PREV_TAG" "$TAG"
          } > release-notes.md
          echo "--- release-notes.md raw preview ---"
          cat release-notes.md

      - name: Synthesize release notes with Claude
        uses: anthropics/claude-code-action@6c0083bb7289c31716797a039b6367b3079cc46e # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Read,Write"
          prompt: |
            Read `release-notes.md`. It contains raw changelog bullets for
            Identity Atlas hotfix ${{ github.event.inputs.version }}.

            Rewrite it as polished GitHub release notes following these rules:

            1. Keep the "Full Changelog" link at the bottom unchanged.
            2. Group bullets under `###` headings by theme if there are enough to
               warrant it; otherwise a flat list under "## Bug fixes" is fine.
            3. Drop CI, tooling, and pure-implementation bullets with no
               user-visible effect.
            4. Rewrite in user-facing language — focus on the effect for the user.

            Overwrite `release-notes.md` with the result.

      - name: Create GitHub release with portable ZIP
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh release create "$TAG" \
            app/api/dist-node-launcher/IdentityAtlas-portable.zip \
            --title "$TAG" \
            --notes-file release-notes.md \
            --latest

      - name: Deploy versioned docs
        run: |
          pip install --quiet -r docs/requirements.txt
          mike deploy --push --title "$VERSION" stable

      - name: Post run summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ✅ Hotfix tagged

          | | |
          |---|---|
          | **Tag** | \`${TAG}\` |
          | **Version** | \`${VERSION}.0\` |
          | **Branch** | \`${{ github.event.inputs.branch }}\` |
          | **Commit** | \`${COMMIT}\` |

          docker-publish is now building \`:latest\` + \`:${VERSION}.0\` — check the [Actions tab](../../actions) for progress.

          ### Next step — cherry-pick to main
          \`\`\`bash
          git checkout main && git pull
          git cherry-pick ${COMMIT}
          gh pr create --base main --title "fix: cherry-pick hotfix from ${TAG}"
          \`\`\`
          EOF
