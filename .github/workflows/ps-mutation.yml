# ─── PowerShell mutation testing ─────────────────────────────────────────────
# Uses the published PSMutant module to mutation-test the decomposed crawler
# transforms (the pure ConvertTo-* record-shapers) against their Pester suites --
# the metric that proves the tests would CATCH a bug, not just execute the line.
#
# REPORT-ONLY for now (.ci/psmutant.config.json has thresholds.break = null): it
# prints the score and uploads the report, but does not fail the build. Set a floor
# once the scores are understood. Mutation is heavier than unit tests, so it runs
# weekly, on demand, and on PRs that touch the mutated transforms (not every PR).
#
# Because it's the ONLY place mutation runs, the weekly/on-demand run also owns the
# mutation figure on the Test Coverage docs page: it writes the score to
# docs/coverage/powershell/mutation.json, re-renders docs/reference/coverage.md from
# the already-committed coverage summaries (tools/generate-coverage-doc.py), and
# commits both back to main. coverage.yml (every merge) just reads that file back —
# it never runs mutation itself. PR runs stay report-only (no commit). Same
# protected-main push mechanics as coverage.yml / sbom-update.yml: the GitHub App
# token is required (GITHUB_TOKEN can't bypass branch protection) and the push
# rebases-and-retries to absorb a concurrent commit.
# ─────────────────────────────────────────────────────────────────────────────
name: PowerShell mutation testing

on:
  schedule:
    - cron: '0 3 * * 1' # Weekly, Monday 03:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/crawlers/**/*.Transform.ps1'
      - 'test/unit/*CrawlerTransform.Tests.ps1'
      - '.ci/psmutant.config.json'
      - '.github/workflows/ps-mutation.yml'

concurrency:
  group: ps-mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # weekly/on-demand run commits the refreshed score to main

jobs:
  mutation:
    name: Mutation testing (PSMutant)
    runs-on: ubuntu-latest
    steps:
      # Bot token only for the publishing (non-PR) runs — PR runs are report-only
      # and never push, so they don't need it.
      - name: Generate bot token
        id: bot-token
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # PR: the PR merge ref (score the proposed code). Otherwise: main HEAD,
          # checked out with the bot token so the publish step can push back.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          token: ${{ steps.bot-token.outputs.token || github.token }}

      - name: Install pinned Pester + PSMutant
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.8.0 -Force -Scope CurrentUser
          Install-Module PSMutant -RequiredVersion 0.1.0 -Force -Scope CurrentUser

      - name: Run mutation testing (report-only)
        shell: pwsh
        run: |
          Import-Module PSMutant -Force
          $r = Invoke-PSMutation -ConfigFile .ci/psmutant.config.json -SourceRoot . -Quiet
          Write-Host "Mutation score: $($r.Score)% ($($r.Killed) killed / $($r.Total))"
          if ($r.ExitCode -ne 0) { throw "Mutation score $($r.Score)% is below the break threshold" }

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ps-mutation-report
          path: reports/ps-mutation.json
          if-no-files-found: ignore

      # Publish the score to the coverage docs page (weekly / on-demand only).
      # Re-renders coverage.md from the ALREADY-COMMITTED per-suite summaries plus
      # the fresh mutation.json, so line/complexity numbers are preserved as-of the
      # last coverage.yml run and only the mutation column moves.
      - name: Publish mutation score to the coverage docs
        if: github.event_name != 'pull_request'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs/coverage/powershell
          cp reports/ps-mutation.json docs/coverage/powershell/mutation.json
          python3 tools/generate-coverage-doc.py \
            --coverage-dir docs/coverage \
            --out docs/reference/coverage.md \
            --commit "$GITHUB_SHA"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/coverage/powershell/mutation.json docs/reference/coverage.md
          if git diff --cached --quiet; then
            echo "Mutation score unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "docs: refresh PowerShell mutation score"
          # coverage.yml / bump-version.yml may push to main concurrently — rebase & retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt) — rebasing onto latest main"
            git pull --rebase origin main
          done
          echo "::error::Could not push mutation update after 5 attempts"
          exit 1
