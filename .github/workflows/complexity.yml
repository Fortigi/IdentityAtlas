# ─── Complexity ratchet (cyclomatic + cognitive) ─────────────────────────────
# Enforces that no unit (function, or a PowerShell script/module body) gets MORE
# complex than its grandfathered baseline, and that new/touched units stay under the
# per-language threshold. Two independent metrics, each with its own baseline:
#   cyclomatic → .ci/complexity-baseline.json   (PS/Py 15, JS 20)
#   cognitive  → .ci/cognitive-baseline.json    (PS/Py 15; JS not yet gated)
# Both baselines only ever ratchet down, squeezing the codebase toward "every unit
# <= 15" over time. PowerShell complexity is measured by the published PSComplexity
# module; see tools/complexity/ratchet.py. Nothing red-builds on adoption.
# ─────────────────────────────────────────────────────────────────────────────
name: Complexity ratchet

on:
  pull_request:
    branches: [main]
    # Skip-hygiene: a PR that changes ONLY docs / a version bump / the ratchet
    # baseline has no code to re-measure, so the gate doesn't run. `.ci/**` covers
    # a pure re-baseline (no code change) — it's self-consistent by construction
    # (the baseline was generated from that exact code via --update), and a real
    # code change that also re-baselines still runs, since paths-ignore only skips
    # when EVERY changed file matches.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'setup/IdentityAtlas.psd1'
      - '.ci/**'
  workflow_dispatch:

concurrency:
  group: complexity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: Complexity ratchet
    runs-on: ubuntu-latest   # pwsh + python3 are preinstalled on the GitHub runner
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            app/api/package-lock.json
            app/ui/package-lock.json

      # ESLint (with the project's configs/plugins) is the JS/TS measurer, so the
      # workspaces it lints must have their dependencies installed.
      - name: Install JS dependencies
        run: |
          npm ci --prefix app/api
          npm ci --prefix app/ui

      # The PowerShell measurer is the published PSComplexity module (reference-tested
      # upstream); measure_ps.ps1 is a thin selector/formatter over it.
      - name: Install PSComplexity (PowerShell complexity measurer)
        shell: pwsh
        run: Install-Module PSComplexity -RequiredVersion 0.1.0 -Force -Scope CurrentUser

      # Validate the ratchet gate logic (Python) before it gates anything.
      - name: Test the ratchet gate logic
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/complexity/test_ratchet.py -q

      - name: Run cyclomatic-complexity ratchet
        run: python3 tools/complexity/ratchet.py

      - name: Run cognitive-complexity ratchet
        run: python3 tools/complexity/ratchet.py --metric cognitive
