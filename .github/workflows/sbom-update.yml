# ─── Regenerate SBOM on dependency change ────────────────────────────────────
# When a PR that touches dependency manifests, lockfiles, or Dockerfiles is
# merged into main, this workflow:
#   1. Regenerates the machine-readable SPDX SBOM (sbom-edge.spdx.json).
#   2. Refreshes the version column of the curated docs page
#      (docs/reference/sbom.md) from the npm manifests.
# Both are then committed back to main. Covers Dependabot and manual bumps.
#
# Notes:
#   * Pushing to the protected main branch requires the GitHub App token
#     (same bot as bump-version.yml) — GITHUB_TOKEN cannot bypass branch
#     protection and would not trigger downstream events.
#   * bump-version.yml also pushes to main on every PR merge, so the commit
#     step rebases and retries to absorb that concurrent commit.
#   * The commit is NOT marked [skip ci]: it touches docs/reference/sbom.md, so
#     docs.yml must run to redeploy the published SBOM page. (No Docker rebuild
#     results — docker-publish.yml is gated on bump-version, not arbitrary
#     pushes.)
# ─────────────────────────────────────────────────────────────────────────────

name: Update SBOM on dependency change

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - app/api/package.json
      - app/api/package-lock.json
      - app/ui/package.json
      - app/ui/package-lock.json
      - docs/requirements.txt
      - app/api/Dockerfile
      - app/ui/Dockerfile
      - setup/docker/Dockerfile.powershell
      - docker-compose.yml

# Serialize with any other run of this workflow so concurrent merges
# don't race each other on the push to main.
concurrency:
  group: sbom-update-main
  cancel-in-progress: false  # queue them, don't drop

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    # Only act on actual merges; the paths filter above already scoped this to
    # PRs that changed dependency files.
    if: github.event.pull_request.merged == true
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.bot-token.outputs.token }}

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          output-file: sbom-edge.spdx.json
          upload-artifact: false

      - name: Refresh SBOM docs page
        run: python3 tools/update-sbom-doc.py

      - name: Commit updated SBOM
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sbom-edge.spdx.json docs/reference/sbom.md
          if git diff --cached --quiet; then
            echo "SBOM unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: update SBOM after ${{ github.event.pull_request.title }}"
          # bump-version.yml pushes to main on the same merge — rebase & retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt) — rebasing onto latest main"
            git pull --rebase origin main
          done
          echo "::error::Could not push SBOM update after 5 attempts"
          exit 1
