# ─── Label Dependabot security fixes ─────────────────────────────────────────
# Marks a Dependabot PR into main `security-fix` when it fixes a Dependabot
# alert and is a patch or minor update. The nightly security route
# (release-nightly.yml, tools/release/Get-SecurityHotfixPlan.ps1) collects the
# merged PRs with that label and ships them to stable as one hotfix.
#
# Why here and not in the nightly run: fetch-metadata only reads the PR of the
# event that triggered it, so its alert lookup has to happen on the PR itself.
#
# Why a GitHub App token: alert-lookup reads Dependabot alerts, which
# GITHUB_TOKEN cannot. The App ("Identity Atlas security lookup") has ONLY
# "Dependabot alerts: read" — deliberately not the release App, whose key can
# push to main and must not be minted on a Dependabot event. Without its two
# secrets this workflow warns and labels nothing; the nightly route then finds
# no security fixes. Setup: docs/contributing/release-process.md.
#
# Why pull_request_target: a `pull_request` run by Dependabot gets no secrets
# and a read-only token. This workflow never checks out or runs the PR's code;
# it reads metadata and calls the GitHub API. Do not add actions/checkout here.
# ─────────────────────────────────────────────────────────────────────────────

name: Dependabot security label

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write          # creating the label the first time

jobs:
  label:
    name: 'Label a security fix'
    # Authored by Dependabot and not touched by anyone else since (same rule as
    # dependabot-auto-merge.yml): a human push makes it a human PR again.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.SECURITY_LOOKUP_APP_ID != '' && secrets.SECURITY_LOOKUP_PRIVATE_KEY != '' }}
    steps:
      - name: Explain a missing App
        if: env.HAS_APP != 'true'
        run: echo "::warning::SECURITY_LOOKUP_APP_ID / SECURITY_LOOKUP_PRIVATE_KEY are not set, so Dependabot alerts cannot be looked up and this PR is not labelled. See docs/contributing/release-process.md."

      - name: Mint the alert-lookup token
        id: token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SECURITY_LOOKUP_APP_ID }}
          private-key: ${{ secrets.SECURITY_LOOKUP_PRIVATE_KEY }}

      - name: Read Dependabot metadata and the alert it fixes
        id: meta
        if: env.HAS_APP == 'true'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ steps.token.outputs.token }}
          alert-lookup: true

      - name: Label patch and minor security fixes
        if: >-
          env.HAS_APP == 'true' && steps.meta.outputs.ghsa-id != '' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GHSA: ${{ steps.meta.outputs.ghsa-id }}
          UPDATE: ${{ steps.meta.outputs.update-type }}
        run: |
          gh label create security-fix --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description 'Dependabot fix for a security alert; shipped to stable by the nightly security route' --force
          gh pr edit "$PR_URL" --add-label security-fix
          echo "::notice::Labelled security-fix: fixes $GHSA ($UPDATE)."

      - name: Say why a security update is not labelled
        if: env.HAS_APP == 'true' && steps.meta.outputs.ghsa-id != '' && steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GHSA: ${{ steps.meta.outputs.ghsa-id }}
        run: echo "::notice::Fixes $GHSA, but as a major update. Majors are not shipped to stable automatically; this one needs a person."
