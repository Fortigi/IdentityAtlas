# ─── Cut a Release ────────────────────────────────────────────────────────────
# Manually triggered. Tags a chosen ref with vX.Y.Z, builds the
# portable Windows ZIP, creates a GitHub release with the ZIP attached, and
# lets docker-publish (triggered by the tag push) push :latest + :X.Y.Z.0.
#
# Usage:
#   1. Go to Actions → Cut Release → Run workflow
#   2. Enter the version (e.g. "5.2.0" — major.minor.patch) and optionally a ref (default: main)
#   3. The workflow creates tag v5.2.0 on that ref
#   4. A GitHub release is created with IdentityAtlas-portable.zip attached
#   5. docker-publish builds and pushes :latest + :5.2.0.0
#
# Hotfixes (shipping a bugfix without including features already on main):
#   1. git checkout -b bugfixes/fix-foo v5.2.0   ← branch from the tag, not main
#   2. Fix the bug, push the branch
#   3. Run Actions → Cut Hotfix with the branch name and new version (e.g. 5.2.1)
# ─────────────────────────────────────────────────────────────────────────────

name: Cut Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (major.minor.patch, e.g. "5.2.0")'
        required: true
      ref:
        description: 'Branch, tag, or commit to cut from (default: main)'
        required: false
        default: 'main'

jobs:
  cut-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Validate version input
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be in Major.Minor.Patch format (e.g. 5.2.0)"
            exit 1
          fi

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.ref }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Create and push release tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "✅ Tagged ${TAG} on $(git rev-parse --short HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Stamp release version into .psd1
        run: sed -i "s/ModuleVersion = '[^']*'/ModuleVersion = '${{ env.VERSION }}.0'/" setup/IdentityAtlas.psd1

      - name: Install desktop dependencies (PGlite)
        run: npm install --prefer-offline
        working-directory: app/desktop

      - name: Build portable Windows ZIP
        run: npm run build:node-launcher
        working-directory: app/api

      - name: Generate release notes
        run: |
          # Find the previous stable release tag (excludes beta/rc/alpha)
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -v beta | grep -v rc | grep -v alpha | grep -v "^${TAG}$" | head -1)

          # Slice CHANGES.md to only the lines prepended since PREV_TAG.
          # bump-version.yml always prepends — old content is the last N lines.
          if [ -n "$PREV_TAG" ]; then
            OLD_LINES=$(git show "${PREV_TAG}:CHANGES.md" 2>/dev/null | wc -l)
            TOTAL_LINES=$(wc -l < CHANGES.md)
            NEW_LINES=$((TOTAL_LINES - OLD_LINES))
            [ "$NEW_LINES" -gt 0 ] && NEW_MD=$(head -n "$NEW_LINES" CHANGES.md) || NEW_MD=""
          else
            NEW_MD=$(cat CHANGES.md)
          fi

          # Strip "## Changes in this PR" headers; collapse consecutive blank lines
          BULLETS=$(printf '%s\n' "$NEW_MD" \
            | grep -v '^## Changes in this PR$' \
            | awk 'BEGIN{blank=1} /^[[:space:]]*$/{if(!blank){print ""; blank=1}; next} {blank=0; print}')

          {
            printf '## Changes'
            [ -n "$PREV_TAG" ] && printf ' since %s' "$PREV_TAG"
            printf '\n\n%s\n' "$BULLETS"
            [ -n "$PREV_TAG" ] && printf '\n**Full Changelog:** https://github.com/${{ github.repository }}/compare/%s...%s\n' \
              "$PREV_TAG" "$TAG"
          } > release-notes.md
          echo "--- release-notes.md raw preview ---"
          cat release-notes.md

      - name: Synthesize release notes with Claude
        uses: anthropics/claude-code-action@6c0083bb7289c31716797a039b6367b3079cc46e # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Read,Write"
          prompt: |
            Read `release-notes.md`. It contains a flat list of raw changelog bullets for
            Identity Atlas ${{ github.event.inputs.version }}, collected from merged PRs
            since the previous release.

            Rewrite it as polished GitHub release notes following these rules:

            1. Keep the "Full Changelog" link at the bottom unchanged.
            2. Group bullets under `###` headings by theme (e.g. "Account Linking",
               "Omada IGA crawler", "Security fixes", "Bug fixes", "UI & accessibility").
               Don't create a heading for a single bullet — fold it under the closest
               related heading or a generic "Improvements" section.
            3. Drop bullets that fix something introduced in this same release. If one
               bullet adds feature X and another fixes a bug in X, the fix is internal —
               users upgrading from the previous release never saw X break.
            4. Drop CI, tooling, and pure-implementation bullets with no user-visible
               effect (workflow fixes, CmdletBinding additions, dependency bumps, etc.).
            5. Merge bullets that describe the same change in different words.
            6. Rewrite in user-facing language — focus on the effect for the user, not
               the implementation detail.

            Overwrite `release-notes.md` with the result.

      - name: Create GitHub release with portable ZIP
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh release create "$TAG" \
            app/api/dist-node-launcher/IdentityAtlas-portable.zip \
            --title "$TAG" \
            --notes-file release-notes.md \
            --latest

      - name: Deploy versioned docs
        run: |
          pip install --quiet -r docs/requirements.txt
          mike deploy --push --title "$VERSION" stable

      - name: Post run summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ✅ Release tagged

          | | |
          |---|---|
          | **Tag** | \`${TAG}\` |
          | **Version** | \`${VERSION}.0\` |
          | **Commit** | \`$(git rev-parse --short HEAD)\` |

          docker-publish is now building \`:latest\` + \`:${VERSION}.0\` — check the [Actions tab](../../actions) for progress.

          ### Hotfix workflow (if a bug is found in this release)
          \`\`\`bash
          git checkout -b bugfixes/fix-foo ${TAG}   # branch from the tag, not main
          # fix the bug, commit, push
          git push origin bugfixes/fix-foo
          # then run Actions → Cut Hotfix
          \`\`\`
          EOF
