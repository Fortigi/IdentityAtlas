# ─── Cut a Release ────────────────────────────────────────────────────────────
# Manually triggered. Tags a chosen ref with vX.Y.Z, builds the two
# portable Windows ZIPs, creates a GitHub release with both attached, and
# lets docker-publish (triggered by the tag push) push :latest + :X.Y.Z.0.
#
# Usage:
#   1. Go to Actions → Cut Release → Run workflow
#   2. Enter the version (e.g. "5.2.0" — major.minor.patch) and optionally a ref (default: main)
#   3. The workflow creates tag v5.2.0 on that ref — which must be a commit on
#      main (tools/release/Assert-ReleaseFromMain.ps1 refuses anything else)
#   4. A GitHub release is created with IdentityAtlas-portable.zip,
#      IdentityAtlas-portable-postgres.zip and IdentityAtlas-azure-X.Y.Z.zip
#      (the Azure template pinned to this release's images) attached
#   5. docker-publish builds and pushes :latest + :5.2.0.0
#
# Hotfixes (shipping a bugfix without including features already on main):
#   1. Merge the fix to main through an approved PR first
#   2. git checkout -b bugfixes/fix-foo v5.2.0 && git cherry-pick -x <main commit>
#   3. Run Actions → Cut Hotfix with the branch name and new version (e.g. 5.2.1)
# ─────────────────────────────────────────────────────────────────────────────

name: Cut Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (major.minor.patch, e.g. "5.2.0")'
        required: true
      ref:
        description: 'Branch, tag, or commit to cut from (default: main)'
        required: false
        default: 'main'

jobs:
  cut-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Validate version input
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be in Major.Minor.Patch format (e.g. 5.2.0)"
            exit 1
          fi

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      # Only code already merged to main (approved PR) may be released. Loaded
      # from this workflow's own commit, never from the ref being released.
      - name: Refuse a ref that is not on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run Cut Release from main (it ran from $GITHUB_REF)."; exit 1
          fi
          git show "$GITHUB_WORKFLOW_SHA:tools/release/Assert-ReleaseFromMain.ps1" > "$RUNNER_TEMP/assert.ps1"
          pwsh -NoProfile -File "$RUNNER_TEMP/assert.ps1" -Mode Release -Ref HEAD

      - name: Create and push release tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "✅ Tagged ${TAG} on $(git rev-parse --short HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Stamp release version into .psd1
        run: sed -i "s/ModuleVersion = '[^']*'/ModuleVersion = '${{ env.VERSION }}.0'/" setup/IdentityAtlas.psd1

      - name: Install desktop dependencies (PGlite)
        run: npm install --prefer-offline
        working-directory: app/desktop

      # Two ZIPs: the default (PGlite, signed node.exe only) and -postgres
      # (embedded PostgreSQL for large data sets, unsigned binaries). One shared
      # script so cut-release / cut-beta / cut-hotfix cannot drift apart.
      - name: Build portable Windows ZIPs
        run: bash .github/scripts/build_portable_zips.sh

      # The Azure template, pinned to THIS release's images: azure/ at this tag
      # with imageTag defaulting to the image version, attached to the release as
      # IdentityAtlas-azure-<version>.zip. Loaded from this workflow's own commit
      # (like the main-only check), so an older hotfix branch without the script
      # is still packaged; a template from before imageTag gets no package.
      - name: Package the Azure template
        run: |
          git show "$GITHUB_WORKFLOW_SHA:tools/release/New-AzureTemplatePackage.ps1" > "$RUNNER_TEMP/package-azure.ps1"
          pwsh -NoProfile -File "$RUNNER_TEMP/package-azure.ps1" -Version "${VERSION}.0" -OutFile "$RUNNER_TEMP/IdentityAtlas-azure-${VERSION}.zip"

      - name: Generate release notes
        run: |
          # The stable release this one follows. Shared by both cut workflows so
          # the two cannot drift apart again — see the script for why the
          # "globally latest tag" and "same series only" rules were each wrong.
          PREV_TAG=$(bash .github/scripts/release_prev_tag.sh "$TAG")

          # Slice CHANGES.md to only the lines prepended since PREV_TAG.
          # bump-version.yml always prepends — old content is the last N lines.
          if [ -n "$PREV_TAG" ]; then
            OLD_LINES=$(git show "${PREV_TAG}:CHANGES.md" 2>/dev/null | wc -l)
            TOTAL_LINES=$(wc -l < CHANGES.md)
            NEW_LINES=$((TOTAL_LINES - OLD_LINES))
            [ "$NEW_LINES" -gt 0 ] && NEW_MD=$(head -n "$NEW_LINES" CHANGES.md) || NEW_MD=""
          else
            NEW_MD=$(cat CHANGES.md)
          fi

          # Strip "## Changes in this PR" headers; collapse consecutive blank lines
          BULLETS=$(printf '%s\n' "$NEW_MD" \
            | grep -v '^## Changes in this PR$' \
            | awk 'BEGIN{blank=1} /^[[:space:]]*$/{if(!blank){print ""; blank=1}; next} {blank=0; print}')

          {
            printf '## Changes'
            [ -n "$PREV_TAG" ] && printf ' since %s' "$PREV_TAG"
            printf '\n\n%s\n' "$BULLETS"
            [ -n "$PREV_TAG" ] && printf '\n**Full Changelog:** https://github.com/${{ github.repository }}/compare/%s...%s\n' \
              "$PREV_TAG" "$TAG"
          } > release-notes.md
          echo "PREV_TAG=${PREV_TAG}" >> "$GITHUB_ENV"
          echo "--- release-notes.md raw preview ---"
          cat release-notes.md

      - name: Synthesize release notes with Claude
        id: polish
        continue-on-error: true
        # continue-on-error: this step only polishes wording — release-notes.md already has valid,
        # ready-to-ship content from the deterministic step above. A rejected/unentitled model call
        # (see dor-agent.yml) must never block cutting a release; worst case we ship the raw bullets.
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Read,Write"
          prompt: |
            Read `release-notes.md`. It contains a flat list of raw changelog bullets for
            Identity Atlas ${{ github.event.inputs.version }}, collected from merged PRs
            since the previous release.

            Rewrite it as polished GitHub release notes following these rules:

            1. Keep the "Full Changelog" link at the bottom unchanged.
            2. Group bullets under `###` headings by theme (e.g. "Account Linking",
               "Omada IGA crawler", "Security fixes", "Bug fixes", "UI & accessibility").
               Don't create a heading for a single bullet — fold it under the closest
               related heading or a generic "Improvements" section.
            3. Drop bullets that fix something introduced in this same release. If one
               bullet adds feature X and another fixes a bug in X, the fix is internal —
               users upgrading from the previous release never saw X break.
            4. Drop CI, tooling, and pure-implementation bullets with no user-visible
               effect (workflow fixes, CmdletBinding additions, dependency bumps, etc.).
            5. Merge bullets that describe the same change in different words.
            6. Rewrite in user-facing language — focus on the effect for the user, not
               the implementation detail.

            Overwrite `release-notes.md` with the result.

      - name: Warn if release notes weren't polished
        if: steps.polish.outcome == 'failure'
        run: echo "::warning::Release notes polishing failed (model call rejected/unavailable) — shipping the raw changelog bullets instead. Check CLAUDE_CODE_OAUTH_TOKEN entitlements/subscription status."

      # Dependency deltas cannot reach release-notes.md through the changelog:
      # the PR Hygiene gate's CODE pattern does not cover package-lock.json, so
      # Dependabot PRs merge without a changes/*.md fragment, and the polish step
      # above is told to drop tooling bullets with no user-visible effect — which
      # is how a library bump reads. A library-only patch release would ship
      # notes with nothing under "## Changes", which is the release where an
      # operator most needs to see which version moved.
      #
      # Appended AFTER polishing on purpose: the model cannot drop or reword a
      # section it never sees, so the shipped-dependency list is exact.
      # Which portable ZIP to download is appended after polishing for the same
      # reason: the model cannot drop or reword it.
      - name: Append dependency updates and download guide
        run: |
          python3 tools/release-notes/dependency-delta.py "${PREV_TAG}" "${TAG}" >> release-notes.md
          cat tools/release-notes/portable-downloads.md >> release-notes.md
          echo "--- release-notes.md final ---"
          cat release-notes.md

      # Publishing the release triggers docs.yml, which deploys the stable docs.
      # Don't deploy them here as well: two pushes to gh-pages race and one fails.
      - name: Create GitHub release with portable ZIPs
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          ASSETS=(app/api/dist-node-launcher/release/IdentityAtlas-portable.zip
                  app/api/dist-node-launcher/release/IdentityAtlas-portable-postgres.zip)
          if [ -f "$RUNNER_TEMP/IdentityAtlas-azure-${VERSION}.zip" ]; then
            ASSETS+=("$RUNNER_TEMP/IdentityAtlas-azure-${VERSION}.zip")
          fi
          gh release create "$TAG" \
            "${ASSETS[@]}" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --latest

      - name: Post run summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ✅ Release tagged

          | | |
          |---|---|
          | **Tag** | \`${TAG}\` |
          | **Version** | \`${VERSION}.0\` |
          | **Commit** | \`$(git rev-parse --short HEAD)\` |

          docker-publish is now building \`:latest\` + \`:${VERSION}.0\` — check the [Actions tab](../../actions) for progress.

          ### Hotfix workflow (if a bug is found in this release)
          \`\`\`bash
          git checkout -b bugfixes/fix-foo ${TAG}   # branch from the tag, not main
          # fix the bug, commit, push
          git push origin bugfixes/fix-foo
          # then run Actions → Cut Hotfix
          \`\`\`
          EOF
