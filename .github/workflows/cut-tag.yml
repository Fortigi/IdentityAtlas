# ─── Cut a tag (shared by Cut Release, Cut Hotfix and Cut Beta) ───────────────
# The one body of the three cut-* workflows: check the ref is on main, tag it,
# build the portable ZIPs and the Azure package, write the release notes and
# create the GitHub release. The entry workflows keep their own triggers,
# inputs, release-notes prompt and run summary, and call this with `kind`:
#
#   release   vX.Y.Z on main; --latest; for X.Y.0 also starts release/X.Y
#   hotfix    vX.Y.Z on the release line; --latest; notes from its fragments
#   beta      vX.Y.Z-beta.N (or -rc / -alpha); --prerelease
#
# A reusable workflow, not a composite action: an action is loaded from the
# checked-out ref, and a hotfix checks out an older release line that may not
# have it. A called workflow is read from the caller's own commit.
#
# BOT_PRIVATE_KEY is not passed in: the job reads it from its own
# release-automation environment, which a caller cannot hand in.
# ─────────────────────────────────────────────────────────────────────────────

name: Cut a tag

on:
  workflow_call:
    inputs:
      kind:
        description: 'release, hotfix or beta'
        type: string
        required: true
      version:
        type: string
        required: true
      ref:
        description: 'Branch, tag or commit to tag'
        type: string
        required: true
      mode:
        description: 'Assert-ReleaseFromMain.ps1 mode: Release or Hotfix'
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
      notes_prompt:
        description: 'What the model is told to do with release-notes.md'
        type: string
        required: true
    # Named, never `secrets: inherit` (releaseKeyEnvironment.guard.test.js).
    secrets:
      BOT_APP_ID:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
    outputs:
      tag:
        value: ${{ jobs.cut.outputs.tag }}
      commit:
        value: ${{ jobs.cut.outputs.commit }}
      line:
        description: 'release/X.Y, when this run started it'
        value: ${{ jobs.cut.outputs.line }}

jobs:
  cut:
    runs-on: ubuntu-latest
    # The release App key lives in this environment, which only admits runs on main or a
    # release/* branch — a workflow file edited on a PR branch cannot read it.
    environment: release-automation
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
      line: ${{ steps.line.outputs.line }}

    steps:
      - name: Validate version input
        env:
          KIND: ${{ inputs.kind }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$KIND" in
            release) PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$';                       EXAMPLE='Major.Minor.Patch format (e.g. 5.2.0)' ;;
            hotfix)  PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$';                       EXAMPLE='Major.Minor.Patch format (e.g. 5.2.1)' ;;
            beta)    PATTERN='^[0-9]+\.[0-9]+\.[0-9]+-(beta|rc|alpha)\.[0-9]+$'; EXAMPLE='Major.Minor.Patch-(beta|rc|alpha).N format (e.g. 5.3.0-beta.1)' ;;
            *) echo "::error::Unknown kind '$KIND' (release, hotfix or beta)."; exit 1 ;;
          esac
          if ! echo "$VERSION" | grep -qE "$PATTERN"; then
            echo "::error::Version must be in $EXAMPLE"
            exit 1
          fi

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      # The workflow file runs from the ref it was dispatched on (main by
      # default) but builds the checked-out branch. An older release branch
      # lacks the shared files below, so check before the tag is pushed rather
      # than fail halfway with a tag and Docker images but no GitHub release.
      - name: Check the branch has the files this workflow calls
        if: inputs.kind == 'hotfix'
        env:
          BRANCH: ${{ inputs.ref }}
        run: |
          missing=0
          for f in .github/scripts/build_portable_zips.sh \
                   .github/scripts/release_prev_tag.sh \
                   tools/release-notes/dependency-delta.py \
                   tools/release-notes/portable-downloads.md; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing on $BRANCH: that release predates the hotfix tooling and cannot be hotfixed by this workflow."
              missing=1
            fi
          done
          exit $missing

      # Only code already merged to main (approved PR) may be released. Loaded
      # from this workflow's own commit, never from the ref being released.
      # Hotfix mode checks a release line: every commit after the stable tag is
      # on main or a clean cherry-pick -x of one.
      - name: Refuse a ref that is not on main
        env:
          KIND: ${{ inputs.kind }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$KIND" in
            release) TITLE="Cut Release" ;;
            hotfix)  TITLE="Cut Hotfix" ;;
            *)       TITLE="Cut Beta" ;;
          esac
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run $TITLE from main (it ran from $GITHUB_REF)."; exit 1
          fi
          case "$MODE" in
            Release|Hotfix) ;;
            *) echo "::error::Unknown mode '$MODE' (Release or Hotfix)."; exit 1 ;;
          esac
          git show "$GITHUB_WORKFLOW_SHA:tools/release/Assert-ReleaseFromMain.ps1" > "$RUNNER_TEMP/assert.ps1"
          pwsh -NoProfile -File "$RUNNER_TEMP/assert.ps1" -Mode "$MODE" -Ref HEAD

      - name: Create and push the tag
        id: tag
        env:
          KIND: ${{ inputs.kind }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          case "$KIND" in
            release) MESSAGE="Release $TAG" ;;
            hotfix)  MESSAGE="Hotfix release $TAG" ;;
            *)       MESSAGE="Pre-release $TAG" ;;
          esac
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$MESSAGE"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run: $TAG is tagged on the runner only, not pushed."
          else
            git push origin "$TAG"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          COMMIT=$(git rev-parse --short HEAD)
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "✅ Tagged ${TAG} on ${COMMIT}"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Stamp the version into .psd1
        if: inputs.kind != 'beta'
        run: sed -i "s/ModuleVersion = '[^']*'/ModuleVersion = '${{ env.VERSION }}.0'/" setup/IdentityAtlas.psd1

      # ModuleVersion must stay a System.Version or Import-Module refuses the
      # manifest and every portable worker job fails, so 6.2.0-beta.1 is stamped
      # as ModuleVersion 6.2.0 + PSData.Prerelease beta.1 (app/api/src/version.js
      # joins them back). Loaded from this workflow's own commit, like the checks
      # above, so a release-line ref without the script is still stamped.
      - name: Stamp the pre-release version into .psd1
        if: inputs.kind == 'beta'
        run: |
          git show "$GITHUB_WORKFLOW_SHA:tools/release/Set-ManifestVersion.ps1" > "$RUNNER_TEMP/stamp-version.ps1"
          pwsh -NoProfile -File "$RUNNER_TEMP/stamp-version.ps1" -Path setup/IdentityAtlas.psd1 -Version "${VERSION}"

      - name: Install desktop dependencies (PGlite)
        run: npm install --prefer-offline
        working-directory: app/desktop

      # Two ZIPs: the default (PGlite, signed node.exe only) and -postgres
      # (embedded PostgreSQL for large data sets, unsigned binaries).
      - name: Build portable Windows ZIPs
        run: bash .github/scripts/build_portable_zips.sh

      # The Azure template, pinned to THIS release's images: azure/ at this tag
      # with imageTag defaulting to the image version, attached to the release as
      # IdentityAtlas-azure-<version>.zip. Loaded from this workflow's own commit
      # (like the main-only check), so an older hotfix branch without the script
      # is still packaged; a template from before imageTag gets no package.
      # The image version is the one docker-publish pushes: X.Y.Z.0 for a
      # release, the version itself for a pre-release.
      - name: Package the Azure template
        env:
          KIND: ${{ inputs.kind }}
        run: |
          IMAGE_VERSION="${VERSION}.0"
          if [ "$KIND" = "beta" ]; then IMAGE_VERSION="${VERSION}"; fi
          git show "$GITHUB_WORKFLOW_SHA:tools/release/New-AzureTemplatePackage.ps1" > "$RUNNER_TEMP/package-azure.ps1"
          pwsh -NoProfile -File "$RUNNER_TEMP/package-azure.ps1" -Version "${IMAGE_VERSION}" -OutFile "$RUNNER_TEMP/IdentityAtlas-azure-${VERSION}.zip"

      - name: Generate release notes
        env:
          KIND: ${{ inputs.kind }}
        run: |
          # The release this one follows. A release or hotfix follows the previous
          # stable one (shared script: see it for why the "globally latest tag" and
          # "same series only" rules were each wrong). A pre-release follows the
          # latest release of any kind (beta, rc, stable), not the tag just created.
          if [ "$KIND" = "beta" ]; then
            PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          else
            PREV_TAG=$(bash .github/scripts/release_prev_tag.sh "$TAG")
          fi

          # Strip "## Changes in this PR" headers; collapse consecutive blank lines
          clean() {
            grep -v '^## Changes in this PR$' \
              | awk 'BEGIN{blank=1} /^[[:space:]]*$/{if(!blank){print ""; blank=1}; next} {blank=0; print}'
          }

          # A hotfix reads the unmerged changes/*.md fragments on its branch first:
          # bump-version hasn't run there, so they aren't in CHANGES.md.
          BULLETS=""
          if [ "$KIND" = "hotfix" ]; then
            BULLETS=$(find changes/ -name '*.md' -not -name 'TEMPLATE*' 2>/dev/null \
              | sort | xargs cat 2>/dev/null | clean)
          fi

          # Otherwise CHANGES.md since PREV_TAG. bump-version.yml always prepends,
          # so old content is the last N lines. A hotfix without a previous stable
          # tag gets no bullets rather than the whole file.
          if [ -z "$BULLETS" ]; then
            if [ -n "$PREV_TAG" ]; then
              OLD_LINES=$(git show "${PREV_TAG}:CHANGES.md" 2>/dev/null | wc -l)
              TOTAL_LINES=$(wc -l < CHANGES.md)
              NEW_LINES=$((TOTAL_LINES - OLD_LINES))
              if [ "$NEW_LINES" -gt 0 ]; then
                BULLETS=$(head -n "$NEW_LINES" CHANGES.md | clean)
              fi
            elif [ "$KIND" != "hotfix" ]; then
              BULLETS=$(clean < CHANGES.md)
            fi
          fi

          {
            [ "$KIND" = "beta" ] && printf '> **Pre-release** — For evaluation only; do not use in production.\n\n'
            printf '## Changes'
            [ -n "$PREV_TAG" ] && printf ' since %s' "$PREV_TAG"
            printf '\n\n%s\n' "$BULLETS"
            [ -n "$PREV_TAG" ] && printf '\n**Full Changelog:** https://github.com/${{ github.repository }}/compare/%s...%s\n' \
              "$PREV_TAG" "$TAG"
          } > release-notes.md
          echo "PREV_TAG=${PREV_TAG}" >> "$GITHUB_ENV"
          echo "--- release-notes.md raw preview ---"
          cat release-notes.md

      - name: Synthesize release notes with Claude
        if: ${{ !inputs.dry_run }}
        id: polish
        continue-on-error: true
        # continue-on-error: this step only polishes wording — release-notes.md already has valid,
        # ready-to-ship content from the deterministic step above. A rejected/unentitled model call
        # (see dor-agent.yml) must never block cutting a release; worst case we ship the raw bullets.
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Read,Write"
          prompt: ${{ inputs.notes_prompt }}

      - name: Warn if release notes weren't polished
        if: steps.polish.outcome == 'failure'
        run: echo "::warning::Release notes polishing failed (model call rejected/unavailable) — shipping the raw changelog bullets instead. Check CLAUDE_CODE_OAUTH_TOKEN entitlements/subscription status."

      # Dependency deltas cannot reach release-notes.md through the changelog:
      # the PR Hygiene gate's CODE pattern does not cover package-lock.json, so
      # Dependabot PRs merge without a changes/*.md fragment, and the polish step
      # above is told to drop tooling bullets with no user-visible effect — which
      # is how a library bump reads. A library-only patch release would ship
      # notes with nothing under "## Changes", which is the release where an
      # operator most needs to see which version moved. Pre-releases list none.
      #
      # Appended AFTER polishing on purpose: the model cannot drop or reword a
      # section it never sees, so the shipped-dependency list is exact.
      # Which portable ZIP to download is appended after polishing for the same
      # reason: the model cannot drop or reword it.
      - name: Append dependency updates and download guide
        env:
          KIND: ${{ inputs.kind }}
        run: |
          if [ "$KIND" != "beta" ]; then
            python3 tools/release-notes/dependency-delta.py "${PREV_TAG}" "${TAG}" >> release-notes.md
          fi
          cat tools/release-notes/portable-downloads.md >> release-notes.md
          echo "--- release-notes.md final ---"
          cat release-notes.md

      # Publishing the release triggers docs.yml, which deploys the stable docs.
      # Don't deploy them here as well: two pushes to gh-pages race and one fails.
      - name: Create GitHub release with portable ZIPs
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          KIND: ${{ inputs.kind }}
        run: |
          CHANNEL=--latest
          if [ "$KIND" = "beta" ]; then CHANNEL=--prerelease; fi
          ASSETS=(app/api/dist-node-launcher/release/IdentityAtlas-portable.zip
                  app/api/dist-node-launcher/release/IdentityAtlas-portable-postgres.zip)
          if [ -f "$RUNNER_TEMP/IdentityAtlas-azure-${VERSION}.zip" ]; then
            ASSETS+=("$RUNNER_TEMP/IdentityAtlas-azure-${VERSION}.zip")
          fi
          gh release create "$TAG" \
            "${ASSETS[@]}" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "$CHANNEL"

      # A new minor (X.Y.0) becomes the one maintained stable line: release/X.Y
      # from this tag, where Dependabot lands weekly updates that the weekly
      # stable route releases as X.Y.1, X.Y.2 … Dependabot is moved over by a
      # pull request into main (main takes nothing without one); until it is
      # merged the new line gets no updates and the weekly plan warns.
      # The previous line simply stops: only the newest minor is maintained.
      - name: Start the release line
        id: line
        if: inputs.kind == 'release' && endsWith(inputs.version, '.0') && !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          LINE="release/${VERSION%.*}"
          echo "line=$LINE" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$LINE" >/dev/null; then
            echo "::notice::$LINE already exists; leaving it as it is."
          else
            git push origin "HEAD:refs/heads/$LINE"
            echo "::notice::Created $LINE at $TAG."
          fi
          # A worktree of main: this checkout is the tag, with the version
          # stamped into it, and must not be switched.
          PR_BRANCH="chore/dependabot-${LINE//\//-}"
          git fetch --quiet origin main
          git worktree add --quiet -B "$PR_BRANCH" "$RUNNER_TEMP/main" origin/main
          cd "$RUNNER_TEMP/main"
          pwsh -NoProfile -File tools/release/Set-DependabotReleaseLine.ps1 -Line "$LINE"
          if git diff --quiet; then
            echo "::notice::.github/dependabot.yml already targets $LINE."; exit 0
          fi
          git commit -qam "chore: point Dependabot's release-line updates at $LINE"
          git push --force origin "HEAD:refs/heads/$PR_BRANCH"
          if ! gh pr create --base main --head "$PR_BRANCH" \
               --title "chore: point Dependabot's release-line updates at $LINE" \
               --body "Cut Release cut ${TAG} and created \`$LINE\`. This moves the release-line entries in \`.github/dependabot.yml\` there, so the new stable line gets its weekly dependency updates and the previous one stops. Opened by Cut Release; see docs/contributing/release-process.md → Release lines."; then
            echo "::warning::Could not open the pull request for $PR_BRANCH; open it by hand."
          fi
