# Deploys the marketing landing page (site/) to Azure Static Web Apps.
#
# One-time setup before this can run:
#   1. Create a Static Web App in your Azure subscription (free tier is fine).
#   2. Copy its deployment token into a repo secret named
#      AZURE_STATIC_WEB_APPS_API_TOKEN.
#   3. In the Azure portal → Custom domains, add identityatlas.io (and
#      identityatlas.ai as a redirect), then point DNS at the SWA hostname.
#
# Until the secret exists this workflow is manual-only (workflow_dispatch) so it
# never fails a normal merge. Once configured, uncomment the `push` trigger to
# auto-deploy when site/** changes land on main.
name: Deploy site (Azure Static Web Apps)

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['site/**', '.github/workflows/deploy-site.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: 'site'      # static content root (index.html lives here)
          skip_app_build: true      # no build step — plain static files
          skip_api_build: true
