# ─── Migration immutability gate ─────────────────────────────────────────────
# Enforces the rule "never edit an existing migration — add a new file." The
# migration runner tracks applied files by name only (no checksum), so a silent
# edit to an applied migration would never re-run and would diverge environments.
# This gate hashes every app/api/src/db/migrations/*.sql against a committed
# baseline (.ci/migration-hashes.json) and fails on any change or deletion.
# See tools/migrations/ratchet.py.
# ─────────────────────────────────────────────────────────────────────────────
name: Migration immutability gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/src/db/migrations/**'
      - '.ci/migration-hashes.json'
      - 'tools/migrations/**'
  workflow_dispatch:

concurrency:
  group: migration-immutability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Migration immutability gate
    runs-on: ubuntu-latest   # git + python3 are preinstalled on the GitHub runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validate the gate logic (Python) before it gates anything.
      - name: Test the gate logic
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/migrations/test_ratchet.py -q

      - name: Run migration immutability gate
        run: python3 tools/migrations/ratchet.py
