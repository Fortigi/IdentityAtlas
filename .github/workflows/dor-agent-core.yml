name: DoR agent core (authorize → fetch → reason → post)

# The shared body of the two spec-side DoR agents: dor-agent.yml (features: interview + probe) and
# dor-bug-agent.yml (bugs: reproduce + probe). Each entry keeps its own triggers, concurrency, the
# label gate that decides whether it acts at all, and its prompt; this file is everything after that.
#
# EXECUTION MODEL — a deterministic split, to contain prompt injection on a PUBLIC repo where
# issue/comment content is attacker-controllable:
#   1. FETCH  (deterministic)  — read the issue thread + backlog into files.
#   2. REASON (LLM, sandboxed) — claude-code-action with Read/Grep/Glob + Edit(.dor/out/**) ONLY:
#      no shell, no gh, no network. The model reads those files + the repo and writes its decision
#      to output files. Without a shell it cannot curl/gh to exfiltrate the subscription token in its env.
#   3. POST   (deterministic)  — the shared dor_post_decision.sh: validate the chosen label against a
#      fixed allow-list, scan the output for the token (egress filter), then post the comment + set
#      the one label + sync the board Status.
# Documented residual: the model's Read tool could in principle reach /proc/self/environ; the
# step-3 egress scan catches a *literal* leak. An *encoded* leak is the residual that only a
# raw-API script with path-restricted tools fully closes — see operationalization.md idea 2/roadmap.
#
# A reusable workflow, not a composite action: it is read from the run's commit before anything
# executes, so the model's Edit tool cannot rewrite it mid-run, and each job keeps its own
# permissions. Secrets are passed by name, never `secrets: inherit`.

on:
  workflow_call:
    inputs:
      title:
        description: 'What the reasoning step does, for its step names (e.g. "interview + probe")'
        type: string
        required: true
      prompt:
        description: 'The reasoning prompt; the opus-5 retry gets the same one'
        type: string
        required: true
      require_contract:
        description: 'A certified route must come with .dor/out/contract.json (bugs)'
        type: boolean
        default: false
    # Not `required`: a missing secret then fails the step that uses it, as it did before the
    # agents shared this file, instead of refusing the whole call.
    secrets:
      DOR_BOT_APP_ID:
        required: false
      DOR_BOT_PRIVATE_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions: {}

jobs:
  # ── Gate: no model secret in scope here. Must pass before the agent runs. ──
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-member: ${{ steps.auth.outputs.is-member }}
    steps:
      - name: Checkout the authorize action only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/dor-authorize
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Require Fortigi org membership
        id: auth
        uses: ./.github/actions/dor-authorize
        with:
          app-id: ${{ secrets.DOR_BOT_APP_ID }}
          private-key: ${{ secrets.DOR_BOT_PRIVATE_KEY }}
          actor: ${{ github.actor }}

  # ── The agent: fetch → reason (sandboxed) → post (validated). Runs only if authorize passed. ──
  agent:
    needs: authorize
    if: needs.authorize.outputs.is-member == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read      # read the repo + schema (+ demo data) for the probe
      issues: write       # (native steps only) post the comment + set the one state:* label
      id-token: write     # claude-code-action OIDC (matches the repo's other claude workflows)
    steps:
      - name: Checkout repo (for the probe to read live code + schema + demo data)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Mint a Members:read token (who counts as a trusted commenter)
        id: members
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DOR_BOT_APP_ID }}
          private-key: ${{ secrets.DOR_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-members: read

      # 1. FETCH (deterministic, read-only) — issue thread + backlog into files for the agent.
      # The thread holds ONLY text by the requestor of record, org members, the author of a vouched
      # issue and the pipeline's bots — the same filter the build agent reads through. This repo is
      # public, so anyone can comment on an issue after it was vouched; this agent posts its summary
      # as a pipeline bot, which the build agent trusts, so an unfiltered thread here would launder a
      # stranger's text into the build spec (SEC-2026-11 F-53).
      - name: Fetch issue thread (trusted authors only) + backlog
        env:
          GH_TOKEN: ${{ github.token }}
          MEMBERS_TOKEN: ${{ steps.members.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .dor/in .dor/out
          REQUESTOR="$(bash .github/scripts/dor_requestor_of_record.sh "$ISSUE")"
          REQUESTOR="$REQUESTOR" bash .github/scripts/dor_trusted_spec.sh "$ISSUE" > .dor/in/issue.json
          gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title,labels > .dor/in/backlog.json

      # 2. REASON (LLM, sandboxed) — Read/Grep/Glob + Edit(.dor/out/**) ONLY. No GH_TOKEN in this step's env;
      #    no shell/gh/network tool, so untrusted issue content cannot shell out or exfiltrate the
      #    subscription token. The model's only outputs are the files it writes.
      - name: DoR ${{ inputs.title }} (reasoning only)
        id: reason
        continue-on-error: true
        # continue-on-error + the retry step below is a workflow-level try/catch: `--fallback-model`
        # only rescues an *overloaded* primary model (529) — it does NOT rescue a model the token isn't
        # entitled to call at all (e.g. Fable 5 requires an active Max subscription; a lapsed one gets a
        # hard permission/entitlement error). That failure mode instant-fails this step (is_error:true,
        # ~1 turn, no tool use) with nothing in .dor/out, so the pipeline stalls silently (saw this on
        # #1085 after the Max window lapsed 2026-08-19 — every reasoning attempt from then on failed the
        # same way and no route was ever chosen). The retry step immediately below detects that exact
        # failure via `steps.reason.outcome` and redoes the SAME reasoning with claude-opus-5, which
        # needs no Max plan.
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Model: Fable 5 by default (Max-only on subscription); set repo var DOR_PROBE_MODEL to
          # claude-opus-5 when off the Max plan. Tools: read anything + create/edit files under .dor/out only.
          # NB: file-permission rules only match Edit(path)/Read(path) — a Write(path) rule is accepted but
          # NEVER matched by Claude Code, so it silently denies every write. Use Edit() to scope file output;
          # the Edit tool creates new files (and parent dirs) too. See permissions docs (v2.1.210+).
          claude_args: "--model ${{ vars.DOR_PROBE_MODEL || 'claude-fable-5' }} --fallback-model claude-opus-5 --allowedTools Read,Grep,Glob,Edit(.dor/out/**)"
          prompt: ${{ inputs.prompt }}

      # 2b. RETRY (LLM, sandboxed, same contract as above) — only runs if the primary attempt hard-failed
      #     (e.g. Fable 5 rejected outright because the Max subscription lapsed). Always uses claude-opus-5,
      #     which needs no Max plan, so the pipeline self-heals without anyone having to notice the
      #     subscription state and flip the DOR_PROBE_MODEL repo variable by hand.
      - name: DoR ${{ inputs.title }} (opus-5 retry — primary model unavailable)
        id: reason_fallback
        if: steps.reason.outcome == 'failure'
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5 --allowedTools Read,Grep,Glob,Edit(.dor/out/**)"
          prompt: ${{ inputs.prompt }}

      # 3. POST (deterministic) — the ONLY step that writes to GitHub. Validates the label against a
      #    fixed allow-list and scans the agent output for a leaked token before posting.
      # Mint a board-scoped token AFTER the reasoning step, so the LLM step never sees it.
      - name: Mint BOT token for the board write
        id: board-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DOR_BOT_APP_ID }}
          private-key: ${{ secrets.DOR_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-projects: write
          permission-issues: write         # read: dor_set_status.sh needs the issue node id. write: the
                                           # awaiting-approval label is set AS THE APP, so the value-gate
                                           # cascade fires (a github.token label edit triggers nothing)
      # Undo any workspace tampering by the (Edit-capable) reasoning step BEFORE we execute any repo
      # script: restore all tracked .github files to their committed state. Closes the "model writes a
      # malicious dor_set_status.sh, and the post step executes it with tokens in env" escalation —
      # even if the Edit(.dor/out/**) path-scope is not honoured by the CLI, this guarantees the
      # executed helper is the committed one. (Edits to .dor/out are intentional and handled as DATA below.)
      - name: Restore repo scripts (defuse Write→exec)
        run: git restore --source=HEAD --staged --worktree -- .github

      - name: Post the agent's decision
        # Only when a reasoning step actually produced output. With both models failed there is no
        # route.txt, and running this step anyway would fail it on the missing file — which would
        # again skip the diagnostic below, and would report a token outage under the wrong headline.
        if: steps.reason.outcome == 'success' || steps.reason_fallback.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_TOKEN: ${{ steps.board-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          # A clean gh config dir, so a model-planted alias in ~/.config/gh can't run under our gh calls.
          GH_CONFIG_DIR: ${{ runner.temp }}/dor-ghcfg
          # Present ONLY so this deterministic step can scan the agent output for leaked tokens.
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bugs: certifying one commits us to an autonomous code change, so it needs the contract.
          REQUIRE_CONTRACT: ${{ inputs.require_contract }}
          # No board override needed: dor_set_status.sh routes on the issue's `bug` label.
        # Route allow-list + egress token-scan + comment/label/board-sync.
        run: bash .github/scripts/dor_post_decision.sh

      # Both attempts failing means .dor/out/route.txt never got written. The post step above skips
      # itself in that case, so without this the job would end GREEN having done nothing at all. Turn
      # it into a loud, searchable red run that names the likely cause, instead of a stalled issue
      # nobody notices until the hourly health sweep flags it.
      - name: Fail loudly if neither model produced a decision
        if: steps.reason.outcome == 'failure' && steps.reason_fallback.outcome == 'failure'
        run: |
          echo "::error::Both claude-fable-5 and the claude-opus-5 retry failed to reason about issue #${{ github.event.issue.number }} — check CLAUDE_CODE_OAUTH_TOKEN entitlements/subscription status."
          exit 1
