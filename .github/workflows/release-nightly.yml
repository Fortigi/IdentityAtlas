# ─── Release nightly ──────────────────────────────────────────────────────────
# Once a night, decide what to release-test and test it:
#
#   * a pre-release (beta/rc) ahead of the newest stable release that has not
#     been tested yet  -> the full release test, Azure included
#   * otherwise        -> Docker and portable against :edge only, as an early
#                         warning; nights without a candidate cost nothing in Azure
#
# The decision is tools/release/Get-NightlyPlan.ps1 (unit-tested in
# test/unit/ReleaseNightly.Tests.ps1). A tested candidate leaves an artifact
# named release-tested-<tag>, green or red, so it is tested once; to test it
# again, run this workflow by hand with that tag as `candidate`.
#
# The SECURITY ROUTE runs alongside, independently: Dependabot fixes for
# security alerts (labelled security-fix by dependabot-security-label.yml) that
# were merged to main but are in no release yet go to stable as ONE hotfix:
#
#   security-plan    which fixes, which version (tools/release/Get-SecurityHotfixPlan.ps1)
#   security-branch  bugfixes/security-hotfix-<date> from the newest stable tag,
#                    `git cherry-pick -x` of each merge commit in merge order
#   security-beta    Cut Beta (hotfix mode) -> v<next patch>-beta.N, :beta
#   security-images  wait until docker-publish has pushed that beta's images
#   security-test    the release test of that beta, Azure included
#   security-hotfix  Cut Hotfix -> v<next patch>, :latest — only if the test is green
#   security-finish  delete the branch (released), or keep it and open one issue
#
# Anything red publishes nothing further and keeps the branch; while a
# security-hotfix branch exists the route starts nothing new.
# dry_run (manual runs only; on by default there) does everything except push
# tags, open issues and delete branches — so no beta exists to test, and the
# image wait and the release test are skipped.
#
# 02:07 UTC = 03:07 in Amsterdam in winter (04:07 in summer). Not on the hour:
# GitHub delays top-of-hour schedules, sometimes by much more than 7 minutes.
# ─────────────────────────────────────────────────────────────────────────────

name: Release nightly

on:
  schedule:
    - cron: '7 2 * * *'
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Test this tag (or edge) instead of deciding. Empty = decide as the night does.'
        type: string
        default: ''
      dry_run:
        description: 'Security route: do everything except push tags, open issues or delete branches'
        type: boolean
        default: true

# One night at a time; a run that is still going is never cancelled by the next.
concurrency:
  group: release-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: 'Plan: what to test tonight'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read      # does the newest beta have its release-tested-<tag> artifact?
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      azure: ${{ steps.plan.outputs.azure }}
      marker: ${{ steps.plan.outputs.marker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Decide
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.candidate }}
        run: ./tools/release/Get-NightlyPlan.ps1 -Repository $env:GITHUB_REPOSITORY -Override "$env:OVERRIDE"

  release-test:
    name: 'Test ${{ needs.plan.outputs.candidate }}'
    needs: plan
    permissions:
      contents: read
      id-token: write    # the sign-in and Azure jobs log in with GitHub OIDC
    uses: ./.github/workflows/release-test.yml
    with:
      candidate: ${{ needs.plan.outputs.candidate }}
      azure: ${{ needs.plan.outputs.azure == 'true' }}

  mark-tested:
    name: 'Record that ${{ needs.plan.outputs.candidate }} was tested'
    needs: [plan, release-test]
    if: >-
      always() && needs.plan.outputs.marker != '' &&
      (needs.release-test.result == 'success' || needs.release-test.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Write the record
        env:
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
          RESULT: ${{ needs.release-test.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: printf '{"candidate":"%s","result":"%s","run":"%s"}\n' "$CANDIDATE" "$RESULT" "$RUN" > tested.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ needs.plan.outputs.marker }}
          path: tested.json
          retention-days: 90

  # ═══ Security route ════════════════════════════════════════════════════
  security-plan:
    name: 'Security: fixes on main not yet released'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      stable: ${{ steps.plan.outputs.stable }}
      version: ${{ steps.plan.outputs.version }}
      beta: ${{ steps.plan.outputs.beta }}
      branch: ${{ steps.plan.outputs.branch }}
      commits: ${{ steps.plan.outputs.commits }}
      prs: ${{ steps.plan.outputs.prs }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Scheduled runs are real; a manual run is a dry run unless unticked.
      - name: Dry run or not
        id: mode
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "dry_run=$([ "$DRY" = "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Decide
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/release/Get-SecurityHotfixPlan.ps1 -Repository $env:GITHUB_REPOSITORY

  security-branch:
    name: 'Security: build ${{ needs.security-plan.outputs.branch }}'
    needs: security-plan
    if: needs.security-plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write    # push the branch (a GITHUB_TOKEN push triggers no other workflow)
    outputs:
      reason: ${{ steps.build.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cherry-pick the fixes onto ${{ needs.security-plan.outputs.stable }}
        id: build
        shell: pwsh
        env:
          STABLE: ${{ needs.security-plan.outputs.stable }}
          BRANCH: ${{ needs.security-plan.outputs.branch }}
          COMMITS: ${{ needs.security-plan.outputs.commits }}
          PRS: ${{ needs.security-plan.outputs.prs }}
        run: ./tools/release/New-SecurityHotfix.ps1 -StableTag $env:STABLE -Branch $env:BRANCH -Commits $env:COMMITS -PullRequests $env:PRS

  security-beta:
    name: 'Security: cut ${{ needs.security-plan.outputs.beta }}'
    needs: [security-plan, security-branch]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/cut-beta.yml
    with:
      version: ${{ needs.security-plan.outputs.beta }}
      ref: ${{ needs.security-plan.outputs.branch }}
      hotfix: true
      dry_run: ${{ needs.security-plan.outputs.dry_run == 'true' }}
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  security-images:
    name: 'Security: wait for the ${{ needs.security-plan.outputs.beta }} images'
    needs: [security-plan, security-beta]
    if: needs.security-plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for docker-publish
        shell: pwsh
        env:
          BETA: ${{ needs.security-plan.outputs.beta }}
        run: |
          . ./tools/release/ReleaseTest.Functions.ps1
          . ./tools/release/SecurityHotfix.Functions.ps1
          Wait-ImagePublished -Tag $env:BETA -TimeoutSec 4500

  security-test:
    name: 'Security: test v${{ needs.security-plan.outputs.beta }}'
    needs: [security-plan, security-images]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-test.yml
    with:
      candidate: v${{ needs.security-plan.outputs.beta }}
      azure: true

  security-hotfix:
    name: 'Security: cut v${{ needs.security-plan.outputs.version }}'
    needs: [security-plan, security-beta, security-test]
    # A dry run has no beta images, so its test is skipped; everything else
    # needs the release test green.
    if: >-
      always() && needs.security-beta.result == 'success' &&
      (needs.security-test.result == 'success' ||
       (needs.security-plan.outputs.dry_run == 'true' && needs.security-test.result == 'skipped'))
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/cut-hotfix.yml
    with:
      branch: ${{ needs.security-plan.outputs.branch }}
      version: ${{ needs.security-plan.outputs.version }}
      dry_run: ${{ needs.security-plan.outputs.dry_run == 'true' }}
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  security-finish:
    name: 'Security: clean up or report'
    needs: [security-plan, security-branch, security-beta, security-images, security-test, security-hotfix]
    if: always() && needs.security-plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write    # delete the branch after a release
      issues: write      # one issue when the route fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record that the beta was tested
        if: needs.security-test.result == 'success' || needs.security-test.result == 'failure'
        run: printf '{"candidate":"v%s","result":"%s"}\n' "$BETA" "$RESULT" > tested.json
        env:
          BETA: ${{ needs.security-plan.outputs.beta }}
          RESULT: ${{ needs.security-test.result }}
      - if: needs.security-test.result == 'success' || needs.security-test.result == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-tested-v${{ needs.security-plan.outputs.beta }}
          path: tested.json
          retention-days: 90
      - name: Delete the branch, or open an issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: >-
            {"branch":"${{ needs.security-branch.result }}","beta":"${{ needs.security-beta.result }}",
             "images":"${{ needs.security-images.result }}","test":"${{ needs.security-test.result }}",
             "hotfix":"${{ needs.security-hotfix.result }}"}
          BETA: ${{ needs.security-plan.outputs.beta }}
          VERSION: ${{ needs.security-plan.outputs.version }}
          BRANCH: ${{ needs.security-plan.outputs.branch }}
          BRANCH_REASON: ${{ needs.security-branch.outputs.reason }}
          DRY_RUN: ${{ needs.security-plan.outputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./tools/release/Complete-SecurityHotfix.ps1 -Results $env:RESULTS -Beta $env:BETA -Version $env:VERSION `
            -Branch $env:BRANCH -RunUrl $env:RUN_URL -BranchReason "$env:BRANCH_REASON" -DryRun:($env:DRY_RUN -eq 'true')
