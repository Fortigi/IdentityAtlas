# ─── Publish test coverage to the docs ───────────────────────────────────────
# On every push to main that touches source or tests, this workflow:
#   1. Runs each test suite with coverage:
#        - API  (app/api)  → Vitest v8, unit + contract → two lcov.info (merged)
#        - UI   (app/ui)   → Vitest v8 → lcov.info
#        - Pester (test/unit) → JaCoCo XML
#   2. Converts each suite to a consistent browsable HTML report + a
#      machine-readable Summary.json via ReportGenerator, under docs/coverage/.
#   3. Measures code complexity and drops it beside each suite's summary as
#      complexity.json — reusing the SAME measurers the complexity gate uses:
#      tools/complexity/measure_ps.ps1 (PSComplexity) for PowerShell, and
#      tools/complexity/ratchet.py --emit-complexity-json (ESLint + sonarjs) for
#      the API/UI suites. The page surfaces it as avg/max cyclomatic + cognitive
#      columns. (Mutation is the heavier signal, so it is NOT run here: the weekly
#      ps-mutation.yml refreshes docs/coverage/powershell/mutation.json and the
#      weekly js-mutation.yml refreshes the api/ui ones, which this page just reads
#      back — see those workflows.)
#   4. Renders the curated docs page (docs/reference/coverage.md) from those
#      summaries (tools/generate-coverage-doc.py).
#   5. Raises the per-file coverage floors (.ci/coverage-baseline.json) to what
#      main's unit suites now measure — never lowers one (tools/coverage/ratchet.py
#      --update), so a file's gain is locked in without anyone running a command.
#   6. Commits docs/reference/coverage.md + docs/coverage/** (and the raised
#      baseline) back to main. .ci/ is outside this workflow's paths filter, so
#      the commit does not re-trigger it.
#
# Why commit into docs/ rather than publish a one-off artifact: the docs site is
# versioned with mike (edge = main, stable = release tag). Committing the page and
# reports into the docs tree means mike builds them into BOTH versions naturally —
# edge refreshes every merge, a release is frozen at its tag's numbers. The commit
# touches only docs/** so it re-triggers docs.yml (redeploy) but NOT this workflow
# (its paths filter is source/tests only) — no loop — and not docker-publish.yml
# (gated on bump-version). Same protected-main push mechanics as sbom-update.yml:
# the GitHub App token is required (GITHUB_TOKEN can't bypass branch protection),
# and the push rebases-and-retries to absorb bump-version.yml's concurrent commit.
# ─────────────────────────────────────────────────────────────────────────────

name: Publish coverage to docs

on:
  push:
    branches: [main]
    paths:
      - 'app/api/src/**'
      - 'app/ui/src/**'
      - 'tools/crawlers/**'
      - 'tools/powershell-sdk/**'
      - 'tools/riskscoring/**'
      - 'test/unit/**'
      - 'azure/**'
      - 'tools/complexity/**'
      - 'tools/pester/**'
      - '.ci/psmutant.config.json'
      - 'tools/generate-coverage-doc.py'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

concurrency:
  group: coverage-docs-main
  cancel-in-progress: false  # queue, don't drop — each merge's numbers matter

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.bot-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'

      - name: Setup .NET (for ReportGenerator)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      # ── API coverage (Vitest) ──────────────────────────────────────────────
      # The API number reflects BOTH suites: unit tests (mocked DB) and contract
      # tests (real PostgreSQL via testcontainers). They run under separate vitest
      # configs into separate lcov dirs; ReportGenerator merges them below. Without
      # the contract run, route files exercised only end-to-end (matrix/data,
      # contexts, identities, resources, ingest engine, plugin runner) would read
      # as near-zero here even though they're well covered.
      - name: API unit tests with coverage
        working-directory: app/api
        continue-on-error: true  # publish coverage even if a suite has a failure
        run: |
          npm ci
          npm run test:coverage

      - name: API contract tests with coverage
        working-directory: app/api
        continue-on-error: true  # testcontainers spins up postgres:16 on the runner
        run: npm run test:contract -- --coverage

      # ── UI coverage (Vitest) ───────────────────────────────────────────────
      - name: UI tests with coverage
        working-directory: app/ui
        continue-on-error: true
        run: |
          npm ci
          npm run test:coverage

      # ── PowerShell coverage (Pester → JaCoCo) ──────────────────────────────
      # Coverage scope mirrors pr.yml's pester job exactly.
      - name: Pester tests with coverage
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Get-Module Pester -ListAvailable | Where-Object Version -ge '5.0.0')) {
            Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          }
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'test/unit'
          $cfg.Run.PassThru = $true
          $cfg.CodeCoverage.Enabled = $true
          # Measure PRODUCT code only — the same files the PR floor measures, from
          # the one definition both use (what is in and out, and why shared/ is
          # in, is documented on the function).
          . ./tools/pester/PesterShards.ps1
          $cfg.CodeCoverage.Path = Get-PesterCoverageTarget -Root (Get-Location).Path
          $cfg.CodeCoverage.OutputPath = 'pester-coverage.xml'
          $cfg.CodeCoverage.OutputFormat = 'JaCoCo'
          $result = Invoke-Pester -Configuration $cfg
          # Refresh the PR Checks shard weights from this run's per-file times, only
          # when the current ones leave a shard >15% over the mean. .ci/ is outside
          # this workflow's paths, so committing it doesn't re-trigger the run.
          . ./tools/pester/PesterWeights.ps1
          $null = Update-PesterWeightFile -Path .ci/pester-weights.json -Count 4 `
            -Duration (Get-PesterFileDuration -Result $result) `
            -Source "coverage.yml run $env:GITHUB_RUN_ID (one runner, coverage on)"

      # ── Convert each suite to HTML + Summary.json ──────────────────────────
      - name: Install ReportGenerator
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build coverage reports
        run: |
          # gen <slug> <title> <src...> — ReportGenerator merges every input
          # report that exists (union of line hits), so a suite can be fed more
          # than one lcov (the API suite = unit + contract).
          gen() {
            local slug="$1"; local title="$2"; shift 2
            local reports=""
            for src in "$@"; do
              [ -f "$src" ] && reports="${reports:+$reports;}$src"
            done
            if [ -n "$reports" ]; then
              reportgenerator \
                "-reports:$reports" \
                "-targetdir:docs/coverage/$slug" \
                "-reporttypes:Html;JsonSummary" \
                "-sourcedirs:." \
                "-title:$title"
            else
              echo "::warning::No coverage input for $slug — skipping"
            fi
          }
          gen api        "API"        app/api/coverage/lcov.info app/api/coverage-contract/lcov.info
          gen ui         "UI"         app/ui/coverage/lcov.info
          gen powershell "PowerShell" pester-coverage.xml

      # ── PowerShell complexity (avg/max cyclomatic + cognitive columns) ──────
      # Reuses the SAME measurer the complexity gate uses (a thin wrapper over the
      # published PSComplexity module), so the coverage page can never drift from
      # complexity.yml. Emits the per-unit {file,unit,line,cc,cog} array;
      # generate-coverage-doc.py aggregates it to avg/max per suite. Cheap (a few
      # seconds), so it refreshes every merge. Mutation is deliberately NOT run
      # here — the weekly ps-mutation.yml owns docs/coverage/powershell/mutation.json
      # and js-mutation.yml owns docs/coverage/{api,ui}/mutation.json, all of which
      # the render step below reads back. continue-on-error keeps a
      # measurement hiccup from blocking the docs commit, matching the suites above.
      - name: PowerShell complexity
        shell: pwsh
        continue-on-error: true
        run: |
          Install-Module PSComplexity -RequiredVersion 0.5.1 -Force -Scope CurrentUser
          $psDir = 'docs/coverage/powershell'
          New-Item -ItemType Directory -Path $psDir -Force | Out-Null
          & tools/complexity/measure_ps.ps1 | Set-Content (Join-Path $psDir 'complexity.json') -Encoding utf8

      # ── JS/TS complexity (avg/max cyclomatic + cognitive for API + UI) ──────
      # The Node analogue of the PowerShell step above, reusing the SAME measurer
      # the complexity gate uses (tools/complexity/ratchet.py) in its
      # --emit-complexity-json mode: ESLint's `complexity` rule + eslint-plugin-sonarjs
      # at threshold 0, so EVERY product function is scored (not just the gate's
      # over-threshold outliers). node_modules is already installed by the API/UI
      # coverage steps. continue-on-error keeps a hiccup from blocking the commit.
      - name: JS/TS complexity (API + UI)
        continue-on-error: true
        run: |
          mkdir -p docs/coverage/api docs/coverage/ui
          python3 tools/complexity/ratchet.py --emit-complexity-json app/api > docs/coverage/api/complexity.json
          python3 tools/complexity/ratchet.py --emit-complexity-json app/ui > docs/coverage/ui/complexity.json

      # ── Ratchet the per-file floors up ─────────────────────────────────────
      # The PR gate (pr.yml) holds every file at its floor; this raises floors to
      # main's new numbers. Only the UNIT lcov counts — the scope the gate checks.
      # --update never lowers a floor, so a failed or partial suite run (which can
      # only measure less) can't weaken the gate; it just raises nothing.
      # The aggregate Vitest thresholds rise the same way: measured minus 2,
      # rounded down, never lower (tools/coverage/aggregate_floors.py). Neither
      # config is in this workflow's `paths`, so the commit doesn't re-trigger it.
      - name: Raise per-file and aggregate coverage floors
        continue-on-error: true
        run: |
          for scope in api ui; do
            lcov="app/$scope/coverage/lcov.info"
            if [ -s "$lcov" ]; then
              python3 tools/coverage/ratchet.py --lcov "$lcov" --prefix "app/$scope/" --update
            else
              echo "No $lcov — $scope floors left as they are"
            fi
          done
          for pair in api:vitest.config.js ui:vite.config.js; do
            scope="${pair%%:*}"; summary="app/$scope/coverage/coverage-summary.json"
            if [ -s "$summary" ]; then
              python3 tools/coverage/aggregate_floors.py --config "app/$scope/${pair#*:}" --summary "$summary"
            else
              echo "No $summary — $scope aggregate floors left as they are"
            fi
          done

      - name: Render coverage docs page
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 tools/generate-coverage-doc.py
              --coverage-dir docs/coverage
              --out docs/reference/coverage.md
              --commit "$GITHUB_SHA"

      # ── Commit back to main ────────────────────────────────────────────────
      - name: Commit coverage
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reference/coverage.md docs/coverage .ci/pester-weights.json .ci/coverage-baseline.json app/api/vitest.config.js app/ui/vite.config.js
          if git diff --cached --quiet; then
            echo "Coverage unchanged — nothing to commit"
            exit 0
          fi
          msg="docs: update test coverage report"
          if ! git diff --cached --quiet -- .ci/coverage-baseline.json; then
            msg="$msg; raise per-file coverage floors"
          fi
          if ! git diff --cached --quiet -- app/api/vitest.config.js app/ui/vite.config.js; then
            msg="$msg; raise aggregate coverage floors"
          fi
          if ! git diff --cached --quiet -- .ci/pester-weights.json; then
            msg="$msg; rebalance Pester shards"
          fi
          git commit -m "$msg"
          # bump-version.yml may push to main on the same merge — rebase & retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt) — rebasing onto latest main"
            git pull --rebase origin main
          done
          echo "::error::Could not push coverage update after 5 attempts"
          exit 1
