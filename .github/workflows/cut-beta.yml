# ─── Cut a Pre-Release (Beta / RC / Alpha) ────────────────────────────────────
# Manually triggered. Tags a chosen ref with vX.Y.Z-beta.N (or -rc.N /
# -alpha.N), builds the portable Windows ZIP, creates a GitHub pre-release with
# the ZIP attached, and lets docker-publish push :beta + :X.Y.Z-beta.N.
#
# :latest is never touched — users on docker-compose.prod.yml are unaffected.
#
# Usage:
#   1. Go to Actions → Cut Beta → Run workflow
#   2. Enter the version (e.g. "5.3.0-beta.1") and optionally a ref (default: main)
#   3. The workflow creates tag v5.3.0-beta.1 on that ref
#   4. docker-publish builds and pushes :beta + :5.3.0-beta.1
# ─────────────────────────────────────────────────────────────────────────────

name: Cut Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pre-release version (e.g. "5.3.0-beta.1", "5.3.0-rc.1", "5.3.0-alpha.1")'
        required: true
      ref:
        description: 'Branch, tag, or commit to cut from (default: main)'
        required: false
        default: 'main'

jobs:
  cut-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate version input
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-(beta|rc|alpha)\.[0-9]+$'; then
            echo "::error::Version must be in Major.Minor.Patch-(beta|rc|alpha).N format (e.g. 5.3.0-beta.1)"
            exit 1
          fi

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.inputs.ref }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Create and push pre-release tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Pre-release $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "✅ Tagged ${TAG} on $(git rev-parse --short HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Stamp pre-release version into .psd1
        run: sed -i "s/ModuleVersion = '[^']*'/ModuleVersion = '${{ env.VERSION }}'/" setup/IdentityAtlas.psd1

      - name: Install desktop dependencies (PGlite)
        run: npm install --prefer-offline
        working-directory: app/desktop

      - name: Build portable Windows ZIP
        run: npm run build:node-launcher
        working-directory: app/api

      - name: Generate release notes
        run: |
          # Find the previous stable release tag (excludes beta/rc/alpha)
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -v beta | grep -v rc | grep -v alpha | head -1)

          # Slice the CHANGES.md entries that are new since PREV_TAG
          if [ -n "$PREV_TAG" ]; then
            FIRST_OLD=$(git show "${PREV_TAG}:CHANGES.md" 2>/dev/null | head -1)
            if [ -n "$FIRST_OLD" ]; then
              CUTLINE=$(grep -Fn "${FIRST_OLD}" CHANGES.md | head -1 | cut -d: -f1)
              [ -n "$CUTLINE" ] \
                && NEW_MD=$(head -n $((CUTLINE - 1)) CHANGES.md) \
                || NEW_MD=$(cat CHANGES.md)
            else
              NEW_MD=$(cat CHANGES.md)
            fi
          else
            NEW_MD=$(cat CHANGES.md)
          fi

          # Strip "## Changes in this PR" headers; collapse consecutive blank lines
          BULLETS=$(printf '%s\n' "$NEW_MD" \
            | grep -v '^## Changes in this PR$' \
            | awk 'BEGIN{blank=1} /^[[:space:]]*$/{if(!blank){print ""; blank=1}; next} {blank=0; print}')

          {
            printf '> **Pre-release** — For evaluation only; do not use in production.\n\n'
            printf '## Changes'
            [ -n "$PREV_TAG" ] && printf ' since %s' "$PREV_TAG"
            printf '\n\n%s\n' "$BULLETS"
            [ -n "$PREV_TAG" ] && printf '\n**Full Changelog:** https://github.com/${{ github.repository }}/compare/%s...%s\n' \
              "$PREV_TAG" "$TAG"
          } > release-notes.md
          echo "--- release-notes.md preview ---"
          cat release-notes.md

      - name: Create GitHub pre-release with portable ZIP
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh release create "$TAG" \
            app/api/dist-node-launcher/IdentityAtlas-portable.zip \
            --title "$TAG" \
            --notes-file release-notes.md \
            --prerelease

      - name: Post run summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ✅ Pre-release tagged

          | | |
          |---|---|
          | **Tag** | \`${TAG}\` |
          | **Version** | \`${VERSION}\` |
          | **Commit** | \`$(git rev-parse --short HEAD)\` |

          docker-publish is now building \`:beta\` + \`:${VERSION}\` — check the [Actions tab](../../actions) for progress.

          > \`:latest\` is **not** affected. Users on \`docker-compose.prod.yml\` will not receive this build automatically.

          ### To test this pre-release
          \`\`\`yaml
          # docker-compose.override.yml
          services:
            web:
              image: ghcr.io/fortigi/identity-atlas:${VERSION}
            worker:
              image: ghcr.io/fortigi/identity-atlas-worker:${VERSION}
          \`\`\`
          EOF
