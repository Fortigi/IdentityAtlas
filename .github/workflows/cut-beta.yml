# ─── Cut a Pre-Release (Beta / RC / Alpha) ────────────────────────────────────
# Manually triggered. Tags a chosen ref with vX.Y.Z-beta.N (or -rc.N /
# -alpha.N), builds the portable Windows ZIP, creates a GitHub pre-release with
# the ZIP attached, and lets docker-publish push :beta + :X.Y.Z-beta.N.
#
# :latest is never touched — users on docker-compose.prod.yml are unaffected.
#
# Usage:
#   1. Go to Actions → Cut Beta → Run workflow
#   2. Enter the version (e.g. "5.3.0-beta.1") and optionally a ref (default: main)
#   3. The workflow creates tag v5.3.0-beta.1 on that ref
#   4. docker-publish builds and pushes :beta + :5.3.0-beta.1
# ─────────────────────────────────────────────────────────────────────────────

name: Cut Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pre-release version (e.g. "5.3.0-beta.1", "5.3.0-rc.1", "5.3.0-alpha.1")'
        required: true
      ref:
        description: 'Branch, tag, or commit to cut from (default: main)'
        required: false
        default: 'main'

jobs:
  cut-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Validate version input
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-(beta|rc|alpha)\.[0-9]+$'; then
            echo "::error::Version must be in Major.Minor.Patch-(beta|rc|alpha).N format (e.g. 5.3.0-beta.1)"
            exit 1
          fi

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Create and push pre-release tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Pre-release $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "✅ Tagged ${TAG} on $(git rev-parse --short HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Stamp pre-release version into .psd1
        run: sed -i "s/ModuleVersion = '[^']*'/ModuleVersion = '${{ env.VERSION }}'/" setup/IdentityAtlas.psd1

      - name: Install desktop dependencies (PGlite)
        run: npm install --prefer-offline
        working-directory: app/desktop

      - name: Build portable Windows ZIP
        run: npm run build:node-launcher
        working-directory: app/api

      - name: Generate release notes
        run: |
          # Latest release of any kind (beta, rc, stable) — excludes the tag just created
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -1)

          # Slice CHANGES.md to only the lines prepended since PREV_TAG.
          # bump-version.yml always prepends — old content is the last N lines.
          if [ -n "$PREV_TAG" ]; then
            OLD_LINES=$(git show "${PREV_TAG}:CHANGES.md" 2>/dev/null | wc -l)
            TOTAL_LINES=$(wc -l < CHANGES.md)
            NEW_LINES=$((TOTAL_LINES - OLD_LINES))
            [ "$NEW_LINES" -gt 0 ] && NEW_MD=$(head -n "$NEW_LINES" CHANGES.md) || NEW_MD=""
          else
            NEW_MD=$(cat CHANGES.md)
          fi

          # Strip "## Changes in this PR" headers; collapse consecutive blank lines
          BULLETS=$(printf '%s\n' "$NEW_MD" \
            | grep -v '^## Changes in this PR$' \
            | awk 'BEGIN{blank=1} /^[[:space:]]*$/{if(!blank){print ""; blank=1}; next} {blank=0; print}')

          {
            printf '> **Pre-release** — For evaluation only; do not use in production.\n\n'
            printf '## Changes'
            [ -n "$PREV_TAG" ] && printf ' since %s' "$PREV_TAG"
            printf '\n\n%s\n' "$BULLETS"
            [ -n "$PREV_TAG" ] && printf '\n**Full Changelog:** https://github.com/${{ github.repository }}/compare/%s...%s\n' \
              "$PREV_TAG" "$TAG"
          } > release-notes.md
          echo "--- release-notes.md raw preview ---"
          cat release-notes.md

      - name: Synthesize release notes with Claude
        id: polish
        continue-on-error: true
        # continue-on-error: this step only polishes wording — release-notes.md already has valid,
        # ready-to-ship content from the deterministic step above. A rejected/unentitled model call
        # (see dor-agent.yml) must never block cutting a release; worst case we ship the raw bullets.
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Read,Write"
          prompt: |
            Read `release-notes.md`. It contains a flat list of raw changelog bullets for
            Identity Atlas ${{ github.event.inputs.version }}, collected from merged PRs
            since the previous release.

            Rewrite it as polished GitHub release notes following these rules:

            1. Keep the blockquote banner at the top (if present) and the "Full Changelog"
               link at the bottom unchanged.
            2. Group bullets under `###` headings by theme (e.g. "Account Linking",
               "Omada IGA crawler", "Security fixes", "Bug fixes", "UI & accessibility").
               Don't create a heading for a single bullet — fold it under the closest
               related heading or a generic "Improvements" section.
            3. Drop bullets that fix something introduced in this same release. If one
               bullet adds feature X and another fixes a bug in X, the fix is internal —
               users upgrading from the previous release never saw X break.
            4. Drop CI, tooling, and pure-implementation bullets with no user-visible
               effect (workflow fixes, CmdletBinding additions, dependency bumps, etc.).
            5. Merge bullets that describe the same change in different words.
            6. Rewrite in user-facing language — focus on the effect for the user, not
               the implementation detail.

            Overwrite `release-notes.md` with the result.

      - name: Warn if release notes weren't polished
        if: steps.polish.outcome == 'failure'
        run: echo "::warning::Release notes polishing failed (model call rejected/unavailable) — shipping the raw changelog bullets instead. Check CLAUDE_CODE_OAUTH_TOKEN entitlements/subscription status."

      - name: Create GitHub pre-release with portable ZIP
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh release create "$TAG" \
            app/api/dist-node-launcher/IdentityAtlas-portable.zip \
            --title "$TAG" \
            --notes-file release-notes.md \
            --prerelease

      - name: Post run summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ✅ Pre-release tagged

          | | |
          |---|---|
          | **Tag** | \`${TAG}\` |
          | **Version** | \`${VERSION}\` |
          | **Commit** | \`$(git rev-parse --short HEAD)\` |

          docker-publish is now building \`:beta\` + \`:${VERSION}\` — check the [Actions tab](../../actions) for progress.

          > \`:latest\` is **not** affected. Users on \`docker-compose.prod.yml\` will not receive this build automatically.

          ### To test this pre-release
          \`\`\`yaml
          # docker-compose.override.yml
          services:
            web:
              image: ghcr.io/fortigi/identity-atlas:${VERSION}
            worker:
              image: ghcr.io/fortigi/identity-atlas-worker:${VERSION}
          \`\`\`
          EOF
