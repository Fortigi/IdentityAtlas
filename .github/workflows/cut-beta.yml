# ─── Cut a Pre-Release (Beta / RC / Alpha) ────────────────────────────────────
# Manually triggered. Tags a chosen ref with vX.Y.Z-beta.N (or -rc.N /
# -alpha.N), builds the two portable Windows ZIPs, creates a GitHub pre-release
# with both attached, and lets docker-publish push :beta + :X.Y.Z-beta.N.
#
# :latest is never touched — users on docker-compose.prod.yml are unaffected.
#
# Usage:
#   1. Go to Actions → Cut Beta → Run workflow
#   2. Enter the version (e.g. "5.3.0-beta.1") and optionally a ref (default: main)
#   3. The workflow creates tag v5.3.0-beta.1 on that ref — which must be a
#      commit on main (tools/release/Assert-ReleaseFromMain.ps1)
#   4. docker-publish builds and pushes :beta + :5.3.0-beta.1
#
# The weekly routes (release-weekly.yml → release-route.yml) cut most betas,
# through workflow_call with an exact commit SHA as ref.
#
# hotfix: true cuts the beta of the RELEASE LINE instead (release/X.Y: a stable
# tag plus Dependabot updates and `git cherry-pick -x` of main commits), checked
# in -Mode Hotfix. Its version is X.Y.(Z+1)-beta.N, which docker-publish gives
# only its own tag: :beta stays on the next minor's preview.
#
# dry_run: true does everything up to the tag but pushes no tag and creates no
# release, so nothing is published and docker-publish does not run.
#
# The steps are shared with Cut Release and Cut Hotfix in cut-tag.yml.
# ─────────────────────────────────────────────────────────────────────────────

name: Cut Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pre-release version (e.g. "5.3.0-beta.1", "5.3.0-rc.1", "5.3.0-alpha.1")'
        required: true
      ref:
        description: 'Branch, tag, or commit to cut from (default: main)'
        required: false
        default: 'main'
      hotfix:
        description: 'The ref is on the release line (release/X.Y), not on main'
        type: boolean
        default: false
      dry_run:
        description: 'Check and build everything, but push no tag and publish nothing'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        default: 'main'
      hotfix:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
    # Named, never `secrets: inherit` (releaseKeyEnvironment.guard.test.js).
    # BOT_PRIVATE_KEY is not passed at all: cut-tag.yml reads it from its own
    # release-automation environment, which a caller cannot hand in.
    secrets:
      BOT_APP_ID:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  cut-beta:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/cut-tag.yml
    with:
      kind: beta
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      # Release mode, unless the ref is on the release line: then it is checked
      # the way Cut Hotfix checks it.
      mode: ${{ inputs.hotfix && 'Hotfix' || 'Release' }}
      dry_run: ${{ inputs.dry_run }}
      notes_prompt: |
        Read `release-notes.md`. It contains a flat list of raw changelog bullets for
        Identity Atlas ${{ inputs.version }}, collected from merged PRs
        since the previous release.

        Rewrite it as polished GitHub release notes following these rules:

        1. Keep the blockquote banner at the top (if present) and the "Full Changelog"
           link at the bottom unchanged.
        2. Group bullets under `###` headings by theme (e.g. "Account Linking",
           "Omada IGA crawler", "Security fixes", "Bug fixes", "UI & accessibility").
           Don't create a heading for a single bullet — fold it under the closest
           related heading or a generic "Improvements" section.
        3. Drop bullets that fix something introduced in this same release. If one
           bullet adds feature X and another fixes a bug in X, the fix is internal —
           users upgrading from the previous release never saw X break.
        4. Drop CI, tooling, and pure-implementation bullets with no user-visible
           effect (workflow fixes, CmdletBinding additions, dependency bumps, etc.).
        5. Merge bullets that describe the same change in different words.
        6. Rewrite in user-facing language — focus on the effect for the user, not
           the implementation detail.

        Overwrite `release-notes.md` with the result.
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  summary:
    needs: cut-beta
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post run summary
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ needs.cut-beta.outputs.tag }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ needs.cut-beta.outputs.commit }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            HEADING="🧪 Dry run: pre-release checked, nothing published"
            NEXT="No tag was pushed and no release was created, so docker-publish does not run."
          else
            HEADING="✅ Pre-release tagged"
            NEXT="docker-publish is now building \`:beta\` + \`:${VERSION}\` — check the [Actions tab](../../actions) for progress."
          fi
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ${HEADING}

          | | |
          |---|---|
          | **Tag** | \`${TAG}\` |
          | **Version** | \`${VERSION}\` |
          | **Commit** | \`${COMMIT}\` |

          ${NEXT}

          > \`:latest\` is **not** affected. Users on \`docker-compose.prod.yml\` will not receive this build automatically.

          ### To test this pre-release
          \`\`\`yaml
          # docker-compose.override.yml
          services:
            web:
              image: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/identity-atlas:${VERSION}
            worker:
              image: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/identity-atlas-worker:${VERSION}
          \`\`\`
          EOF
