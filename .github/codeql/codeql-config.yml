paths-ignore:
  # scraper.js is intentionally designed to fetch arbitrary user-provided URLs.
  # SSRF is mitigated in scrapeOne() via protocol allowlist (http/https only) and
  # PRIVATE_HOST_RE deny-list for private/loopback addresses. Excluding the file
  # avoids a false-positive js/request-forgery alert that inline suppression
  # cannot silence without the GitHub Advanced Security inline-suppression setting.
  - app/api/src/llm/scraper.js

  # tools/crawlers/omada/discover.js fetches the Omada OData $metadata endpoint
  # on behalf of the admin wizard. The URL is admin-supplied (Omada can be
  # on-prem or SaaS) and scheme-validated to http/https before reaching this
  # file. The calling endpoint is protected by admin auth middleware.
  - tools/crawlers/omada/discover.js

  # tools/crawlers/midpoint/discover.js fetches the midPoint REST API (token
  # endpoint + object search) on behalf of the admin wizard. Same rationale as
  # omada/discover.js: admin-supplied URL, scheme-validated, admin auth required.
  - tools/crawlers/midpoint/discover.js
