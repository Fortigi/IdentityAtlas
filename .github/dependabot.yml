# Keep dependencies up to date automatically.
#
# github-actions: bumps SHA-pinned actions (both the digest and the # vX comment).
# docker:         bumps base image tags in Dockerfiles.
# npm:            bumps package.json dependencies.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Worker container (PowerShell)
  - package-ecosystem: "docker"
    directory: "/setup/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  # API + frontend runtime image
  - package-ecosystem: "docker"
    directory: "/app/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  # Node.js API dependencies
  - package-ecosystem: "npm"
    directory: "/app/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  # React UI dependencies
  - package-ecosystem: "npm"
    directory: "/app/ui"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    groups:
      # react and react-dom must always be the same version — group them
      # so Dependabot updates both in a single PR instead of independently.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # vite and its ecosystem plugins must move together — each plugin
      # declares a peer dep on a specific vite major range and breaks
      # silently (or hard) when vite is bumped without them.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "@tailwindcss/vite"
          - "vitest"
      # eslint flat-config packages must all be on the same major
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "globals"
