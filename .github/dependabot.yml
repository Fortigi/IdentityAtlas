# Keep dependencies up to date automatically.
#
# github-actions: bumps SHA-pinned actions (both the digest and the # vX comment).
# docker:         bumps base image tags in Dockerfiles.
# npm:            bumps package.json dependencies.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # codeql-action's init/autobuild/analyze steps are separate action paths
      # but MUST run at the same version — a mismatch fails the Analyze job with
      # "Loaded a configuration file for version X, but running version Y".
      # Group them so Dependabot bumps all three in a single PR instead of one
      # PR per sub-action (which is never internally consistent).
      #
      # Dependabot identifies these by their FULL sub-paths — `github/codeql-action/init`,
      # `.../autobuild`, `.../analyze` (see the per-PR dependabot branch names). The bare
      # `github/codeql-action*` glob did NOT match those sub-paths, so Dependabot still cut
      # one PR per sub-action (#635/#639). Match the sub-paths explicitly instead.
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
      # Everything else in one weekly PR. Ten Dependabot PRs opened within two
      # minutes each start a full PR Checks + Integration run (31 jobs), and on
      # 5 Nov 2026 that queued every job in the org for 14 minutes. Actions are
      # SHA-pinned and rarely break, so majors ride along here too. Dependabot puts
      # a dependency in the FIRST group that matches, so codeql-action above stays
      # its own (version-locked) PR.
      actions:
        patterns:
          - "*"

  # Worker container (PowerShell)
  - package-ecosystem: "docker"
    directory: "/setup/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  # API + frontend runtime image
  - package-ecosystem: "docker"
    directory: "/app/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    ignore:
      # A Node MAJOR upgrade is a deliberate, repo-wide change: `.nvmrc` is the
      # single source of truth and the node-version gate (tools/node-version/
      # ratchet.py) requires every `FROM node:<v>`, workflow `node-version:`,
      # `engines.node`, `.ps1` docker-run pin and `.mjs` NODE_VERSION to agree
      # with it. Dependabot only ever bumps app/api/Dockerfile, so its major
      # bumps leave app/ui/Dockerfile, the nightly runner and .nvmrc behind and
      # can never pass that gate — they're pure noise.
      #
      # Suppress them by update TYPE, not by enumerating majors. The previous
      # rule listed `["26.*", ">= 27"]` (#322, written when the open PR was
      # 24 -> 26) and left an unnoticed hole at 25, which Dependabot walked
      # straight through the moment Node 25 shipped (#951). An update-type
      # bound cannot develop new holes. Minor/patch bumps still come through.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Standalone frontend dev container (app/ui/Dockerfile). Watched so its base
  # image still gets security/patch bumps — without an entry here it was the one
  # `FROM node:` in the repo Dependabot never looked at, and could sit on an
  # unpatched tag indefinitely. Same major suppression as /app/api above.
  - package-ecosystem: "docker"
    directory: "/app/ui"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Node.js API dependencies
  - package-ecosystem: "npm"
    directory: "/app/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    groups:
      # `@vitest/coverage-v8` pins an EXACT peer on its matching `vitest`
      # ("peer vitest@5.0.0"), so a PR moving one without the other can never
      # install — `npm ci` dies with ERESOLVE and every downstream job (lint,
      # unit, contract, integration, e2e, Socket) fails on that one step.
      # This entry had no groups at all, so Dependabot cut #1177 (coverage-v8
      # -> 5) and #1179 (vitest -> 5) as separate PRs, each holding the
      # other's missing half and both permanently red. Group them so the pair
      # always moves in a single PR.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Catch-all for the rest: every remaining minor/patch bump in one weekly PR,
      # instead of one PR (and one full CI run) per package — see the `actions`
      # group above for the queueing cost. Listed LAST because Dependabot assigns a
      # dependency to the first group that matches, so `vitest` keeps its pair
      # together. Majors are left out on purpose: one breaking bump would hold every
      # safe patch hostage in a red group, so a major still arrives as its own PR.
      api-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # React UI dependencies
  - package-ecosystem: "npm"
    directory: "/app/ui"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    groups:
      # react and react-dom must always be the same version — group them
      # so Dependabot updates both in a single PR instead of independently.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # vite and its React plugin + test runner must move together — each
      # declares a peer dep on a specific vite major range.
      #
      # `@vitest/*` belongs here too: `@vitest/coverage-v8` pins an EXACT peer
      # on its matching `vitest` ("peer vitest@5.0.0"). The bare `vitest`
      # pattern does NOT match the scoped `@vitest/coverage-v8`, so the group
      # took `vitest` while coverage-v8 was cut as its own PR — #1169 and
      # #1181, each the other's missing half, neither able to `npm ci`. Same
      # failure shape as the codeql-action sub-path glob above.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      # tailwindcss core and its plugins are always released together and
      # must stay on the same version. Independent of vite — tailwindcss
      # itself has no vite peer dep.
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # eslint flat-config packages must all be on the same major
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "globals"
      # Catch-all, last on purpose — same reasoning as `api-minor-patch` above.
      ui-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─── The stable release line: release/6.1 ──────────────────────────────────
  #
  # Customers on :latest run the newest stable minor, not main. Its patch
  # releases (6.1.2, 6.1.3 …) are cut from release/6.1, one per night that this
  # branch moved (release-nightly.yml, the stable route). Only the NEWEST stable
  # minor is maintained: when Cut Release cuts 6.2.0 it creates release/6.2 and
  # opens a PR that moves every `target-branch` below to it, and 6.1 stops.
  # docs/contributing/release-process.md has the whole route.
  #
  # Two things about how Dependabot reads this are easy to get wrong:
  #
  #   * This file is only ever read from the DEFAULT branch. These entries live
  #     on main and describe work done on the release line — copying them onto
  #     the release branch does nothing.
  #   * `target-branch` is a VERSION-UPDATES-ONLY option. Alert-driven security
  #     updates ignore it and always go to main. That is why these run DAILY: a
  #     daily version check picks up the fixed release of a vulnerable package
  #     within a day on its own.
  #
  # Each update merges itself once CI is green (dependabot-auto-merge.yml) and
  # is released without being on main: the one exception to "main first",
  # checked narrowly by tools/release/Assert-ReleaseFromMain.ps1 (Dependabot's,
  # merged through a PR, only versions in package.json / package-lock.json /
  # Dockerfile FROM lines).
  #
  # `dependency-type: production`: the API image is built with
  # `npm ci --omit=dev` and the UI ships compiled dist/, so eslint / vitest /
  # playwright change nothing a customer runs. On a stable line they are risk
  # with no upside.
  #
  # Majors are ignored here: a major is the one update expected to change
  # behaviour, and it reaches customers with the next minor, after main and a
  # full release test. The catch: a security fix that only exists in a new
  # major arrives with that minor, not overnight.
  #
  # All four entries must name the same branch: the nightly plan warns, and
  # test/unit/ReleaseNightly.Tests.ps1 fails, when they do not.

  - package-ecosystem: "npm"
    directory: "/app/api"
    target-branch: "release/6.1"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "build"
    allow:
      - dependency-type: "production"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per day rather than one per package: one CI run, one merge.
      api-production:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/app/ui"
    target-branch: "release/6.1"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "build"
    allow:
      - dependency-type: "production"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      ui-production:
        patterns:
          - "*"

  # Base images carry most of what a container scanner reports, so they matter
  # to the release line more than any npm package does.
  - package-ecosystem: "docker"
    directory: "/app/api"
    target-branch: "release/6.1"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/setup/docker"
    target-branch: "release/6.1"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
