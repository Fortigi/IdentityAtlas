# Keep dependencies up to date automatically.
#
# github-actions: bumps SHA-pinned actions (both the digest and the # vX comment).
# docker:         bumps base image tags in Dockerfiles.
# npm:            bumps package.json dependencies.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Worker container (PowerShell)
  - package-ecosystem: "docker"
    directory: "/setup/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  # API + frontend runtime image
  - package-ecosystem: "docker"
    directory: "/app/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  # Node.js API dependencies
  - package-ecosystem: "npm"
    directory: "/app/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  # React UI dependencies
  - package-ecosystem: "npm"
    directory: "/app/ui"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
