# Keep dependencies up to date automatically.
#
# github-actions: bumps SHA-pinned actions (both the digest and the # vX comment).
# docker:         bumps base image tags in Dockerfiles.
# npm:            bumps package.json dependencies.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # codeql-action's init/autobuild/analyze steps are separate action paths
      # but MUST run at the same version — a mismatch fails the Analyze job with
      # "Loaded a configuration file for version X, but running version Y".
      # Group them so Dependabot bumps all three in a single PR instead of one
      # PR per sub-action (which is never internally consistent).
      #
      # Dependabot identifies these by their FULL sub-paths — `github/codeql-action/init`,
      # `.../autobuild`, `.../analyze` (see the per-PR dependabot branch names). The bare
      # `github/codeql-action*` glob did NOT match those sub-paths, so Dependabot still cut
      # one PR per sub-action (#635/#639). Match the sub-paths explicitly instead.
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"

  # Worker container (PowerShell)
  - package-ecosystem: "docker"
    directory: "/setup/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  # API + frontend runtime image
  - package-ecosystem: "docker"
    directory: "/app/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    ignore:
      # A Node MAJOR upgrade is a deliberate, repo-wide change: `.nvmrc` is the
      # single source of truth and the node-version gate (tools/node-version/
      # ratchet.py) requires every `FROM node:<v>`, workflow `node-version:`,
      # `engines.node`, `.ps1` docker-run pin and `.mjs` NODE_VERSION to agree
      # with it. Dependabot only ever bumps app/api/Dockerfile, so its major
      # bumps leave app/ui/Dockerfile, the nightly runner and .nvmrc behind and
      # can never pass that gate — they're pure noise.
      #
      # Suppress them by update TYPE, not by enumerating majors. The previous
      # rule listed `["26.*", ">= 27"]` (#322, written when the open PR was
      # 24 -> 26) and left an unnoticed hole at 25, which Dependabot walked
      # straight through the moment Node 25 shipped (#951). An update-type
      # bound cannot develop new holes. Minor/patch bumps still come through.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Standalone frontend dev container (app/ui/Dockerfile). Watched so its base
  # image still gets security/patch bumps — without an entry here it was the one
  # `FROM node:` in the repo Dependabot never looked at, and could sit on an
  # unpatched tag indefinitely. Same major suppression as /app/api above.
  - package-ecosystem: "docker"
    directory: "/app/ui"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Node.js API dependencies
  - package-ecosystem: "npm"
    directory: "/app/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    groups:
      # `@vitest/coverage-v8` pins an EXACT peer on its matching `vitest`
      # ("peer vitest@5.0.0"), so a PR moving one without the other can never
      # install — `npm ci` dies with ERESOLVE and every downstream job (lint,
      # unit, contract, integration, e2e, Socket) fails on that one step.
      # This entry had no groups at all, so Dependabot cut #1177 (coverage-v8
      # -> 5) and #1179 (vitest -> 5) as separate PRs, each holding the
      # other's missing half and both permanently red. Group them so the pair
      # always moves in a single PR.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  # React UI dependencies
  - package-ecosystem: "npm"
    directory: "/app/ui"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    groups:
      # react and react-dom must always be the same version — group them
      # so Dependabot updates both in a single PR instead of independently.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # vite and its React plugin + test runner must move together — each
      # declares a peer dep on a specific vite major range.
      #
      # `@vitest/*` belongs here too: `@vitest/coverage-v8` pins an EXACT peer
      # on its matching `vitest` ("peer vitest@5.0.0"). The bare `vitest`
      # pattern does NOT match the scoped `@vitest/coverage-v8`, so the group
      # took `vitest` while coverage-v8 was cut as its own PR — #1169 and
      # #1181, each the other's missing half, neither able to `npm ci`. Same
      # failure shape as the codeql-action sub-path glob above.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      # tailwindcss core and its plugins are always released together and
      # must stay on the same version. Independent of vite — tailwindcss
      # itself has no vite peer dep.
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # eslint flat-config packages must all be on the same major
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "globals"
